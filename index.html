  function drawMenu() {
    // dim the screen
    ctx.fillStyle = "rgba(15,56,15,0.55)";
    ctx.fillRect(0, 0, W, H);

    if (aquariumOpen) { drawAquarium(); return; }
    if (inventoryOpen) { drawInventory(); return; }
    if (collectionOpen) { drawCollection(); return; }
    if (shopOpen) { drawShop(); return; }
    if (zoneOpen) { drawZoneSelect(); return; }

    // panel
    const pw = 120, ph = 20 + paused.items.length * 12 + (menuMsg ? 12 : 0);
    const px = (W - pw) / 2, py = 28;
    ctx.fillStyle = PAL.textBg; ctx.fillRect(px, py, pw, ph);
    ctx.strokeStyle = PAL.dark; ctx.lineWidth = 1; ctx.strokeRect(px+0.5, py+0.5, pw-1, ph-1);
    // title (translated)
    ctx.fillStyle = PAL.dark; ctx.fillRect(px, py, pw, 12);
    text(menuLabel(paused.title), px + 6, py + 2, PAL.textBg);
    // items
    paused.items.forEach((it, i) => {
      const iy = py + 16 + i * 12;
      const lbl = menuLabel(it);
      if (i === menuIndex) {
        ctx.fillStyle = "#3fae5a";
        ctx.fillRect(px + 3, iy - 1, pw - 6, 11);
        text("\u25B6 " + lbl, px + 6, iy, PAL.dark);
      } else {
        text("  " + lbl, px + 6, iy, PAL.text);
      }
    });
    // transient message
    if (menuMsg) text(menuMsg, px + 6, py + 16 + paused.items.length * 12, "#8a2c2c");
    // hint
    textBox("B=OK  A=CHIUDI", 6, 130);
  }

  // Aquarium: tank with the caught fish swimming around
  function drawAquarium() {
    const tx = 8, ty = 16, tw = W - 16, th = 108;
    // water
    const wg = ctx.createLinearGradient(0, ty, 0, ty+th);
    wg.addColorStop(0, "#2a6ec2"); wg.addColorStop(1, "#173f7a");
    ctx.fillStyle = wg; ctx.fillRect(tx, ty, tw, th);

    const floorY = ty + th - 8;
    // sand
    ctx.fillStyle = "#d8c98a"; ctx.fillRect(tx, floorY, tw, 8);
    ctx.fillStyle = "#c8b878"; ctx.fillRect(tx, floorY, tw, 2);

    // seaweed plants (swaying)
    drawSeaweed(tx + 14,  floorY, 5, "#2e8b57");
    drawSeaweed(tx + 34,  floorY, 4, "#3fae5a");
    drawSeaweed(tx + tw-16, floorY, 6, "#2e8b57");
    drawSeaweed(tx + tw-34, floorY, 4, "#46b36a");

    // corals (six little ones)
    drawCoral(tx + 24,  floorY, "#e0705a");
    drawCoral(tx + 52,  floorY, "#e090a0");
    drawCoral(tx + 78,  floorY, "#d8a050");
    drawCoral(tx + 100, floorY, "#e0705a");
    drawCoral(tx + 120, floorY, "#c86a8a");
    drawCoral(tx + tw-8, floorY, "#e090a0");

    // starfish on the sand
    drawStarfish(tx + 44, floorY + 3, "#e0603a");
    drawStarfish(tx + 92, floorY + 4, "#f0a040");

    // seahorse swaying near a plant
    drawSeahorse(tx + tw - 26, floorY - 14, "#e8c040");
    drawSeahorse(tx + 66, floorY - 10, "#c88ad8");

    // rising bubbles
    for (let i = 0; i < 6; i++) {
      const bx = tx + 12 + (i*23) % (tw-20);
      const by = floorY - ((frame*0.6 + i*30) % (th-16));
      ctx.fillStyle = "rgba(200,235,245,0.5)";
      ctx.fillRect(bx, by, 2, 2);
    }

    // glass frame + title
    ctx.strokeStyle = "#bfe3f5"; ctx.lineWidth = 2; ctx.strokeRect(tx+1, ty+1, tw-2, th-2);
    ctx.fillStyle = PAL.dark; ctx.fillRect(tx, ty-12, tw, 12);
    text(t("aquarium").toUpperCase() + " (" + aquarium.length + ")", tx + 4, ty - 10, PAL.textBg);

    if (aquarium.length === 0) {
      text("Ancora vuoto...", tx + 20, ty + 40, PAL.white);
      text("Pesca qualcosa!", tx + 20, ty + 52, "#bfe3f5");
      textBox("A = INDIETRO", 6, 130);
      return;
    }

    // fish swim freely; remember selected position only if pointer is active
    if (aqIndex >= aquarium.length) aqIndex = 0;
    let selX = 0, selY = 0;
    aquarium.forEach((fish, i) => {
      const baseX = tx + 16 + ((i * 37) % (tw - 32));
      const baseY = ty + 14 + ((i * 23) % (th - 40));
      const sw = Math.sin((frame*0.03) + i) * 8;
      const bob = Math.cos((frame*0.025) + i*1.3) * 4;
      const dir = Math.cos((frame*0.03) + i) >= 0 ? 1 : -1;
      const col = fish.color || "#5aa0d8";
      const fin = fish.fin || "#3f7fb8";
      let fx = baseX + sw, fy = baseY + bob;
      if (fish.crab) {
        // crabs scuttle along the bottom
        fy = ty + th - 12;
        fx = tx + 12 + ((i * 41 + frame*0.3) % (tw - 24));
      }
      drawCreature(fish, fx, fy, (fish.crab?1.5:1.6) * (fish.tierScale || 1), dir);
      if (i === aqIndex) { selX = fx; selY = fy; }
    });

    // pointer + name ONLY when toggled on with B
    if (aqPointer) {
      ctx.strokeStyle = (Math.floor(frame/6)%2===0) ? "#ffe14d" : "#ffffff";
      ctx.lineWidth = 1;
      ctx.strokeRect(selX-11, selY-9, 22, 18);
      const sel = aquarium[aqIndex];
      const nm = fishName(sel) + "  " + (sel.size ? Math.round(sel.size*40+10) + "cm" : "");
      const nw = nm.length * 5 + 8;
      const nx = Math.max(tx+2, Math.min(tx+tw-nw-2, selX - nw/2));
      const ny = Math.max(ty+2, selY-22);
      ctx.fillStyle = PAL.textBg; ctx.fillRect(nx, ny, nw, 10);
      ctx.strokeStyle = PAL.dark; ctx.strokeRect(nx+0.5, ny+0.5, nw-1, 9);
      text(nm, nx + 4, ny + 1, PAL.text);
      textBox(fromTown ? t("back_town") : t("aq_release"), 6, 130);
    } else {
      textBox(fromTown ? t("back_town") : t("aq_names"), 6, 130);
    }

    // confirmation dialog for emptying the whole aquarium
    if (aqConfirmEmpty) {
      ctx.fillStyle = "rgba(15,56,15,0.7)"; ctx.fillRect(0,0,W,H);
      const dw = 128, dh = 44, dx = (W-dw)/2, dy = 50;
      ctx.fillStyle = PAL.textBg; ctx.fillRect(dx, dy, dw, dh);
      ctx.strokeStyle = PAL.dark; ctx.lineWidth = 1; ctx.strokeRect(dx+0.5, dy+0.5, dw-1, dh-1);
      ctx.textAlign = "center";
      text(t("empty_q"), W/2, dy+6, "#8a2c2c");
      text(t("empty_sub"), W/2, dy+18, PAL.text);
      ctx.textAlign = "left";
      text("B = " + t("yes"), dx+10, dy+32, "#2e6a2c");
      text("A = " + t("no"), dx+dw-40, dy+32, "#8a2c2c");
    }
  }

  // Swaying seaweed plant made of stacked segments
  function drawSeaweed(x, baseY, segments, color) {
    ctx.fillStyle = color;
    for (let s = 0; s < segments; s++) {
      const sway = Math.sin(frame*0.05 + s*0.6 + x) * (s * 0.6);
      ctx.fillRect(x + sway - 1, baseY - (s+1)*4, 3, 4);
    }
  }

  // Small coral clump
  function drawCoral(x, baseY, color) {
    ctx.fillStyle = color;
    ctx.fillRect(x-1, baseY-4, 2, 4);
    ctx.fillRect(x-3, baseY-6, 2, 4);
    ctx.fillRect(x+1, baseY-6, 2, 4);
    ctx.fillRect(x-1, baseY-8, 2, 3);
  }

  // Little starfish
  function drawStarfish(x, y, color) {
    ctx.fillStyle = color;
    ctx.fillRect(x-1, y-2, 2, 5);   // vertical
    ctx.fillRect(x-2, y-1, 5, 2);   // horizontal
    ctx.fillRect(x-2, y+1, 1, 1);   // legs
    ctx.fillRect(x+1, y+1, 1, 1);
  }

  // Tiny seahorse (swaying)
  function drawSeahorse(x, baseY, color) {
    const s = Math.sin(frame*0.06 + x) * 1.5;
    ctx.fillStyle = color;
    ctx.fillRect(x + s, baseY, 3, 3);       // head
    ctx.fillRect(x+3 + s, baseY+1, 1, 1);   // snout
    ctx.fillRect(x + s, baseY+3, 3, 3);     // body
    ctx.fillRect(x + s, baseY+6, 2, 2);     // curl
    ctx.fillRect(x-1 + s, baseY+7, 1, 1);   // tail
    ctx.fillStyle = "#000";
    ctx.fillRect(x+1 + s, baseY+1, 1, 1);   // eye
  }

  // Inventory: list of baits with stock; highlight selection and equipped bait
  function drawInventory() {
    const list = baitList();
    const pw = 132, ph = 20 + list.length * 16 + 4;
    const px = (W - pw) / 2, py = 24;
    ctx.fillStyle = PAL.textBg; ctx.fillRect(px, py, pw, ph);
    ctx.strokeStyle = PAL.dark; ctx.lineWidth = 1; ctx.strokeRect(px+0.5, py+0.5, pw-1, ph-1);
    // title
    ctx.fillStyle = PAL.dark; ctx.fillRect(px, py, pw, 12);
    text(t("baits"), px + 6, py + 2, PAL.textBg);

    list.forEach((key, i) => {
      const b = BAITS[key];
      const iy = py + 16 + i * 16;
      if (i === invIndex) {
        ctx.fillStyle = "#3fae5a";
        ctx.fillRect(px + 3, iy - 2, pw - 6, 15);
      }
      // bait color dot
      ctx.fillStyle = b.color; ctx.fillRect(px + 6, iy + 1, 6, 6);
      // name
      const nameCol = (i === invIndex) ? PAL.dark : PAL.text;
      text(baitName(key), px + 16, iy, nameCol);
      // stock / permanent
      const qty = (key === "verme") ? "\u221E" : String(baitStock[key] || 0);
      text("x" + qty, px + pw - 40, iy, nameCol);
      // equipped marker
      if (key === equippedBait) text("[E]", px + pw - 20, iy, "#8a2c2c");
    });

    if (menuMsg) text(menuMsg, px + 6, py + ph + 2, "#2e6a2c");
    textBox(t("use"), 6, 130);
  }

  // Collection (Fishdex): grid of all species in the current location.
  // Caught = colored sprite; missing = dark silhouette.
  function drawCollection() {
    const loc = LOCATIONS[currentLocation];
    const rows = collectionRows();
    const species = collectionSpecies();
    const total = species.length;
    const got = species.filter(e => caught[currentLocation + ":" + e.sp.name]).length;

    // panel
    const px = 6, py = 16, pw = W - 12, ph = 112;
    ctx.fillStyle = "#173f7a"; ctx.fillRect(px, py, pw, ph);
    ctx.fillStyle = PAL.dark; ctx.fillRect(px, py, pw, 12);
    text(locName(loc) + "  " + got + "/" + total, px + 4, py + 2, PAL.textBg);
    // award medals for THIS location (top-right): bronze, silver, gold slots
    const award = locationAward(currentLocation);
    [1,2,3].forEach((rank, i) => {
      const mx = px + pw - 44 + i*15, my = py + 6;
      drawHookMedal(mx, my, 0.85, award >= rank ? rank : 0);
    });

    // scrollable content area (below the title bar)
    const viewTop = py + 13, viewBot = py + ph - 1, viewH = viewBot - viewTop;
    const rowH = 30;              // height per category block (header + icons)
    const contentTop = 0;         // logical y of first row
    // compute selected cursor's logical Y to drive scrolling
    const selLogicalY = collRow * rowH + 14;
    // keep selection roughly centered/visible
    const targetScroll = Math.max(0, Math.min(rows.length*rowH - viewH, selLogicalY - viewH/2 + 10));
    collScroll += (targetScroll - collScroll) * 0.3;   // smooth
    if (Math.abs(targetScroll - collScroll) < 0.5) collScroll = targetScroll;

    // clip to the view area
    ctx.save();
    ctx.beginPath(); ctx.rect(px+1, viewTop, pw-2, viewH); ctx.clip();

    let selInfo = null;
    rows.forEach((row, ri) => {
      const rowY = viewTop + ri * rowH - collScroll + 4;
      // category header
      ctx.fillStyle = TIERS[row.tier].color;
      ctx.fillRect(px + 4, rowY + 1, 4, 4);
      text(catLabel(row.tier), px + 12, rowY, "#bfe3f5");
      // fish icons
      row.list.forEach((sp, j) => {
        const cx = px + 16 + j * 26;
        const cy = rowY + 18;
        const isCaught = !!caught[currentLocation + ":" + sp.name];
        // gentle per-tier scaling so the grid stays readable
        const ts = TIERS[row.tier].sizeScale;
        const gScale = 0.9 + (ts - 0.75) * 0.5;   // ~0.9 (F1) .. ~1.4 (F4)
        if (isCaught) {
          drawCreature(sp, cx, cy, gScale, 1);
        } else {
          const dark = Object.assign({}, sp, { color:"#0d2244", fin:"#0d2244", ghost:false });
          drawCreature(dark, cx, cy, gScale, 1);
          text("?", cx-2, cy-3, "#4a6a9a");
        }
        if (ri === collRow && j === collCol) selInfo = { cx, cy, sp, isCaught };
      });
    });

    // selection cursor + name (inside clip)
    if (selInfo) {
      ctx.strokeStyle = (Math.floor(frame/6)%2===0) ? "#ffe14d" : "#ffffff";
      ctx.lineWidth = 1;
      ctx.strokeRect(selInfo.cx-11, selInfo.cy-9, 22, 18);
      const nm = selInfo.isCaught ? fishName(selInfo.sp) : "???";
      const nw = nm.length * 5 + 8;
      const nx = Math.max(px+2, Math.min(px+pw-nw-2, selInfo.cx - nw/2));
      const ny = selInfo.cy + 9;
      ctx.fillStyle = PAL.textBg; ctx.fillRect(nx, ny, nw, 10);
      ctx.strokeStyle = PAL.dark; ctx.strokeRect(nx+0.5, ny+0.5, nw-1, 9);
      text(nm, nx + 4, ny + 1, PAL.text);
    }
    ctx.restore();

    // panel border on top of clipped content
    ctx.strokeStyle = "#bfe3f5"; ctx.lineWidth = 1; ctx.strokeRect(px+0.5, py+0.5, pw-1, ph-1);
    // scroll arrows
    if (collScroll > 1) text("\u25B2", px+pw-10, viewTop, "#bfe3f5");
    if (collScroll < rows.length*rowH - viewH - 1) text("\u25BC", px+pw-10, viewBot-9, "#bfe3f5");

    textBox(t("arrows_exit"), 6, 130);
  }

  // Rows for the Fishdex: one per tier, in order (comuni -> rari)
  function collectionRows() {
    const loc = LOCATIONS[currentLocation];
    return [1,2,3,4].map(t => ({ tier: t, list: loc.fish[t] }));
  }
  // Flat, tier-ordered list of species (for counting)
  function collectionSpecies() {
    const loc = LOCATIONS[currentLocation];
    const all = [];
    [1,2,3,4].forEach(t => loc.fish[t].forEach(sp => all.push({ sp, tier:t })));
    return all;
  }

  // Shop: buy consumable baits with coins
  function drawShop() {
    const list = shopList();

    const px = (W - pw) / 2, py = 22;

    ctx.strokeStyle = PAL.dark; ctx.lineWidth = 1; ctx.strokeRect(px+0.5, py+0.5, pw-1, ph-1);

      const b = BAITS[key];

      ctx.fillStyle = b.color; ctx.fillRect(px + 6, iy + 1, 6, 6);

  // Zone select: choose the fishing location, with completion count
  function drawZoneSelect() {
    const list = locationList();
    const pw = 140, ph = 24 + list.length * 20;
    const px = (W - pw) / 2, py = 24;
    ctx.fillStyle = PAL.textBg; ctx.fillRect(px, py, pw, ph);
    ctx.strokeStyle = PAL.dark; ctx.lineWidth = 1; ctx.strokeRect(px+0.5, py+0.5, pw-1, ph-1);
    ctx.fillStyle = PAL.dark; ctx.fillRect(px, py, pw, 12);
    text("CAMBIA ZONA", px + 4, py + 2, PAL.textBg);

    list.forEach((key, i) => {
      const loc = LOCATIONS[key];
      const iy = py + 16 + i * 20;
      if (i === zoneIndex) { ctx.fillStyle = "#3fae5a"; ctx.fillRect(px + 3, iy - 2, pw - 6, 19); }
      const col = (i === zoneIndex) ? PAL.dark : PAL.text;
      // count caught in this location
      const species = [1,2,3,4].reduce((a,t)=>a.concat(loc.fish[t]),[]);
