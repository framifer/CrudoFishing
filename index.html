  const walker = { c: 3, r: 12, px: 0, py: 0, tc: 3, tr: 12, moving:false, dir:"down", step:0, animT:0 };
  let townEnter = 0;      // >0 while a building-entry animation plays
  let townEnterTarget = null; // {tx,ty,action}
  let fromTown = false;   // if true, closing a menu/hut returns to the town hub
  function townPixel(c, r){ return { x: c*TILE + TILE/2, y: TOWN_TOP + r*TILE + TILE/2 }; }

  function openTown(){
    walker.c = 9; walker.r = 6; walker.tc = 9; walker.tr = 6; walker.moving = false; walker.dir = "down";
    const p = townPixel(walker.c, walker.r); walker.px = p.x; walker.py = p.y;
    townEnter = 0;   // reset the entering-building animation
    screen = "town";
    blockAUntilRelease = true;
  }

  function updateTown(dt){
    // building-entry animation in progress
    if (townEnter > 0) {
      townEnter -= dt;
      // walk the character up into the door
      if (townEnterTarget) { walker.py -= 14 * dt; }
      if (townEnter <= 0) {
        const act = townEnterTarget ? townEnterTarget.action : null;
        townEnterTarget = null;
        fromTown = true;
        if (act === "hut") { openCreator(false); }
        else if (act === "shop") { resetCast(); screen = "game"; openMenu("SELECT"); shopOpen = true; shopIndex = 0; }
        else if (act === "tank") { resetCast(); screen = "game"; openMenu("SELECT"); aquariumOpen = true; aqIndex = 0; aqPointer = false; }
      }
      return;
    }

    // open pause / menus still available
    if (paused) { updateMenu(); return; }
    if (consumePress("start"))  { openMenu("START");  return; }
    if (consumePress("select")) { openMenu("SELECT"); return; }

    if (walker.moving) {
      const tgt = townPixel(walker.tc, walker.tr);
      const spd = 55 * dt;
      const dx = tgt.x - walker.px, dy = tgt.y - walker.py;
      const dist = Math.hypot(dx, dy);
      walker.animT += dt;
      if (dist <= spd) {
        walker.px = tgt.x; walker.py = tgt.y; walker.c = walker.tc; walker.r = walker.tr; walker.moving = false;
        // reached the fishing jetty END -> start fishing
        if (townTile(walker.c, walker.r) === "E") { SFX.splash(); resetCast(); screen = "game"; blockAUntilRelease = true; }
        // reached the end of the departures jetty -> change zone
        else if (townTile(walker.c, walker.r) === "P" && townTile(walker.c, walker.r+1) === "Q") {
          SFX.start(); screen = "map"; mapIndex = locationList().indexOf(currentLocation); blockAUntilRelease = true;
        }
      } else {
        walker.px += dx/dist*spd; walker.py += dy/dist*spd;
      }
      return;
    }

    // movement
    let nc = walker.c, nr = walker.r, dir = null;
    if (keys.up)    { nr--; dir="up"; }
    else if (keys.down)  { nr++; dir="down"; }
    else if (keys.left)  { nc--; dir="left"; }
    else if (keys.right) { nc++; dir="right"; }
    if (dir) {
      walker.dir = dir;
      if (townWalkable(nc, nr)) { walker.tc = nc; walker.tr = nr; walker.moving = true; }
    }

    // interact with the tile in front (A or B)
    if (consumePress("a") || consumePress("b")) {
      const fc = walker.c + (walker.dir==="left"?-1:walker.dir==="right"?1:0);
      const fr = walker.r + (walker.dir==="up"?-1:walker.dir==="down"?1:0);
      const tl = townTile(fc, fr);
      if (tl === "H") { SFX.door(); townEnter = 0.55; townEnterTarget = { action:"hut" }; }
      else if (tl === "S") { SFX.door(); townEnter = 0.55; townEnterTarget = { action:"shop" }; }
      else if (tl === "T") { SFX.door(); townEnter = 0.55; townEnterTarget = { action:"tank" }; }
      else if (tl === "N") { showNpcDialog(); }
      else if (tl === "Q") { SFX.start(); screen = "map"; mapIndex = locationList().indexOf(currentLocation); blockAUntilRelease = true; }
      else if (tl === "E" || tl === "D") { SFX.splash(); resetCast(); screen = "game"; blockAUntilRelease = true; }
    }
  }

  // The guide NPC explains how to unlock the next location.
  function showNpcDialog(){
    SFX.b();
    let lines;
    if (lang === "en") {
      lines = [
        "Ahoy, angler! To sail to the next spot you must fish here first 3 common fishes, 2 fine fishes, 2 prime fishes.",
        "",
        "Keep fishing to complete the quota!"
      ];
    } else {
      lines = [
        "Ehila', pescatore! Per salpare verso la prossima meta devi prima pescare qui 3 pesci comuni, 2 pesci pregiati, 2 pesci ottimi.",
        "",
        "Continua a pescare per completare la quota!"
      ];
    }
    showStory(lang==="en"?"THE HARBOURMASTER":"IL CAPITANO", lines, () => { openTown(); });
  }

  function drawTown(){
    // title bar
    ctx.fillStyle = PAL.dark; ctx.fillRect(0,0,W,TOWN_TOP-2);
    text(locName(currentLocation), 4, 3, PAL.textBg);
    drawCoinsHUD();

    const TH = townTheme();
    const wA=TH.water, wB=shade(TH.water,0.18);
    const grA=TH.grassA, grB=shade(TH.grassA,-0.08), path="#e6d8b0", pathB="#d2c090";
    const m = townMap();

    // ground pass (FRLG-style grass + light path + banded sea)
    for (let r = 0; r < TOWN_ROWS; r++) {
      for (let c = 0; c < TOWN_COLS; c++) {
        const x = c*TILE, y = TOWN_TOP + r*TILE, tl = m[r][c];
        const sea = (tl === "~" || tl === "D" || tl === "E" || tl === "P" || tl === "Q");
        if (sea) {
          ctx.fillStyle = wA; ctx.fillRect(x,y,TILE,TILE);
          if (((c + r*2 + Math.floor(frame*0.05)) % 5) === 0) { ctx.fillStyle = wB; ctx.fillRect(x, y+3, 5, 1); }
        } else {
          // grass with a soft two-tone FRLG texture
          ctx.fillStyle = grA; ctx.fillRect(x,y,TILE,TILE);
          ctx.fillStyle = grB; ctx.fillRect(x, y+4, TILE, 1); ctx.fillRect(x+4, y+1, 1, 1); ctx.fillRect(x+1, y+6, 1, 1);
          // walkable path (light sandy road)
          if (tl === "=" || tl === "." || tl === "N") { ctx.fillStyle=path; ctx.fillRect(x,y,TILE,TILE);
            ctx.fillStyle=pathB; ctx.fillRect(x,y+7,TILE,1); ctx.fillRect(x+7,y,1,TILE); }
        }
      }
    }

    // ---- three buildings spread across the top ----
    drawBuilding(1, 1, 3, 2, TH.roof, TH.wall, "H");                     // Hut (left)
    drawBuilding(7, 1, 3, 2, shade(TH.roof,-0.05), TH.wall, "S");        // Shop (centre)
    drawBuilding(13, 1, 3, 2, shade(TH.roof,0.06), TH.wall, "T");        // Tank (right)
    drawSign(2.5*TILE, TOWN_TOP+3*TILE+1, lang==="en"?"HUT":"CABINA");
    drawSign(8.5*TILE, TOWN_TOP+3*TILE+1, lang==="en"?"SHOP":"NEGOZIO");
    drawSign(14.5*TILE, TOWN_TOP+3*TILE+1, lang==="en"?"TANK":"ACQUARIO");

    // ---- decorations: flower beds & bushes to make it cuter ----
    drawFlowers(5, 4); drawFlowers(11, 4); drawBush(0, 4); drawBush(0, 5);
    drawBush(17, 1); drawBush(18, 2);

    // ---- fishing jetty (cols 2-3) ----
    drawPlanks(2,3,7,10);
    drawSign(2.5*TILE, TOWN_TOP+6*TILE+4, lang==="en"?"CREEK":"MOLO");
    if (Math.floor(frame/16)%2===0){ ctx.fillStyle="#dff0fb"; ctx.fillRect(2*TILE+2, TOWN_TOP+11*TILE, 8, 1); }

    // ---- departures jetty (cols 14-15) with a boat ----
    drawPlanks(14,15,7,9);
    drawBoatDock(14*TILE, TOWN_TOP+9*TILE);
    drawSign(14.5*TILE, TOWN_TOP+6*TILE+4, lang==="en"?"DEPARTURES":"PARTENZE");

    // palms on the right edge
    for (let r=0;r<TOWN_ROWS;r++){ if (m[r][19]==="B"){ const x=19*TILE,y=TOWN_TOP+r*TILE;
      ctx.fillStyle="#7a4e26"; ctx.fillRect(x+3,y+5,2,3);
      ctx.fillStyle="#1f6a2a"; ctx.beginPath(); ctx.arc(x+4,y+3,4,0,Math.PI*2); ctx.fill();
      ctx.fillStyle="#54ad54"; ctx.beginPath(); ctx.arc(x+3,y+2,1.6,0,Math.PI*2); ctx.fill(); } }

    // NPC (old fisherman)
    for (let r=0;r<TOWN_ROWS;r++) for (let c=0;c<TOWN_COLS;c++) if (m[r][c]==="N") drawNpc(c*TILE+4, TOWN_TOP+r*TILE+7);

    // walker
    if (townEnter > 0 && townEnterTarget) {
      ctx.save(); ctx.globalAlpha = Math.max(0, townEnter/0.55); drawWalker(walker.px, walker.py, "up"); ctx.restore();
    } else {
      drawWalker(walker.px, walker.py, walker.dir);
    }

    // snow overlay
    if (TH.snow) {
      ctx.fillStyle = "#ffffff";
      for (let i = 0; i < 24; i++) {
        const sx = (i*37 + Math.sin(frame*0.02+i)*5) % W;
        const sy = (TOWN_TOP + (i*41 + frame*0.5) % (H-TOWN_TOP));
        ctx.fillRect(Math.round(sx), Math.round(sy), 1, 1);
      }
    }

    // interaction hint
    const fc = walker.c + (walker.dir==="left"?-1:walker.dir==="right"?1:0);
    const fr = walker.r + (walker.dir==="up"?-1:walker.dir==="down"?1:0);
    const tl = townTile(fc, fr);
    let hint = "";
    if (tl==="H") hint = (lang==="en"?"A: Enter Hut":"A: Entra Capanna");
    else if (tl==="S") hint = (lang==="en"?"A: Enter Shop":"A: Entra Negozio");
    else if (tl==="T") hint = (lang==="en"?"A: Enter Tank":"A: Entra Acquario");
    else if (tl==="N") hint = (lang==="en"?"A: Talk":"A: Parla");
    else if (tl==="Q") hint = (lang==="en"?"A: Depart":"A: Parti");
    else if (tl==="E"||tl==="D") hint = (lang==="en"?"A: Fish":"A: Pesca");
    if (hint) textBox(hint, 6, 132);
  }

  // wooden plank rectangle (jetty) between cols c0..c1, rows r0..r1
  function drawPlanks(c0,c1,r0,r1){
    for (let r=r0;r<=r1;r++) for (let c=c0;c<=c1;c++){
      const x=c*TILE, y=TOWN_TOP+r*TILE;
      ctx.fillStyle="#b07a3a"; ctx.fillRect(x,y,TILE,TILE);
      ctx.fillStyle="#8a5a28"; ctx.fillRect(x,y,TILE,1); ctx.fillRect(x,y+4,TILE,1);
      ctx.fillStyle="#7a4a20"; ctx.fillRect(x+3,y,1,TILE);
    }
  }
  // a small moored boat below the departures jetty
  function drawBoatDock(x, y){
    ctx.fillStyle="#e8e0d0"; // hull
    ctx.beginPath(); ctx.moveTo(x-1,y+4); ctx.lineTo(x+17,y+4); ctx.lineTo(x+14,y+9); ctx.lineTo(x+2,y+9); ctx.closePath(); ctx.fill();
    ctx.fillStyle="#b03028"; ctx.fillRect(x-1,y+3,18,2);      // red stripe
    ctx.fillStyle="#c8a860"; ctx.fillRect(x+4,y-2,2,6);       // mast
    ctx.fillStyle="#f0f0f0"; ctx.beginPath(); ctx.moveTo(x+6,y-2); ctx.lineTo(x+6,y+3); ctx.lineTo(x+12,y+3); ctx.closePath(); ctx.fill(); // sail
  }

  // decorative flower bed at a cell
  function drawFlowers(c, r){
    const x=c*TILE, y=TOWN_TOP+r*TILE;
    const cols=["#e05a7a","#e8d24a","#ffffff","#c88ad8"];
    for (let i=0;i<4;i++){ ctx.fillStyle=cols[i]; ctx.fillRect(x+1+(i%2)*4, y+1+((i/2)|0)*4, 2, 2);
      ctx.fillStyle="#e8d24a"; ctx.fillRect(x+1+(i%2)*4+0.5, y+1+((i/2)|0)*4+0.5, 1,1); }
  }
  // decorative bush
  function drawBush(c, r){
    const x=c*TILE, y=TOWN_TOP+r*TILE;
    ctx.fillStyle="#2e7d3a"; ctx.beginPath(); ctx.arc(x+4,y+4,3.5,0,Math.PI*2); ctx.fill();
    ctx.fillStyle="#40a048"; ctx.beginPath(); ctx.arc(x+3,y+3,1.5,0,Math.PI*2); ctx.fill();
  }

  // Draw a building block with roof + wall + a door tile; door char e.g. 'H','S','T'
  function drawBuilding(c0, r0, w, h, roof, wall, doorType){
    for (let r=r0; r<r0+h; r++){
      for (let c=c0; c<c0+w; c++){
        const x=c*TILE, y=TOWN_TOP+r*TILE;
        if (r===r0){ // roof
          ctx.fillStyle=roof; ctx.fillRect(x,y,TILE,TILE);
          ctx.fillStyle=shade(roof,-0.22); ctx.fillRect(x,y+5,TILE,3);
          ctx.fillStyle=shade(roof,0.3); ctx.fillRect(x,y,TILE,1);
          if (c===c0) { ctx.fillStyle="#8a5a40"; ctx.fillRect(x+2,y-2,2,3); }
        } else { // wall
          ctx.fillStyle=wall; ctx.fillRect(x,y,TILE,TILE);
          ctx.fillStyle=shade(wall,-0.16); ctx.fillRect(x,y+TILE-1,TILE,1);
          if (c===c0 || c===c0+w-1) { ctx.fillStyle="#7fc0e8"; ctx.fillRect(x+2,y+2,4,3); ctx.strokeStyle=shade(wall,-0.3); ctx.strokeRect(x+2.5,y+2.5,3,2); }
        }
      }
    }
    const dcx = c0 + Math.floor(w/2), dr = r0+h-1;
    setDoorTile(dcx, dr, doorType);
    const dx=dcx*TILE, dy=TOWN_TOP+dr*TILE;
    ctx.fillStyle="#5a3418"; ctx.fillRect(dx+2,dy+2,4,6);
    ctx.fillStyle="#7a4a24"; ctx.fillRect(dx+3,dy+3,2,4);
    ctx.fillStyle="#e0b040"; ctx.fillRect(dx+5,dy+5,1,1);
  }
  function setDoorTile(c, r, ch){
    const row = TOWN_BASE[r];
    if (row[c] !== ch){ TOWN_BASE[r] = row.substring(0,c) + ch + row.substring(c+1); }
  }
  // Readable hanging sign centered on cx, with a clear label
  function drawSign(cx, topY, label){
    const w = label.length*4 + 6, x = Math.round(cx - w/2), y = Math.round(topY);
    ctx.fillStyle="#2a1c0c"; ctx.fillRect(x-1, y-1, w+2, 9);      // dark frame
    ctx.fillStyle="#e8c878"; ctx.fillRect(x, y, w, 7);            // wood plate
    ctx.fillStyle="#c8a860"; ctx.fillRect(x, y+5, w, 2);
    text(label, x+3, y, "#2a1c0c");                              // 8px readable text
  }

  // Guide NPC: a harbourmaster with a blue cap and a beard (facing down)
  function drawNpc(cx, cy){
    const x=Math.round(cx), y=Math.round(cy)-3, OL="#20241c";
    ctx.fillStyle="rgba(0,0,0,0.22)"; ctx.fillRect(x-4,y+8,8,2);
    // outline
    ctx.fillStyle=OL; ctx.fillRect(x-4,y-8,8,8); ctx.fillRect(x-4,y-1,8,7);
    // body (navy jacket)
    ctx.fillStyle="#2a3a6a"; ctx.fillRect(x-3,y-1,6,6);
    ctx.fillStyle="#e8e0d0"; ctx.fillRect(x-1,y-1,2,4);   // shirt front
    // head
    ctx.fillStyle="#e8b088"; ctx.fillRect(x-3,y-7,6,6);
    // white beard
    ctx.fillStyle="#e8e8e8"; ctx.fillRect(x-3,y-2,6,2); ctx.fillRect(x-2,y-4,1,2); ctx.fillRect(x+1,y-4,1,2);
    // blue captain cap
    ctx.fillStyle="#1a2a5a"; ctx.fillRect(x-3,y-8,6,3); ctx.fillStyle="#e8e8e8"; ctx.fillRect(x-3,y-6,6,1);
    ctx.fillStyle="#ffe14d"; ctx.fillRect(x-1,y-8,2,1);   // cap badge
    // eyes
    ctx.fillStyle="#000"; ctx.fillRect(x-2,y-4,1,1); ctx.fillRect(x+1,y-4,1,1);
    // "!" bobbing above to signal you can talk
    if (Math.floor(frame/24)%2===0){ ctx.fillStyle="#ffe14d"; text("!", x-1, y-14, "#ffe14d"); }
  }

  // Pokemon-GBC style walker with dark outline, big head, 4-direction, 2-step walk
  function drawWalker(cx, cy, dir){
    const skin = AV.skin[avatar.skin], hair = AV.hair[avatar.hair];
    const shirt = AV.shirt[avatar.shirt], pants = AV.pants[avatar.pants], hat = AV.hat[avatar.hat];
    const x = Math.round(cx), y = Math.round(cy) - 3;
    // 0 = idle, 1 = left step, 2 = right step (alternates while moving)
    const wf = walker.moving ? (Math.floor(walker.animT*7)%2===0 ? 1 : 2) : 0;
    const OL = "#20241c";   // dark outline
    // shadow
    ctx.fillStyle = "rgba(0,0,0,0.22)"; ctx.fillRect(x-4, y+8, 8, 2);
    // ---- outline pass ----
    ctx.fillStyle = OL;
    ctx.fillRect(x-4, y-8, 8, 8);      // head box
    ctx.fillRect(x-4, y-1, 8, 6);      // body box
    // legs outline positions depend on step
    if (wf===1)      { ctx.fillRect(x-4, y+3, 3, 5); ctx.fillRect(x+1, y+4, 3, 4); }
    else if (wf===2) { ctx.fillRect(x-4, y+4, 3, 4); ctx.fillRect(x+1, y+3, 3, 5); }
    else             { ctx.fillRect(x-4, y+4, 3, 4); ctx.fillRect(x+1, y+4, 3, 4); }
    // ---- leg fills (clearly alternating) ----
    ctx.fillStyle = pants;
    if (wf===1)      { ctx.fillRect(x-3, y+4, 2, 4); ctx.fillRect(x+1, y+5, 2, 3); }  // left forward
    else if (wf===2) { ctx.fillRect(x-3, y+5, 2, 3); ctx.fillRect(x+1, y+4, 2, 4); }  // right forward
    else             { ctx.fillRect(x-3, y+5, 2, 3); ctx.fillRect(x+1, y+5, 2, 3); }  // idle
    // body (shirt)
    ctx.fillStyle = shirt; ctx.fillRect(x-3, y-1, 6, 5);
    // arms (swing slightly with the step)
    ctx.fillStyle = skin;
    if (wf===1){ ctx.fillRect(x-3, y-1, 1, 3); ctx.fillRect(x+2, y+1, 1, 3); }
    else if (wf===2){ ctx.fillRect(x-3, y+1, 1, 3); ctx.fillRect(x+2, y-1, 1, 3); }
    else { ctx.fillRect(x-3, y, 1, 3); ctx.fillRect(x+2, y, 1, 3); }
    // head
    ctx.fillStyle = skin; ctx.fillRect(x-3, y-7, 6, 6);
    // hair / hat
    ctx.fillStyle = hat || hair;
    ctx.fillRect(x-3, y-8, 6, 3);
    if (dir!=="up"){ ctx.fillRect(x-3, y-6, 1, 2); ctx.fillRect(x+2, y-6, 1, 2); }
    // beard
    if (avatar.beard && dir!=="up"){ ctx.fillStyle = hair; ctx.fillRect(x-2, y-2, 4, 1); ctx.fillRect(x-3,y-4,1,2); ctx.fillRect(x+2,y-4,1,2);}
    // eyes by direction
    ctx.fillStyle = "#20241c";
    if (dir==="down"){ ctx.fillRect(x-2, y-4, 1,2); ctx.fillRect(x+1, y-4, 1,2); }
    else if (dir==="left"){ ctx.fillRect(x-2, y-4, 1,2); }
    else if (dir==="right"){ ctx.fillRect(x+1, y-4, 1,2); }
  }

  // ---------- FIGHT LOGIC ----------
  function updateFight(dt) {
    const f = fight;

    // Buzz the device each time you tap B to yank the reel during the fight.
    if (consumePress("b")) SFX.vibrate(30);

    // ----- (0) MOVE THE SAFE ZONE according to the fish tier pattern -----
    moveSafeZone(dt);

    // 1) Fish pulling behaviour: pick a new pull target periodically.
    f.pullTimer -= dt;
    if (f.pullTimer <= 0) {
      const maxPull = f.tired ? 0.5 : 1.0;
      f.pullTarget = 0.2 + Math.random() * (maxPull - 0.2);
      f.pullTimer = 0.4 + Math.random() * 0.9;
    }
    f.pull += (f.pullTarget - f.pull) * Math.min(1, dt * 4);

    // 2) Tension: rises when reeling (B held), falls when you release B.
    const reeling = keys.b;
    // Reel drag SFX: while B is held, fire a VERY fast stream of crisp metallic
    // ratchet clicks (spinning reel under load). Clicks speed up as the fish tires,
    // and get louder/brighter the harder the fish pulls. A faint water splash sits under it.
    if (reeling) {
      // brightness/loudness of the clicks scales with the line load (pull + tension)
      const load = Math.min(1, (f.pull || 0) * 0.6 + (f.tension || 0) * 0.6);
      // interval: ~0.013s (fresh) down to ~0.007s (exhausted) -> a fast drag-spin buzz
      const clickEvery = 0.007 + f.stamina * 0.006;
      reelClickTimer -= dt;
      // catch up: if the frame was long, emit several clicks so the rate stays high
      let guard = 0, offset = 0;
      while (reelClickTimer <= 0 && guard < 12) {
        SFX.reel(offset, load);    // stagger extra clicks so they ratchet instead of stacking
        reelClickTimer += clickEvery;
        offset += clickEvery;
        guard++;
      }
      // periodic low water-splash bed underneath the clicking
      reelSplashTimer -= dt;
      if (reelSplashTimer <= 0) { SFX.reelSplash(); reelSplashTimer = 0.22 + Math.random() * 0.12; }
    } else {
      reelClickTimer = 0;  // next press clicks immediately
      reelSplashTimer = 0;
    }
    const pullForce = f.pull * (f.tired ? 0.5 : 1.0);
    let dTension;
    if (reeling) {
      dTension = (0.35 + pullForce * 0.55) * dt;
    } else {
      dTension = -(0.55 - pullForce * 0.25) * dt;
    }
    f.tension += dTension;
    f.tension = Math.max(0, Math.min(1, f.tension));

    // 3) Safe-zone check -> catch progress & lose conditions (per-tier tuned)
    const inSafe = (f.tension >= f.safeLo && f.tension <= f.safeHi);

    // per-tier outside penalty & snap tolerance
    let progLossRate, snapGrace;
    switch (f.pattern) {
      case 1: progLossRate = 0.03; snapGrace = 1.1; break;  // alto margine
      case 2: progLossRate = 0.06; snapGrace = 0.8; break;
      case 3: progLossRate = 0.10; snapGrace = 0.2; break;  // tolleranza bassissima
      default:progLossRate = 0.12; snapGrace = 0.2; break;  // frenesia
    }

    if (inSafe) {
      f.outTimer = 0;
      if (reeling) {
        // reel faster as the fish tires (stamina low) -> the bar reflects real closeness
        const reelSpeed = 0.14 + (1 - f.stamina) * 0.16;   // ~0.14 fresh .. ~0.30 exhausted
        f.catchProg += reelSpeed * dt;
        f.stamina  -= 0.22 * dt;
      }
    } else {
      f.outTimer += dt;
      f.catchProg = Math.max(0, f.catchProg - progLossRate * dt);
      // tier 4 "Cattura Perfetta": a single slip out of the zone halves progress once
      if (f.pattern === 4 && !f.slipPenalized) {
        f.catchProg *= 0.5;
        f.slipPenalized = true;
      }
      if (f.tension >= 0.98 && f.outTimer > snapGrace) { loseFish("LENZA SPEZZATA!"); return; }
      if (f.tension <= 0.02 && f.outTimer > (snapGrace + 0.3)) { loseFish("LENZA LASCA!"); return; }
    }
    // reset the "perfect catch" slip flag once safely back in the zone
    if (inSafe && f.slipPenalized) f.slipPenalized = false;

    // 4) Fish tires as stamina drops (affects reel speed, NOT an instant win)
    f.stamina = Math.max(0, f.stamina);
    if (f.stamina < 0.4) f.tired = true;

    f.catchProg = Math.min(1, f.catchProg);

    // 5) Win ONLY when the fish is fully reeled to the dock (bar full)
    if (f.catchProg >= 1) { landFish(); return; }

    // keep the bobber pulled toward the dock as catch progresses
    hook.x = hook.tx + (rodTip.x - hook.tx) * f.catchProg;
    hook.y = hook.ty + (rodTip.y - hook.ty) * f.catchProg;
  }

  // Moves the safe zone (green band) according to the fish tier behaviour.
  function moveSafeZone(dt) {
    const f = fight;
    f.zoneTimer -= dt;

    if (f.pattern === 1) {
      // quasi ferma al centro; deriva lenta verso un lato poi torna
      if (f.zoneTimer <= 0) {
        f.zoneTarget = 0.5 + (Math.random() - 0.5) * 0.16; // stay near center
        f.zoneTimer = 1.6 + Math.random() * 1.4;
      }
      f.safeCenter += (f.zoneTarget - f.safeCenter) * Math.min(1, dt * 1.2);
      f.safeHalf = f.safeHalfBase;
    }
    else if (f.pattern === 2) {
      // oscilla su/giù a velocità regolare
      f.safeCenter += f.zoneDir * 0.28 * dt;
      if (f.safeCenter > 0.72) { f.safeCenter = 0.72; f.zoneDir = -1; }
      if (f.safeCenter < 0.28) { f.safeCenter = 0.28; f.zoneDir = 1; }
      f.safeHalf = f.safeHalfBase;
    }
    else if (f.pattern === 3) {
      // scatti: ferma ~2s poi schizza verso ~80%
      if (f.zoneTimer <= 0) {
        // toggle between a resting spot and a sudden jump to ~0.8
        if (f.zoneTarget > 0.7) { f.zoneTarget = 0.35 + Math.random()*0.15; }
        else                    { f.zoneTarget = 0.8; }
        f.zoneTimer = 2.0;
      }
      // snap quickly toward the target (fast for the jump)
      f.safeCenter += (f.zoneTarget - f.safeCenter) * Math.min(1, dt * 8);
      f.safeHalf = f.safeHalfBase;
    }
    else {
      // FRENESIA (tier 4): scatti veloci + eventi speciali
      f.frenzyTimer -= dt;
      if (f.zoneTimer <= 0) {
        f.zoneTarget = 0.2 + Math.random() * 0.6;
        f.zoneTimer = 0.5 + Math.random() * 0.7;
      }
      f.safeCenter += (f.zoneTarget - f.safeCenter) * Math.min(1, dt * 6);

      // recover shrunk zone back to base
      f.safeHalf += (f.safeHalfBase - f.safeHalf) * Math.min(1, dt * 2);

      if (f.frenzyTimer <= 0) {
        const evt = Math.random();
        if (evt < 0.5) {
          // Furia: la zona verde si dimezza momentaneamente
          f.safeHalf = f.safeHalfBase * 0.5;
        } else {
          // Salto fuori d'acqua: la tensione schizza quasi al massimo
          f.tension = 0.95;
        }
        f.frenzyTimer = 1.6 + Math.random() * 1.4;
      }
    }

    f.safeCenter = Math.max(f.safeHalf, Math.min(1 - f.safeHalf, f.safeCenter));
    updateSafeBounds();
  }

  // Called when the fish is successfully landed
  function landFish() {
    const fish = fight.fish || { name:"Pesce", value:10, tier:1, color:"#5aa0d8", fin:"#3f7fb8", size:1 };
    landedFish = fish;
    aquarium.push({ name: fish.name, value: fish.value, tier: fish.tier,
                    color: fish.color, fin: fish.fin, size: fish.size,
                    tierScale: fish.tierScale || (TIERS[fish.tier] && TIERS[fish.tier].sizeScale) || 1,
                    crab: !!(fish.species && fish.species.crab),
                    squid: !!(fish.species && fish.species.squid),
                    orca: !!(fish.species && fish.species.orca),
                    krill: !!(fish.species && fish.species.krill),
                    seal: !!(fish.species && fish.species.seal),
                    ghost: !!(fish.species && fish.species.ghost),
                    shape: (fish.species && fish.species.shape) || null,
                    location: currentLocation });
    coins += fish.value;
    lastReward = fish.value;
    // Fishdex tracking
    const key = currentLocation + ":" + fish.name;
    if (!caught[key]) caught[key] = { count: 0, best: 0 };
    caught[key].count++;
    if (fish.size > caught[key].best) caught[key].best = fish.size;
    SFX.win(); SFX.coin();
    SFX.vibrate([60, 30, 60, 30, 120]);   // catch celebration buzz
    // check for a newly earned award medal in this location
    const rank = locationAward(currentLocation);
    const seen = awardsSeen[currentLocation] || 0;
    if (rank > seen) {
      awardsSeen[currentLocation] = rank;
      awardPopup = { rank: rank, timer: 0, name: AWARD_INFO[rank].name };
      // FINALE: gold hook at the Ross Sea completes the journey
      if (currentLocation === "ross" && rank === 3) storyPending = "finale";
    }

    // check if this catch just met the requirements to unlock the NEXT location
    const nxt = nextLocationKey(currentLocation);
    if (nxt && !unlocked[nxt] && !unlockNotified[currentLocation] && unlockReqMet(currentLocation)) {
      unlockNotified[currentLocation] = true;
      zonePopup = { timer: 0 };
      SFX.win();
    }

    saveGame();   // autosave dopo ogni cattura
    state = STATE.HOOKED;
    resultTimer = 0;
  }

  // Called when the fish gets away
  function loseFish(reason) {
    lostReason = reason;
    SFX.lose();
    SFX.vibrate(200);   // long buzz on losing the fish
    // set up the little fish swimming toward the horizon from the hook spot
    escaper.x = hook.x;
    escaper.y = hook.y;
    escaper.active = true;
    state = STATE.LOST;
    resultTimer = 0;
  }

  // ---------- DRAW ----------
  let frame = 0;
  function draw() {
    frame++;

    if (screen === "title") { drawTitle(); return; }
    if (screen === "lang") { drawLangSelect(); return; }
    if (screen === "creator") { drawCreator(); return; }
    if (screen === "story") { drawStory(); return; }
    if (screen === "map")   { drawPostcards(); return; }
    if (screen === "town")  { drawTown(); if (paused) drawMenu(); return; }

    const bg = LOCATIONS[currentLocation].background;
    const isLofoten = bg === "lofoten";
    const isAmazon  = bg === "amazzonia";
    const isReef    = bg === "reef";
    const isKam     = bg === "kamchatka";
    const isFuji    = bg === "fuji";
    const isBijagos = bg === "bijagos";
    const isPatagonia = bg === "patagonia";
    const isAntille = bg === "antille";
    const isRoss = bg === "ross";

    // Sky
    const g = ctx.createLinearGradient(0,0,0,HORIZON);
    if (isLofoten) {
      g.addColorStop(0, "#12203f"); g.addColorStop(1, "#3a5a6a");
    } else if (isAmazon) {
      // sunset over the jungle river (warm orange to pink haze)
      g.addColorStop(0, "#e8935a"); g.addColorStop(1, "#f2c98a");
    } else if (isReef) {
      g.addColorStop(0, "#3fb0e8"); g.addColorStop(1, "#b8ecf5");
    } else if (isKam) {
      // cold but brighter blue-white subarctic sky
      g.addColorStop(0, "#7f9ec0"); g.addColorStop(1, "#d6e4ec");
    } else if (isFuji) {
      // serene Japanese dawn (soft blue to pink haze)
      g.addColorStop(0, "#7fb0e0"); g.addColorStop(0.6, "#cfe0ee"); g.addColorStop(1, "#f6d8dc");
    } else if (isBijagos) {
      // warm tropical African sky (hazy blue to sandy warmth)
      g.addColorStop(0, "#5aa8d8"); g.addColorStop(0.6, "#bfe0ea"); g.addColorStop(1, "#f0e2c0");
    } else if (isPatagonia) {
      // brighter cool austral sky (soft blue to pale)
      g.addColorStop(0, "#8aa6c0"); g.addColorStop(0.6, "#c0d2dc"); g.addColorStop(1, "#e4eef2");
    } else if (isAntille) {
      // bright Caribbean sky
      g.addColorStop(0, "#2f9ee0"); g.addColorStop(0.6, "#8fd6ee"); g.addColorStop(1, "#d8f4f2");
    } else if (isRoss) {
      // pale, cold Antarctic sky (icy blue to near-white)
      g.addColorStop(0, "#9fc0d8"); g.addColorStop(0.6, "#d0e4ee"); g.addColorStop(1, "#eef6fa");
    } else {
      g.addColorStop(0, PAL.skyTop); g.addColorStop(1, PAL.skyBot);
    }
    ctx.fillStyle = g; ctx.fillRect(0,0,W,HORIZON);

    if (isLofoten) {
      drawAurora();
      ctx.fillStyle = "rgba(255,200,150,0.5)";
      ctx.beginPath(); ctx.arc(30, HORIZON-4, 7, 0, Math.PI*2); ctx.fill();
    } else if (isAmazon) {
      // large low setting sun with warm glow
      ctx.fillStyle = "rgba(255,180,120,0.4)";
      ctx.beginPath(); ctx.arc(W/2, HORIZON-2, 20, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = "#ffb060";
      ctx.beginPath(); ctx.arc(W/2, HORIZON-2, 12, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = "#ffd08a";
      ctx.beginPath(); ctx.arc(W/2, HORIZON-2, 8, 0, Math.PI*2); ctx.fill();
    } else if (isKam) {
      // pale hazy sun barely visible through fog
      ctx.fillStyle = "rgba(232,236,236,0.45)";
      ctx.beginPath(); ctx.arc(42, HORIZON-14, 8, 0, Math.PI*2); ctx.fill();
    } else if (isFuji) {
      // soft rising sun to the right
      ctx.fillStyle = "rgba(255,220,210,0.6)";
      ctx.beginPath(); ctx.arc(134, HORIZON-16, 12, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = "#ffd9c0";
      ctx.beginPath(); ctx.arc(134, HORIZON-16, 7, 0, Math.PI*2); ctx.fill();
    } else if (isBijagos) {
      // hot tropical sun
      ctx.fillStyle = "rgba(255,240,200,0.5)";
      ctx.beginPath(); ctx.arc(126, HORIZON-14, 12, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = "#fff0b0";
      ctx.beginPath(); ctx.arc(126, HORIZON-14, 8, 0, Math.PI*2); ctx.fill();
    } else if (isPatagonia) {
      // soft bright sun through thin clouds
      ctx.fillStyle = "rgba(255,250,235,0.55)";
      ctx.beginPath(); ctx.arc(120, HORIZON-20, 12, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = "rgba(255,250,235,0.8)";
      ctx.beginPath(); ctx.arc(120, HORIZON-20, 7, 0, Math.PI*2); ctx.fill();
    } else if (isAntille) {
      // bright tropical sun
      ctx.fillStyle = "#fff3b0"; ctx.beginPath(); ctx.arc(30, HORIZON-16, 9, 0, Math.PI*2); ctx.fill();
    } else if (isRoss) {
      // low pale polar sun
      ctx.fillStyle = "rgba(255,250,240,0.7)";
      ctx.beginPath(); ctx.arc(36, HORIZON-10, 7, 0, Math.PI*2); ctx.fill();
    } else {
      ctx.fillStyle = "#fff3b0"; ctx.beginPath(); ctx.arc(isReef?134:120, HORIZON-8, 9, 0, Math.PI*2); ctx.fill();
    }

    // Location background silhouette on the horizon
    drawLocationBackground();

    // Sea/river filling from horizon down to the dock/bottom
    const gw = ctx.createLinearGradient(0,HORIZON,0,H);
    if (isLofoten) {
      gw.addColorStop(0, "#5aa8c8"); gw.addColorStop(0.4, "#2f7fa8"); gw.addColorStop(1, "#1a5578");
    } else if (isAmazon) {
      // clear aqua-green river with a warm sunset reflection on top
      gw.addColorStop(0, "#f2b878"); gw.addColorStop(0.15, "#4fb8a8"); gw.addColorStop(0.5, "#2f9a94"); gw.addColorStop(1, "#1f7a76");
    } else if (isReef) {
      // crystalline turquoise water
      gw.addColorStop(0, "#7fe0e0"); gw.addColorStop(0.4, "#40c0d0"); gw.addColorStop(1, "#1f90b0");
    } else if (isKam) {
      // cold blue subarctic sea (less grey)
      gw.addColorStop(0, "#5a86a0"); gw.addColorStop(0.4, "#3a627e"); gw.addColorStop(1, "#22404f");
    } else if (isFuji) {
      // calm Pacific blue with a soft dawn tint on top
      gw.addColorStop(0, "#8fc4dc"); gw.addColorStop(0.35, "#4f96c0"); gw.addColorStop(1, "#2a5f8a");
    } else if (isBijagos) {
      // bright sea-green marine water (verde acqua)
      gw.addColorStop(0, "#6fd8c0"); gw.addColorStop(0.4, "#3fb0a0"); gw.addColorStop(1, "#237a72");
    } else if (isPatagonia) {
      // cool but brighter blue subantarctic sea
      gw.addColorStop(0, "#7fb0c4"); gw.addColorStop(0.4, "#5690a8"); gw.addColorStop(1, "#356274");
    } else if (isAntille) {
      // bright clear Caribbean flats (light turquoise)
      gw.addColorStop(0, "#9ff0e8"); gw.addColorStop(0.4, "#5fd8d8"); gw.addColorStop(1, "#2fa8c8");
    } else if (isRoss) {
      // black, crystalline Antarctic ocean
      gw.addColorStop(0, "#2a4658"); gw.addColorStop(0.4, "#16303f"); gw.addColorStop(1, "#0a1a24");
    } else {
      gw.addColorStop(0, PAL.seaHi); gw.addColorStop(0.4, PAL.sea2); gw.addColorStop(1, PAL.sea1);
    }
    ctx.fillStyle = gw; ctx.fillRect(0, HORIZON, W, H-HORIZON);

    // Perspective wave lines
    const verticalCurrent = (isLofoten || isReef || isPatagonia || isRoss);
    if (verticalCurrent) {
      // Upward-flowing current: vertical streaks, thick/long near the bottom,
      // tapering and FADING OUT before reaching the far shore (horizon).
      const streakRgb = isLofoten ? "120,180,205" : isPatagonia ? "150,185,205" : isRoss ? "90,150,200" : "170,235,235";
      const lanes = 16;
      const period = H - HORIZON;
      const fadeStart = HORIZON + period * 0.32;  // vanish above this band
      for (let l = 0; l < lanes; l++) {
        const lx = 6 + l * ((W - 12) / (lanes - 1));
        for (let s = 0; s < 3; s++) {   // 3 staggered streaks per lane = more flow
          const phase = (frame * 0.4 + l * 29 + s * (period/3)) % period;
          const sy = H - phase;               // moves upward
          if (sy <= fadeStart) continue;      // gone before touching the far shore
          const t = (sy - HORIZON) / (H - HORIZON);
          const streakLen = 4 + t * 16;
          const streakW   = Math.max(1, Math.round(t * 3));
          const fade = Math.min(1, (sy - fadeStart) / (H - fadeStart));
          const wob = Math.sin(sy*0.12 + l*0.7 + frame*0.03) * 3 * t;
          ctx.fillStyle = "rgba(" + streakRgb + "," + (0.5 * fade).toFixed(2) + ")";
          ctx.fillRect(Math.round(lx + wob), Math.round(sy - streakLen), streakW, streakLen);
          ctx.fillStyle = "rgba(255,255,255," + (0.2 * fade).toFixed(2) + ")";
          ctx.fillRect(Math.round(lx + wob), Math.round(sy - streakLen*0.5), streakW, Math.max(1, Math.round(streakLen*0.5)));
        }
      }
    } else {
      ctx.fillStyle = isAmazon ? "#7fd0c0" : isKam ? "#7a8f98" : isFuji ? "#a8d4e8" : isBijagos ? "#a0eeda" : isPatagonia ? "#8aacba" : isAntille ? "#c8f4ee" : PAL.seaHi;
      const speedMul = isFuji ? 0.3 : isBijagos ? 0.4 : isAntille ? 0.35 : 1;   // calmer water at Fuji/Bijagos/Antille
      for (let i = 0; i < 22; i++) {
        const t = i / 22;
        const y = HORIZON + t * t * (H - HORIZON);   // denser near horizon
        const drift = Math.floor(frame * (0.3 + t*0.9) * speedMul);
        const seg = 6 + Math.floor(t * 14);
        for (let x = (drift % (seg*2)) - seg*2; x < W; x += seg*2) {
          ctx.fillRect(x, y, seg, 1);
        }
      }
    }

    // Boats floating on the sea just below the horizon (Golfo di Napoli)
    if (LOCATIONS[currentLocation].background === "napoli") {
      drawBoat(90 + Math.sin(frame*0.02)*3,  HORIZON+8,  "#ffffff", "#c0392b");
      drawBoat(126 + Math.cos(frame*0.017)*3, HORIZON+14, "#f0f0f0", "#2a5db0");
    }

    // Bijagos: islands scattered out in the sea (drawn on top of the water)
    if (LOCATIONS[currentLocation].background === "bijagos") {
      drawBijagosSeaIslands();
    }
    // Patagonia: grey/blue ice floes drifting on the water
    if (LOCATIONS[currentLocation].background === "patagonia") {
      drawPatagoniaIce();
    }
    // Antille: reef patches at the surface, sandy shoals, a half-sunken wreck
    if (LOCATIONS[currentLocation].background === "antille") {
      drawAntilleWater();
    }
    // Ross: floating cobalt icebergs on the black sea
    if (LOCATIONS[currentLocation].background === "ross") {
      drawIceberg(46 + Math.sin(frame*0.01)*2, HORIZON+14, 9);
      drawIceberg(112 + Math.cos(frame*0.012)*2, HORIZON+26, 13);
      drawIceberg(20 + Math.sin(frame*0.009)*2, HORIZON+34, 8);
    }

    // Dock / pier in the foreground (bottom), receding slightly
    drawDock();
    drawPlayer();
    drawRodAndLine();

    // ---- UI per stato ----
    if (state === STATE.AIM) {
      drawAimTarget();
      textBox(t("cast"), 6, 130);
      drawBaitHUD();
    }
    else if (state === STATE.CASTING) {
      drawAimTarget();
      drawPowerBar();
      textBox(t("charging"), 6, 6);
    }
    else if (state === STATE.WAITING) {
      textBox(t("waiting"), 6, 6);
      if (keys.b && reelProgress > 0) {
        textBox(t("reeling"), 6, 130);
        drawReelBar();
      } else {
        textBox(t("reel"), 6, 130);
      }
    }
    else if (state === STATE.BITE) {
      textBox(t("bite"), 6, 6);
      textBox(t("strike"), 6, 130);
    }
    else if (state === STATE.FIGHT) {
      drawFightHUD();
    }
    else if (state === STATE.HOOKED) {
      drawCatchScene();
    }
    else if (state === STATE.LOST) {
      drawEscapeScene();
    }

    drawHook();

    // Coins HUD during normal play (catch/escape scenes draw their own)
    if (!paused && state !== STATE.HOOKED && state !== STATE.LOST) drawCoinsHUD();

    // Pause menu overlay on top of everything
    if (paused) drawMenu();
  }

  function drawFightHUD() {
    const f = fight;
    // --- Vertical tension bar on the right ---
    const bx = W - 16, by = 18, bw = 8, bh = 100;
    // frame
    ctx.fillStyle = PAL.dark; ctx.fillRect(bx-2, by-2, bw+4, bh+4);
    ctx.fillStyle = "#1a3a5a"; ctx.fillRect(bx, by, bw, bh);
    // safe zone (green band) — note tension 1 is at TOP, 0 at BOTTOM
    const sy = by + (1 - f.safeHi) * bh;
    const sh = (f.safeHi - f.safeLo) * bh;
    ctx.fillStyle = "#3fae5a"; ctx.fillRect(bx, sy, bw, sh);
    // danger caps (top = snap, bottom = slack)
    ctx.fillStyle = "#c0392b"; ctx.fillRect(bx, by, bw, 4);
    ctx.fillStyle = "#c0a020"; ctx.fillRect(bx, by+bh-4, bw, 4);
    // tension indicator
    const ty = by + (1 - f.tension) * bh;
    ctx.fillStyle = PAL.white; ctx.fillRect(bx-2, ty-1, bw+4, 3);
    // label
    text(t("tension"), bx-6, 6, PAL.white);

    // --- Horizontal catch-progress bar (bottom) ---
    const cx = 6, cy = 128, cw = 120, ch = 8;
    ctx.fillStyle = PAL.dark; ctx.fillRect(cx-1, cy-1, cw+2, ch+2);
    ctx.fillStyle = PAL.textBg; ctx.fillRect(cx, cy, cw, ch);
    ctx.fillStyle = "#2e7d32"; ctx.fillRect(cx, cy, cw * f.catchProg, ch);
    text(t("recovery"), cx, cy - 10, PAL.white);

    // --- prompts ---
    if (keys.b) textBox(t("pull"), 6, 6);
    else        textBox(t("release"), 6, 6);

    // fish name + tier
    if (f.fish) {
      textBox(fishName(f.fish), 6, 18);
    }

    // flash the bar red when in danger
    if (f.tension >= f.safeHi + 0.15 || f.tension <= f.safeLo - 0.12) {
      if (Math.floor(frame/5)%2===0) {
        ctx.strokeStyle = "#ff3b3b"; ctx.lineWidth = 1;
        ctx.strokeRect(bx-3, by-3, bw+6, bh+6);
      }
    }
  }

  function drawBanner(msg, color, by) {
    const bw = msg.length * 6 + 16, bh = 16;
    const bx = (W - bw) / 2;
    if (by === undefined) by = 60;
    ctx.fillStyle = color; ctx.fillRect(bx, by, bw, bh);
    ctx.strokeStyle = PAL.textBg; ctx.lineWidth = 1; ctx.strokeRect(bx+0.5, by+0.5, bw-1, bh-1);
    ctx.font = "bold 10px monospace"; ctx.textBaseline = "top";
    ctx.fillStyle = PAL.white; ctx.fillText(msg, bx + 8, by + 3);
    ctx.font = "8px monospace";
  }

  // A small reusable pixel-art fish sprite (colored).
  // dir: 1 = facing right, -1 = left. vertical: true = hangs head-up (tail down)
  function drawFishSprite(cx, cy, scale, bodyColor, finColor, dir, vertical) {
    const s = scale, d = dir || 1;
    ctx.save();
    ctx.translate(cx, cy);
    if (vertical) ctx.rotate(-Math.PI/2);  // rotate so the fish hangs head-up
    ctx.scale(d, 1);
    // body
    ctx.fillStyle = bodyColor;
    ctx.fillRect(-4*s, -2*s, 8*s, 4*s);
    ctx.fillRect(-3*s, -3*s, 6*s, 6*s);
    // tail
    ctx.fillStyle = finColor;
    ctx.fillRect(-6*s, -3*s, 2*s, 2*s);
    ctx.fillRect(-6*s,  1*s, 2*s, 2*s);
    ctx.fillRect(-5*s, -1*s, 1*s, 2*s);
    // top fin
    ctx.fillRect(-1*s, -4*s, 2*s, 1*s);
    // eye
    ctx.fillStyle = "#ffffff"; ctx.fillRect(2*s, -1*s, 1.4*s, 1.4*s);
    ctx.fillStyle = "#000000"; ctx.fillRect(2.4*s, -0.6*s, 0.8*s, 0.8*s);
    ctx.restore();
  }

  // Pixel-art crab sprite (used for the King Crab)
  function drawCrabSprite(cx, cy, scale, bodyColor, clawColor) {
    const s = scale;
    ctx.save();
    ctx.translate(cx, cy);
    // shell (rounded body)
    ctx.fillStyle = bodyColor;
    ctx.fillRect(-4*s, -2*s, 8*s, 4*s);
    ctx.fillRect(-3*s, -3*s, 6*s, 2*s);
    ctx.beginPath(); ctx.arc(0, -1*s, 4*s, Math.PI, 0); ctx.fill();
    // legs (3 per side)
    ctx.strokeStyle = bodyColor; ctx.lineWidth = Math.max(1, s);
    for (let i = -1; i <= 1; i++) {
      ctx.beginPath();
      ctx.moveTo(-3*s, 0); ctx.lineTo(-6*s, i*2*s + 2*s); ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(3*s, 0); ctx.lineTo(6*s, i*2*s + 2*s); ctx.stroke();
    }
    // claws
    ctx.fillStyle = clawColor || bodyColor;
    ctx.fillRect(-7*s, -3*s, 3*s, 3*s);
    ctx.fillRect(4*s, -3*s, 3*s, 3*s);
    // eyes on stalks
    ctx.fillStyle = bodyColor; ctx.fillRect(-1.5*s, -5*s, 1*s, 2*s); ctx.fillRect(0.5*s, -5*s, 1*s, 2*s);
    ctx.fillStyle = "#ffffff"; ctx.fillRect(-1.5*s, -6*s, 1*s, 1*s); ctx.fillRect(0.5*s, -6*s, 1*s, 1*s);
    ctx.fillStyle = "#000000"; ctx.fillRect(-1.3*s, -5.8*s, 0.6*s, 0.6*s); ctx.fillRect(0.7*s, -5.8*s, 0.6*s, 0.6*s);
    ctx.restore();
  }

  // Draws a fish OR a crab depending on the species flags
  function drawCreature(sp, cx, cy, scale, dir, vertical) {
    if (vertical) {
      // rotate the whole sprite -90deg so any horizontal creature hangs head-up
      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(-Math.PI/2);
      drawCreatureH(sp, 0, 0, scale, dir || 1);
      ctx.restore();
      return;
    }
    drawCreatureH(sp, cx, cy, scale, dir, vertical);
  }

  function drawCreatureH(sp, cx, cy, scale, dir, vertical) {
    if (sp && sp.crab) return drawCrabSprite(cx, cy, scale, sp.color, sp.fin);
    if (sp && sp.squid) return drawSquidSprite(cx, cy, scale, sp.color, sp.fin, dir);
    if (sp && sp.orca) return drawOrcaSprite(cx, cy, scale, dir);
    if (sp && sp.krill) return drawShrimpSprite(cx, cy, scale, sp.color, sp.fin, dir);
    if (sp && sp.seal) return drawSealSprite(cx, cy, scale, sp.color, dir);
    // shape-based dedicated sprites
    if (sp && sp.shape === "shark")    return drawSharkSprite(cx, cy, scale, sp.color, sp.fin, dir, false);
    if (sp && sp.shape === "hammer")   return drawSharkSprite(cx, cy, scale, sp.color, sp.fin, dir, true);
    if (sp && sp.shape === "billfish") return drawBillfishSprite(cx, cy, scale, sp.color, sp.fin, dir, false);
    if (sp && sp.shape === "sailfish") return drawBillfishSprite(cx, cy, scale, sp.color, sp.fin, dir, true);
    if (sp && sp.shape === "tuna")     return drawTunaSprite(cx, cy, scale, sp.color, sp.fin, dir);
    if (sp && sp.shape === "flat")     return drawFlatfishSprite(cx, cy, scale, sp.color, sp.fin, dir);
    if (sp && sp.shape === "napoleon") return drawNapoleonSprite(cx, cy, scale, sp.color, sp.fin, dir);
    if (sp && sp.shape === "parrot")   return drawParrotSprite(cx, cy, scale, sp.color, sp.fin, dir);
    if (sp && sp.shape === "piranha")  return drawPiranhaSprite(cx, cy, scale, sp.color, sp.fin, dir);
    if (sp && sp.shape === "scorpion") return drawScorpionSprite(cx, cy, scale, sp.color, sp.fin, dir);
    if (sp && sp.shape === "long")     return drawLongfishSprite(cx, cy, scale, sp.color, sp.fin, dir);
    if (sp && sp.shape === "salmon")   return drawSalmonSprite(cx, cy, scale, sp.color, sp.fin, dir);
    if (sp && sp.shape === "grouper")  return drawGrouperSprite(cx, cy, scale, sp.color, sp.fin, dir);
    if (sp && sp.shape === "arapaima") return drawArapaimaSprite(cx, cy, scale, sp.color, sp.fin, dir);
    if (sp && sp.shape === "herring")  return drawHerringSprite(cx, cy, scale, sp.color, sp.fin, dir);
    if (sp && sp.shape === "jack")     return drawJackSprite(cx, cy, scale, sp.color, sp.fin, dir);
    if (sp && sp.shape === "snapper")  return drawSnapperSprite(cx, cy, scale, sp.color, sp.fin, dir);
    if (sp && sp.shape === "mahi")     return drawMahiSprite(cx, cy, scale, sp.color, sp.fin, dir);
    if (sp && sp.shape === "tarpon")   return drawTarponSprite(cx, cy, scale, sp.color, sp.fin, dir);
    if (sp && sp.ghost) {
      ctx.save(); ctx.globalAlpha = 0.45;
      drawFishSprite(cx, cy, scale, sp.color, sp.fin, dir, vertical);
      ctx.restore(); return;
    }
    return drawFishSprite(cx, cy, scale, sp ? sp.color : "#5aa0d8", sp ? sp.fin : "#3f7fb8", dir, vertical);
  }

  // Shark: pointed snout, tall triangular dorsal fin, crescent tail. hammer=true for hammerhead
  function drawSharkSprite(cx, cy, scale, bodyColor, finColor, dir, hammer) {
    const s = scale, d = dir || 1;
    ctx.save();
    ctx.translate(cx, cy);
    ctx.scale(d, 1);
    ctx.fillStyle = bodyColor;
    // torpedo body tapering to a pointed snout (right)
    ctx.beginPath();
    ctx.moveTo(-6*s, 0);
    ctx.quadraticCurveTo(-2*s, -3*s, 5*s, -1.5*s);
    ctx.lineTo(7*s, 0);
    ctx.quadraticCurveTo(5*s, 1.5*s, -2*s, 3*s);
    ctx.quadraticCurveTo(-4*s, 2*s, -6*s, 0);
    ctx.closePath(); ctx.fill();
    // crescent tail
    ctx.beginPath();
    ctx.moveTo(-6*s, 0); ctx.lineTo(-10*s, -4*s); ctx.lineTo(-8*s, 0); ctx.lineTo(-10*s, 4*s);
    ctx.closePath(); ctx.fill();
    // tall dorsal fin
    ctx.beginPath();
    ctx.moveTo(-1*s, -2.5*s); ctx.lineTo(0, -7*s); ctx.lineTo(2*s, -2*s); ctx.closePath(); ctx.fill();
    // pectoral fin
    ctx.beginPath(); ctx.moveTo(1*s, 1.5*s); ctx.lineTo(3*s, 5*s); ctx.lineTo(4*s, 1.5*s); ctx.closePath(); ctx.fill();
    // belly lighter
    ctx.fillStyle = "#e8ecee"; ctx.fillRect(-3*s, 1.5*s, 7*s, 1*s);
    if (hammer) {
      // hammer head (wide crossbar at the snout)
      ctx.fillStyle = bodyColor;
      ctx.fillRect(6*s, -4*s, 2*s, 8*s);
      ctx.fillStyle = "#000";
      ctx.fillRect(6.3*s, -3.5*s, 1*s, 1*s); ctx.fillRect(6.3*s, 2.5*s, 1*s, 1*s);   // eyes on the ends
    } else {
      ctx.fillStyle = "#000"; ctx.fillRect(4*s, -0.8*s, 1*s, 1*s);   // eye
      // gill slits
      ctx.strokeStyle = finColor; ctx.lineWidth = Math.max(1, s*0.5);
      for (let i = 0; i < 3; i++){ ctx.beginPath(); ctx.moveTo((2-i)*s, -1*s); ctx.lineTo((2-i)*s, 1*s); ctx.stroke(); }
    }
    ctx.restore();
  }

  // Billfish (marlin/swordfish): long pointed bill; sail=true adds a big dorsal sail
  function drawBillfishSprite(cx, cy, scale, bodyColor, finColor, dir, sail) {
    const s = scale, d = dir || 1;
    ctx.save();
    ctx.translate(cx, cy);
    ctx.scale(d, 1);
    ctx.fillStyle = bodyColor;
    // streamlined body
    ctx.beginPath();
    ctx.moveTo(-6*s, 0);
    ctx.quadraticCurveTo(-1*s, -2.5*s, 4*s, -1*s);
    ctx.lineTo(4*s, 1*s);
    ctx.quadraticCurveTo(-1*s, 2.5*s, -6*s, 0);
    ctx.closePath(); ctx.fill();
    // long bill/rostrum
    ctx.fillRect(4*s, -0.5*s, 6*s, 1*s);
    // forked tail
    ctx.beginPath();
    ctx.moveTo(-6*s, 0); ctx.lineTo(-9*s, -3*s); ctx.lineTo(-7*s, 0); ctx.lineTo(-9*s, 3*s);
    ctx.closePath(); ctx.fill();
    if (sail) {
      // big dorsal sail
      ctx.fillStyle = finColor;
      ctx.beginPath();
      ctx.moveTo(-3*s, -1.5*s); ctx.quadraticCurveTo(0, -8*s, 3*s, -1.5*s);
      ctx.closePath(); ctx.fill();
    } else {
      // small dorsal fin
      ctx.fillStyle = finColor;
      ctx.beginPath(); ctx.moveTo(-1*s, -2*s); ctx.lineTo(0, -4.5*s); ctx.lineTo(1*s, -2*s); ctx.closePath(); ctx.fill();
    }
    // pelvic fin
    ctx.fillStyle = finColor; ctx.fillRect(0, 1.5*s, 1*s, 3*s);
    // eye
    ctx.fillStyle = "#fff"; ctx.fillRect(2.5*s, -1*s, 1.2*s, 1.2*s);
    ctx.fillStyle = "#000"; ctx.fillRect(2.8*s, -0.7*s, 0.7*s, 0.7*s);
    ctx.restore();
  }

  // Tuna: stout torpedo body, deeply forked crescent tail, finlets
  function drawTunaSprite(cx, cy, scale, bodyColor, finColor, dir) {
    const s = scale, d = dir || 1;
    ctx.save();
    ctx.translate(cx, cy);
    ctx.scale(d, 1);
    ctx.fillStyle = bodyColor;
    // fat oval body
    ctx.beginPath(); ctx.ellipse(0, 0, 6*s, 4*s, 0, 0, Math.PI*2); ctx.fill();
    // pointed snout
    ctx.beginPath(); ctx.moveTo(5*s, -1.5*s); ctx.lineTo(8*s, 0); ctx.lineTo(5*s, 1.5*s); ctx.closePath(); ctx.fill();
    // crescent (lunate) tail
    ctx.beginPath();
    ctx.moveTo(-6*s, 0); ctx.lineTo(-10*s, -5*s); ctx.lineTo(-7.5*s, 0); ctx.lineTo(-10*s, 5*s);
    ctx.closePath(); ctx.fill();
    // dorsal + anal fins (finlets)
    ctx.fillStyle = finColor;
    ctx.beginPath(); ctx.moveTo(0, -4*s); ctx.lineTo(2*s, -6*s); ctx.lineTo(3*s, -3.5*s); ctx.closePath(); ctx.fill();
    for (let i = -5; i <= -2; i++){ ctx.fillRect(i*s, -4.2*s, 0.6*s, 1*s); ctx.fillRect(i*s, 3.2*s, 0.6*s, 1*s); }
    // pectoral fin
    ctx.beginPath(); ctx.moveTo(1*s, 2*s); ctx.lineTo(3*s, 5*s); ctx.lineTo(4*s, 2*s); ctx.closePath(); ctx.fill();
    // silver belly
    ctx.fillStyle = "#e8ecee"; ctx.fillRect(-4*s, 2*s, 8*s, 1.5*s);
    // eye
    ctx.fillStyle = "#000"; ctx.fillRect(4*s, -1*s, 1*s, 1*s);
    ctx.restore();
  }

  // Flatfish (halibut/sole/plaice): flat oval, both eyes on top, wavy edge fins
  function drawFlatfishSprite(cx, cy, scale, bodyColor, finColor, dir) {
    const s = scale, d = dir || 1;
    ctx.save();
    ctx.translate(cx, cy);
    ctx.scale(d, 1);
    // wide flat oval body
    ctx.fillStyle = bodyColor;
    ctx.beginPath(); ctx.ellipse(0, 0, 7*s, 3.5*s, 0, 0, Math.PI*2); ctx.fill();
    // fringe of fin around the edge
    ctx.fillStyle = finColor;
    for (let a = 0; a < Math.PI*2; a += 0.5) {
      const rx = Math.cos(a)*7*s, ry = Math.sin(a)*3.5*s;
      ctx.fillRect(rx, ry, 1*s, 1*s);
    }
    // small tail
    ctx.beginPath(); ctx.moveTo(-7*s, 0); ctx.lineTo(-9*s, -2*s); ctx.lineTo(-9*s, 2*s); ctx.closePath(); ctx.fill();
    // both eyes on the upper side (near the front)
    ctx.fillStyle = "#fff"; ctx.fillRect(3*s, -1.5*s, 1.4*s, 1.4*s); ctx.fillRect(4.6*s, -1.5*s, 1.4*s, 1.4*s);
    ctx.fillStyle = "#000"; ctx.fillRect(3.4*s, -1.1*s, 0.7*s, 0.7*s); ctx.fillRect(5*s, -1.1*s, 0.7*s, 0.7*s);
    // speckles
    ctx.fillStyle = finColor;
    ctx.fillRect(-2*s, 0, 1*s, 1*s); ctx.fillRect(0, -1*s, 1*s, 1*s); ctx.fillRect(1*s, 1*s, 1*s, 1*s);
    ctx.restore();
  }

  // Napoleon wrasse: big body with a pronounced forehead hump
  function drawNapoleonSprite(cx, cy, scale, bodyColor, finColor, dir) {
    const s = scale, d = dir || 1;
    ctx.save(); ctx.translate(cx, cy); ctx.scale(d, 1);
    ctx.fillStyle = bodyColor;
    // tall rounded body
    ctx.beginPath(); ctx.ellipse(-1*s, 0, 6*s, 5*s, 0, 0, Math.PI*2); ctx.fill();
    // forehead hump (bulging up-front)
    ctx.beginPath(); ctx.ellipse(3*s, -3*s, 2.5*s, 2.5*s, 0, 0, Math.PI*2); ctx.fill();
    // thick lips/snout
    ctx.fillRect(5*s, -1*s, 2*s, 2*s);
    // tail
    ctx.beginPath(); ctx.moveTo(-6*s, 0); ctx.lineTo(-9*s, -4*s); ctx.lineTo(-9*s, 4*s); ctx.closePath(); ctx.fill();
    // fins
    ctx.fillStyle = finColor;
    ctx.fillRect(-2*s, -5*s, 5*s, 1*s); ctx.fillRect(-2*s, 4*s, 5*s, 1*s);
    // wavy face lines (wrasse markings)
    ctx.strokeStyle = finColor; ctx.lineWidth = Math.max(1,s*0.5);
    ctx.beginPath(); ctx.moveTo(4*s,-1*s); ctx.lineTo(2*s,1*s); ctx.stroke();
    // eye
    ctx.fillStyle = "#fff"; ctx.fillRect(3*s, -1*s, 1.3*s, 1.3*s);
    ctx.fillStyle = "#000"; ctx.fillRect(3.3*s, -0.7*s, 0.7*s, 0.7*s);
    ctx.restore();
  }

  // Parrotfish: beak-like mouth, rounded reef body, bright fins
  function drawParrotSprite(cx, cy, scale, bodyColor, finColor, dir) {
    const s = scale, d = dir || 1;
    ctx.save(); ctx.translate(cx, cy); ctx.scale(d, 1);
    ctx.fillStyle = bodyColor;
    ctx.beginPath(); ctx.ellipse(0, 0, 6*s, 4*s, 0, 0, Math.PI*2); ctx.fill();
    // beak (two blocks like a parrot's beak)
    ctx.fillStyle = "#d8e0c0";
    ctx.fillRect(5*s, -1.5*s, 2.5*s, 1.5*s); ctx.fillRect(5*s, 0.2*s, 2.5*s, 1.3*s);
    // bright crescent tail
    ctx.fillStyle = finColor;
    ctx.beginPath(); ctx.moveTo(-6*s, 0); ctx.lineTo(-9*s, -3*s); ctx.lineTo(-7.5*s, 0); ctx.lineTo(-9*s, 3*s); ctx.closePath(); ctx.fill();
    // colorful dorsal & pectoral fins
    ctx.fillRect(-2*s, -5*s, 6*s, 1.5*s);
    ctx.beginPath(); ctx.moveTo(0, 2*s); ctx.lineTo(2*s, 5*s); ctx.lineTo(3*s, 2*s); ctx.closePath(); ctx.fill();
    // scale pattern
    ctx.fillStyle = finColor;
    for (let i=-3;i<=2;i++) ctx.fillRect(i*1.5*s, ((i%2)? -1: 0)*s, 1*s, 1*s);
    // eye
    ctx.fillStyle = "#fff"; ctx.fillRect(3*s, -1*s, 1.3*s, 1.3*s);
    ctx.fillStyle = "#000"; ctx.fillRect(3.3*s, -0.7*s, 0.7*s, 0.7*s);
    ctx.restore();
  }

  // Piranha: stout deep body, jutting lower jaw with teeth
  function drawPiranhaSprite(cx, cy, scale, bodyColor, finColor, dir) {
    const s = scale, d = dir || 1;
    ctx.save(); ctx.translate(cx, cy); ctx.scale(d, 1);
    ctx.fillStyle = bodyColor;
    // deep chunky body
    ctx.beginPath(); ctx.ellipse(-1*s, 0, 5*s, 4.5*s, 0, 0, Math.PI*2); ctx.fill();
    // jutting jaw
    ctx.fillRect(3*s, 0, 3*s, 2.5*s);
    // teeth
    ctx.fillStyle = "#ffffff";
    ctx.fillRect(3.5*s, 1.5*s, 0.6*s, 1*s); ctx.fillRect(4.4*s, 1.5*s, 0.6*s, 1*s); ctx.fillRect(5.3*s, 1.5*s, 0.6*s, 1*s);
    // tail
    ctx.fillStyle = bodyColor;
    ctx.beginPath(); ctx.moveTo(-5*s, 0); ctx.lineTo(-8*s, -3*s); ctx.lineTo(-8*s, 3*s); ctx.closePath(); ctx.fill();
    // reddish belly
    ctx.fillStyle = "#c84a3a"; ctx.fillRect(-3*s, 2*s, 6*s, 1.5*s);
    // fins
    ctx.fillStyle = finColor; ctx.fillRect(-2*s, -5*s, 3*s, 1*s);
    // angry eye
    ctx.fillStyle = "#ffe14d"; ctx.fillRect(2*s, -2*s, 1.4*s, 1.4*s);
    ctx.fillStyle = "#000"; ctx.fillRect(2.4*s, -1.6*s, 0.7*s, 0.7*s);
    ctx.restore();
  }

  // Scorpionfish: spiky body with venomous dorsal spines, big head
  function drawScorpionSprite(cx, cy, scale, bodyColor, finColor, dir) {
    const s = scale, d = dir || 1;
    ctx.save(); ctx.translate(cx, cy); ctx.scale(d, 1);
    ctx.fillStyle = bodyColor;
    // lumpy body + big head
    ctx.beginPath(); ctx.ellipse(0, 0, 6*s, 4*s, 0, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(4*s, 0, 3*s, 3.5*s, 0, 0, Math.PI*2); ctx.fill();
    // spiky dorsal spines
    ctx.fillStyle = finColor;
    for (let i=-4;i<=2;i++){ ctx.beginPath(); ctx.moveTo(i*1.5*s, -3*s); ctx.lineTo(i*1.5*s+0.6*s, -6*s); ctx.lineTo(i*1.5*s+1.2*s, -3*s); ctx.closePath(); ctx.fill(); }
    // spiny pectoral fan
    ctx.beginPath(); ctx.moveTo(0, 2*s); ctx.lineTo(-2*s, 6*s); ctx.lineTo(3*s, 5*s); ctx.closePath(); ctx.fill();
    // tail
    ctx.fillStyle = bodyColor; ctx.beginPath(); ctx.moveTo(-6*s,0); ctx.lineTo(-8*s,-3*s); ctx.lineTo(-8*s,3*s); ctx.closePath(); ctx.fill();
    // mottling
    ctx.fillStyle = finColor; ctx.fillRect(-1*s,-1*s,1*s,1*s); ctx.fillRect(1*s,1*s,1*s,1*s);
    // eye
    ctx.fillStyle = "#ffcf50"; ctx.fillRect(4*s, -1.5*s, 1.3*s, 1.3*s);
    ctx.fillStyle = "#000"; ctx.fillRect(4.3*s, -1.1*s, 0.7*s, 0.7*s);
    ctx.restore();
  }

  // Long slender fish (barracuda/wahoo/needlefish/eel-like): elongated body, pointed jaw
  function drawLongfishSprite(cx, cy, scale, bodyColor, finColor, dir) {
    const s = scale, d = dir || 1;
    ctx.save(); ctx.translate(cx, cy); ctx.scale(d, 1);
    ctx.fillStyle = bodyColor;
    // long thin body
    ctx.beginPath();
    ctx.moveTo(-9*s, 0);
    ctx.quadraticCurveTo(-2*s, -2*s, 7*s, -1*s);
    ctx.lineTo(9*s, 0);                  // pointed snout
    ctx.lineTo(7*s, 1*s);
    ctx.quadraticCurveTo(-2*s, 2*s, -9*s, 0);
    ctx.closePath(); ctx.fill();
    // forked tail
    ctx.beginPath(); ctx.moveTo(-9*s, 0); ctx.lineTo(-12*s, -3*s); ctx.lineTo(-10*s, 0); ctx.lineTo(-12*s, 3*s); ctx.closePath(); ctx.fill();
    // small fins
    ctx.fillStyle = finColor;
    ctx.fillRect(-2*s, -2.2*s, 3*s, 0.8*s); ctx.fillRect(-2*s, 1.4*s, 3*s, 0.8*s);
    // lateral stripe
    ctx.fillRect(-6*s, -0.3*s, 10*s, 0.6*s);
    // jaw line + eye
    ctx.strokeStyle = finColor; ctx.lineWidth = Math.max(1,s*0.4);
    ctx.beginPath(); ctx.moveTo(4*s, 0.6*s); ctx.lineTo(8*s, 0.6*s); ctx.stroke();
    ctx.fillStyle = "#fff"; ctx.fillRect(4*s, -1*s, 1.2*s, 1.2*s);
    ctx.fillStyle = "#000"; ctx.fillRect(4.3*s, -0.7*s, 0.7*s, 0.7*s);
    ctx.restore();
  }

  // Salmon: streamlined body, hooked jaw (kype), spotted back, reddish flank
  function drawSalmonSprite(cx, cy, scale, bodyColor, finColor, dir) {
    const s = scale, d = dir || 1;
    ctx.save(); ctx.translate(cx, cy); ctx.scale(d, 1);
    ctx.fillStyle = bodyColor;
    // torpedo body
    ctx.beginPath();
    ctx.moveTo(-6*s, 0); ctx.quadraticCurveTo(-1*s, -3.5*s, 5*s, -1.5*s);
    ctx.lineTo(6*s, 0); ctx.quadraticCurveTo(5*s, 1*s, 4*s, 1.5*s);
    ctx.quadraticCurveTo(-1*s, 3.5*s, -6*s, 0); ctx.closePath(); ctx.fill();
    // hooked lower jaw (kype)
    ctx.fillRect(5*s, 0.5*s, 2*s, 1*s);
    ctx.beginPath(); ctx.moveTo(6*s, 1.5*s); ctx.lineTo(7*s, -0.5*s); ctx.lineTo(6*s, -0.5*s); ctx.closePath(); ctx.fill();
    // forked tail
    ctx.beginPath(); ctx.moveTo(-6*s, 0); ctx.lineTo(-9*s, -3*s); ctx.lineTo(-7*s, 0); ctx.lineTo(-9*s, 3*s); ctx.closePath(); ctx.fill();
    // reddish flank stripe (spawning colors)
    ctx.fillStyle = "#c85040"; ctx.fillRect(-4*s, -0.5*s, 8*s, 1.5*s);
    // dorsal + adipose fins
    ctx.fillStyle = finColor;
    ctx.beginPath(); ctx.moveTo(-1*s, -2.5*s); ctx.lineTo(1*s, -4.5*s); ctx.lineTo(2*s, -2*s); ctx.closePath(); ctx.fill();
    ctx.fillRect(-4*s, -2*s, 1.2*s, 0.8*s);   // adipose
    // spots on the back
    ctx.fillStyle = "#3a3a3a";
    ctx.fillRect(-2*s,-1.5*s,1*s,1*s); ctx.fillRect(0,-2*s,1*s,1*s); ctx.fillRect(2*s,-1.2*s,1*s,1*s);
    // eye
    ctx.fillStyle = "#fff"; ctx.fillRect(3*s, -1*s, 1.2*s, 1.2*s);
    ctx.fillStyle = "#000"; ctx.fillRect(3.3*s, -0.7*s, 0.7*s, 0.7*s);
    ctx.restore();
  }

  // Grouper: massive stocky body, huge mouth, small fins
  function drawGrouperSprite(cx, cy, scale, bodyColor, finColor, dir) {
    const s = scale, d = dir || 1;
    ctx.save(); ctx.translate(cx, cy); ctx.scale(d, 1);
    ctx.fillStyle = bodyColor;
    // big oval body
    ctx.beginPath(); ctx.ellipse(-1*s, 0, 6.5*s, 5*s, 0, 0, Math.PI*2); ctx.fill();
    // large jaw / wide mouth
    ctx.fillRect(4*s, -1*s, 3*s, 3*s);
    ctx.fillStyle = "#2a2a2a"; ctx.fillRect(5.5*s, 0.5*s, 1.8*s, 1.2*s);   // open mouth
    // tail (rounded)
    ctx.fillStyle = bodyColor;
    ctx.beginPath(); ctx.moveTo(-6*s, 0); ctx.lineTo(-9*s, -3.5*s); ctx.lineTo(-9*s, 3.5*s); ctx.closePath(); ctx.fill();
    // long dorsal fin
    ctx.fillStyle = finColor; ctx.fillRect(-3*s, -5.5*s, 7*s, 1.5*s);
    ctx.beginPath(); ctx.moveTo(-1*s, 3*s); ctx.lineTo(1*s, 6*s); ctx.lineTo(2*s, 3*s); ctx.closePath(); ctx.fill();
    // blotchy pattern
    ctx.fillStyle = finColor;
    ctx.fillRect(-3*s,-1*s,1.5*s,1.5*s); ctx.fillRect(0,1*s,1.5*s,1.5*s); ctx.fillRect(1*s,-2*s,1.5*s,1.5*s);
    // eye
    ctx.fillStyle = "#fff"; ctx.fillRect(3*s, -2*s, 1.4*s, 1.4*s);
    ctx.fillStyle = "#000"; ctx.fillRect(3.4*s, -1.6*s, 0.7*s, 0.7*s);
    ctx.restore();
  }

  // Arapaima: very long armored body, fins set far back, fan tail
  function drawArapaimaSprite(cx, cy, scale, bodyColor, finColor, dir) {
    const s = scale, d = dir || 1;
    ctx.save(); ctx.translate(cx, cy); ctx.scale(d, 1);
    ctx.fillStyle = bodyColor;
    // long thick body
    ctx.beginPath();
    ctx.moveTo(-8*s, 0); ctx.quadraticCurveTo(-2*s, -3.5*s, 6*s, -2*s);
    ctx.lineTo(8*s, 0); ctx.quadraticCurveTo(6*s, 2*s, 4*s, 2.5*s);
    ctx.quadraticCurveTo(-2*s, 3.5*s, -8*s, 0); ctx.closePath(); ctx.fill();
    // dorsal & anal fins set far back near tail
    ctx.fillStyle = finColor;
    ctx.fillRect(-7*s, -3.5*s, 4*s, 1.2*s); ctx.fillRect(-7*s, 2.3*s, 4*s, 1.2*s);
    // big rounded fan tail
    ctx.beginPath(); ctx.moveTo(-8*s, 0); ctx.lineTo(-12*s, -4*s); ctx.lineTo(-11*s, 0); ctx.lineTo(-12*s, 4*s); ctx.closePath(); ctx.fill();
    // reddish tail markings (arapaima's signature)
    ctx.fillStyle = "#c0503a"; ctx.fillRect(-9*s, -3*s, 2*s, 6*s);
    // armored scale pattern
    ctx.fillStyle = finColor;
    for (let i=-5;i<=4;i+=3){ ctx.fillRect(i*s, -1*s, 1*s, 1*s); ctx.fillRect(i*s+1.5*s, 0.5*s, 1*s, 1*s); }
    // eye
    ctx.fillStyle = "#fff"; ctx.fillRect(5*s, -1.5*s, 1.2*s, 1.2*s);
    ctx.fillStyle = "#000"; ctx.fillRect(5.3*s, -1.1*s, 0.7*s, 0.7*s);
    ctx.restore();
  }

  // Herring/sardine: small slim silvery body, single small dorsal fin
  function drawHerringSprite(cx, cy, scale, bodyColor, finColor, dir) {
    const s = scale, d = dir || 1;
    ctx.save(); ctx.translate(cx, cy); ctx.scale(d, 1);
    ctx.fillStyle = bodyColor;
    // slim streamlined body
    ctx.beginPath(); ctx.ellipse(0, 0, 6*s, 2.5*s, 0, 0, Math.PI*2); ctx.fill();
    // forked tail
    ctx.beginPath(); ctx.moveTo(-5*s, 0); ctx.lineTo(-8*s, -2.5*s); ctx.lineTo(-6.5*s, 0); ctx.lineTo(-8*s, 2.5*s); ctx.closePath(); ctx.fill();
    // single small dorsal fin
    ctx.fillStyle = finColor;
    ctx.beginPath(); ctx.moveTo(-1*s, -2*s); ctx.lineTo(0, -3.5*s); ctx.lineTo(1*s, -2*s); ctx.closePath(); ctx.fill();
    // shiny silver belly line
    ctx.fillStyle = "#f0f4f6"; ctx.fillRect(-4*s, 0.6*s, 8*s, 0.8*s);
    // blue-green back
    ctx.fillStyle = finColor; ctx.fillRect(-4*s, -1.6*s, 8*s, 0.8*s);
    // eye
    ctx.fillStyle = "#fff"; ctx.fillRect(3*s, -0.8*s, 1.1*s, 1.1*s);
    ctx.fillStyle = "#000"; ctx.fillRect(3.3*s, -0.5*s, 0.6*s, 0.6*s);
    ctx.restore();
  }

  // Jack/Carango: tall laterally-compressed body, deeply forked tail, scutes
  function drawJackSprite(cx, cy, scale, bodyColor, finColor, dir) {
    const s = scale, d = dir || 1;
    ctx.save(); ctx.translate(cx, cy); ctx.scale(d, 1);
    ctx.fillStyle = bodyColor;
    // tall diamond-ish body
    ctx.beginPath();
    ctx.moveTo(5*s, 0); ctx.quadraticCurveTo(1*s, -5.5*s, -3*s, -1.5*s);
    ctx.quadraticCurveTo(-4*s, 0, -3*s, 1.5*s);
    ctx.quadraticCurveTo(1*s, 5.5*s, 5*s, 0);
    ctx.closePath(); ctx.fill();
    // pointed snout
    ctx.fillRect(4*s, -1*s, 2*s, 2*s);
    // deeply forked tail
    ctx.beginPath(); ctx.moveTo(-3*s, 0); ctx.lineTo(-9*s, -5*s); ctx.lineTo(-6*s, 0); ctx.lineTo(-9*s, 5*s); ctx.closePath(); ctx.fill();
    // dorsal & anal fins
    ctx.fillStyle = finColor;
    ctx.beginPath(); ctx.moveTo(-1*s,-5*s); ctx.lineTo(1*s,-6.5*s); ctx.lineTo(2*s,-4*s); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(-1*s,5*s); ctx.lineTo(1*s,6.5*s); ctx.lineTo(2*s,4*s); ctx.closePath(); ctx.fill();
    // scutes along the tail base (jack signature)
    ctx.fillStyle = finColor; ctx.fillRect(-4*s, -0.5*s, 3*s, 1*s);
    // silver belly
    ctx.fillStyle = "#eef2f4"; ctx.fillRect(-2*s, 1.5*s, 6*s, 1*s);
    // eye
    ctx.fillStyle = "#fff"; ctx.fillRect(3*s, -1.5*s, 1.3*s, 1.3*s);
    ctx.fillStyle = "#000"; ctx.fillRect(3.3*s, -1.1*s, 0.7*s, 0.7*s);
    ctx.restore();
  }

  // Snapper/Dentice: classic profile with a sloped forehead and pointed snout
  function drawSnapperSprite(cx, cy, scale, bodyColor, finColor, dir) {
    const s = scale, d = dir || 1;
    ctx.save(); ctx.translate(cx, cy); ctx.scale(d, 1);
    ctx.fillStyle = bodyColor;
    // oval body with a sloped head
    ctx.beginPath();
    ctx.moveTo(6*s, -0.5*s);            // snout
    ctx.lineTo(3*s, -4*s);              // sloped forehead
    ctx.quadraticCurveTo(-3*s, -4*s, -6*s, 0);
    ctx.quadraticCurveTo(-3*s, 4*s, 3*s, 3*s);
    ctx.lineTo(6*s, 1*s);
    ctx.closePath(); ctx.fill();
    // forked tail
    ctx.beginPath(); ctx.moveTo(-6*s, 0); ctx.lineTo(-9*s, -3*s); ctx.lineTo(-7*s, 0); ctx.lineTo(-9*s, 3*s); ctx.closePath(); ctx.fill();
    // continuous dorsal fin
    ctx.fillStyle = finColor; ctx.fillRect(-3*s, -5*s, 6*s, 1.3*s);
    // anal fin + pectoral
    ctx.beginPath(); ctx.moveTo(0,3*s); ctx.lineTo(2*s,5.5*s); ctx.lineTo(3*s,3*s); ctx.closePath(); ctx.fill();
    // mouth line
    ctx.strokeStyle = finColor; ctx.lineWidth = Math.max(1,s*0.4);
    ctx.beginPath(); ctx.moveTo(6*s, 0.3*s); ctx.lineTo(4*s, 1*s); ctx.stroke();
    // eye
    ctx.fillStyle = "#fff"; ctx.fillRect(3*s, -1.5*s, 1.3*s, 1.3*s);
    ctx.fillStyle = "#000"; ctx.fillRect(3.3*s, -1.1*s, 0.7*s, 0.7*s);
    ctx.restore();
  }

  // Mahi-Mahi: tall squared-off forehead, long dorsal fin, forked tail
  function drawMahiSprite(cx, cy, scale, bodyColor, finColor, dir) {
    const s = scale, d = dir || 1;
    ctx.save(); ctx.translate(cx, cy); ctx.scale(d, 1);
    ctx.fillStyle = bodyColor;
    // body tapering to tail, with a tall blunt head
    ctx.beginPath();
    ctx.moveTo(6*s, -4*s);              // high squared forehead
    ctx.lineTo(6*s, 1*s);
    ctx.quadraticCurveTo(0, 4*s, -6*s, 0.5*s);
    ctx.quadraticCurveTo(0, -3*s, 5*s, -4*s);
    ctx.closePath(); ctx.fill();
    // blunt snout
    ctx.fillRect(6*s, -1*s, 1.5*s, 2*s);
    // long dorsal fin running the whole back
    ctx.fillStyle = finColor;
    ctx.beginPath();
    ctx.moveTo(5*s, -4*s); ctx.quadraticCurveTo(-1*s, -7*s, -5*s, -1*s);
    ctx.lineTo(-4*s, -0.5*s); ctx.quadraticCurveTo(-1*s, -4*s, 5*s, -3*s);
    ctx.closePath(); ctx.fill();
    // deeply forked tail
    ctx.fillStyle = bodyColor;
    ctx.beginPath(); ctx.moveTo(-6*s, 0); ctx.lineTo(-10*s, -4*s); ctx.lineTo(-7.5*s, 0); ctx.lineTo(-10*s, 4*s); ctx.closePath(); ctx.fill();
    // bright spots
    ctx.fillStyle = "#ffe14d"; ctx.fillRect(-1*s, 0, 1*s, 1*s); ctx.fillRect(1*s, -1*s, 1*s, 1*s); ctx.fillRect(2*s, 1*s, 1*s, 1*s);
    // eye
    ctx.fillStyle = "#fff"; ctx.fillRect(4*s, -2*s, 1.3*s, 1.3*s);
    ctx.fillStyle = "#000"; ctx.fillRect(4.3*s, -1.6*s, 0.7*s, 0.7*s);
    ctx.restore();
  }

  // Tarpon: large bright silver scales, upturned lower jaw, forked tail
  function drawTarponSprite(cx, cy, scale, bodyColor, finColor, dir) {
    const s = scale, d = dir || 1;
    ctx.save(); ctx.translate(cx, cy); ctx.scale(d, 1);
    ctx.fillStyle = bodyColor;
    // elongated silvery body
    ctx.beginPath(); ctx.ellipse(0, 0, 7*s, 3.5*s, 0, 0, Math.PI*2); ctx.fill();
    // upturned lower jaw
    ctx.fillRect(5*s, -1*s, 2.5*s, 1.5*s);
    ctx.beginPath(); ctx.moveTo(6*s, 0.5*s); ctx.lineTo(7.5*s, -1.5*s); ctx.lineTo(6*s, -1*s); ctx.closePath(); ctx.fill();
    // forked tail
    ctx.beginPath(); ctx.moveTo(-7*s, 0); ctx.lineTo(-10*s, -4*s); ctx.lineTo(-8*s, 0); ctx.lineTo(-10*s, 4*s); ctx.closePath(); ctx.fill();
    // trailing dorsal ray filament (tarpon signature)
    ctx.fillStyle = finColor;
    ctx.beginPath(); ctx.moveTo(-1*s,-3.5*s); ctx.lineTo(-4*s,-6*s); ctx.lineTo(0,-3*s); ctx.closePath(); ctx.fill();
    // big shiny silver scales
    ctx.fillStyle = "#f2f6f8";
    for (let i=-4;i<=3;i++) for (let j=-1;j<=1;j++) ctx.fillRect(i*1.6*s, j*1.6*s, 1.2*s, 1.2*s);
    // eye
    ctx.fillStyle = "#fff"; ctx.fillRect(4*s, -1.2*s, 1.4*s, 1.4*s);
    ctx.fillStyle = "#000"; ctx.fillRect(4.4*s, -0.8*s, 0.8*s, 0.8*s);
    ctx.restore();
  }

  // Pixel-art shrimp/krill (curved segmented body, legs, antennae)
  function drawShrimpSprite(cx, cy, scale, bodyColor, finColor, dir) {
    const s = scale, d = dir || 1;
    ctx.save();
    ctx.translate(cx, cy);
    ctx.scale(d, 1);
    ctx.fillStyle = bodyColor;
    ctx.fillRect(-5*s, -1*s, 8*s, 3*s);
    ctx.fillRect(-6*s, 0, 3*s, 3*s);
    ctx.fillRect(3*s, -2*s, 3*s, 3*s);
    ctx.fillStyle = finColor;
    for (let i = -4; i <= 1; i += 2) ctx.fillRect(i*s, -1*s, 0.6*s, 3*s);
    ctx.fillRect(-7*s, -1*s, 1*s, 4*s);
    ctx.fillStyle = bodyColor;
    for (let i = -4; i <= 2; i += 2) ctx.fillRect(i*s, 2*s, 1*s, 2*s);
    ctx.strokeStyle = finColor; ctx.lineWidth = Math.max(1, s*0.5);
    ctx.beginPath(); ctx.moveTo(5*s, -1*s); ctx.lineTo(9*s, -3*s); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(5*s, 0); ctx.lineTo(9*s, 0); ctx.stroke();
    ctx.fillStyle = "#000"; ctx.fillRect(4*s, -1*s, 1*s, 1*s);
    ctx.restore();
  }

  // Pixel-art leopard seal (sleek body, flippers, spots)
  function drawSealSprite(cx, cy, scale, bodyColor, dir) {
    const s = scale, d = dir || 1;
    ctx.save();
    ctx.translate(cx, cy);
    ctx.scale(d, 1);
    ctx.fillStyle = bodyColor;
    ctx.beginPath(); ctx.ellipse(0, 0, 7*s, 3.5*s, 0, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(6*s, -1*s, 3*s, 2.5*s, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillRect(-9*s, -2*s, 2*s, 2*s); ctx.fillRect(-9*s, 1*s, 2*s, 2*s);
    ctx.fillStyle = "#6a7078"; ctx.fillRect(1*s, 2*s, 4*s, 2*s);
    ctx.fillStyle = "#5a6068";
    ctx.fillRect(-3*s, -1*s, 1*s, 1*s); ctx.fillRect(0, 1*s, 1*s, 1*s); ctx.fillRect(2*s, -2*s, 1*s, 1*s);
    ctx.fillStyle = "#c8ccd0"; ctx.fillRect(-4*s, 2*s, 8*s, 1*s);
    ctx.fillStyle = "#000"; ctx.fillRect(7*s, -1*s, 1*s, 1*s);
    ctx.restore();
  }

  // Pixel-art orca (killer whale): black body, white belly + eye patch, tall dorsal fin
  function drawOrcaSprite(cx, cy, scale, dir) {
    const s = scale, d = dir || 1;
    ctx.save();
    ctx.translate(cx, cy);
    ctx.scale(d, 1);
    // body (black)
    ctx.fillStyle = "#141418";
    ctx.fillRect(-6*s, -2*s, 12*s, 5*s);
    ctx.fillRect(-5*s, -3*s, 9*s, 7*s);
    // tail flukes
    ctx.fillRect(-8*s, -3*s, 2*s, 2*s);
    ctx.fillRect(-8*s, 2*s, 2*s, 2*s);
    ctx.fillRect(-7*s, -1*s, 1*s, 3*s);
    // dorsal fin (tall)
    ctx.beginPath();
    ctx.moveTo(-1*s, -3*s); ctx.lineTo(0, -7*s); ctx.lineTo(2*s, -3*s); ctx.closePath(); ctx.fill();
    // pectoral fin
    ctx.fillRect(0, 2*s, 3*s, 2*s);
    // white belly patch
    ctx.fillStyle = "#f4f4f8";
    ctx.fillRect(-3*s, 1*s, 7*s, 2*s);
    // white eye patch
    ctx.fillRect(2*s, -2*s, 2*s, 1.6*s);
    // eye
    ctx.fillStyle = "#000000"; ctx.fillRect(3*s, -1.6*s, 0.9*s, 0.9*s);
    ctx.restore();
  }

  // Pixel-art squid sprite (mantle + head + wavy tentacles)
  function drawSquidSprite(cx, cy, scale, bodyColor, finColor, dir) {
    const s = scale, d = dir || 1;
    ctx.save();
    ctx.translate(cx, cy);
    ctx.scale(d, 1);
    // pointed mantle (body) pointing up
    ctx.fillStyle = bodyColor;
    ctx.beginPath();
    ctx.moveTo(0, -6*s); ctx.lineTo(-3*s, 0); ctx.lineTo(3*s, 0); ctx.closePath(); ctx.fill();
    ctx.fillRect(-3*s, -1*s, 6*s, 3*s);
    // side fins
    ctx.fillStyle = finColor;
    ctx.fillRect(-4*s, -4*s, 1*s, 3*s); ctx.fillRect(3*s, -4*s, 1*s, 3*s);
    // eyes
    ctx.fillStyle = "#ffffff"; ctx.fillRect(-2*s, -1*s, 1.3*s, 1.3*s); ctx.fillRect(1*s, -1*s, 1.3*s, 1.3*s);
    ctx.fillStyle = "#000000"; ctx.fillRect(-1.6*s, -0.6*s, 0.7*s, 0.7*s); ctx.fillRect(1.3*s, -0.6*s, 0.7*s, 0.7*s);
    // wavy tentacles
    ctx.fillStyle = bodyColor;
    for (let i = -2; i <= 2; i++) {
      const wob = Math.sin(frame*0.15 + i) * 1.2;
      ctx.fillRect(i*1.2*s + wob, 2*s, 1*s, 4*s);
    }
    ctx.restore();
  }

  // Persistent coins HUD (top-right), hidden during menus
  function drawCoinsHUD() {
    const label = "$" + coins;
    const w = label.length * 6 + 16;
    const x = W - w - 4, y = 4;
    ctx.fillStyle = PAL.textBg; ctx.fillRect(x, y, w, 11);
    ctx.strokeStyle = PAL.dark; ctx.strokeRect(x+0.5, y+0.5, w-1, 10);
    // coin icon
    ctx.fillStyle = "#e0b020"; ctx.beginPath(); ctx.arc(x+6, y+5, 3, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = "#f5d868"; ctx.fillRect(x+5, y+4, 2, 2);
    text(label, x + 11, y + 2, PAL.text);
  }

  // Small HUD showing the equipped bait + remaining count
  function drawBaitHUD() {
    const b = BAITS[equippedBait];
    const qty = (equippedBait === "verme") ? "\u221E" : String(baitStock[equippedBait] || 0);
    const label = baitName(equippedBait) + " x" + qty;
    const w = label.length * 5 + 14;
    const x = 4, y = 4;
    ctx.fillStyle = PAL.textBg; ctx.fillRect(x, y, w, 11);
    ctx.strokeStyle = PAL.dark; ctx.strokeRect(x+0.5, y+0.5, w-1, 10);
    ctx.fillStyle = b.color; ctx.fillRect(x+3, y+3, 5, 5);
    text(label, x + 11, y + 2, PAL.text);
  }

  // Scene: fisherman holds the rod vertical, fish dangling on the line
  function drawCatchScene() {
    const x = player.x, y = player.y;
    // body (back)
    const askin = AV.skin[avatar.skin], ahair = AV.hair[avatar.hair];
    const ashirt = AV.shirt[avatar.shirt], apants = AV.pants[avatar.pants], ahat = AV.hat[avatar.hat];
    ctx.fillStyle = apants; ctx.fillRect(x-6, y-2, 12, 10);
    ctx.fillStyle = shade(apants,-0.35); ctx.fillRect(x-1, y-2, 2, 10);
    ctx.fillStyle = ashirt; ctx.fillRect(x-8, y-16, 16, 15);
    ctx.fillStyle = shade(ashirt,-0.2); ctx.fillRect(x-8, y-16, 16, 3);
    // head + hair + hat
    ctx.fillStyle = askin; ctx.fillRect(x-4, y-24, 8, 8);
    ctx.fillStyle = ahair; ctx.fillRect(x-5, y-25, 10, 4);
    if (ahat) { ctx.fillStyle = ahat; ctx.fillRect(x-5, y-27, 10, 3); }
    // both arms raised holding the rod up
    ctx.fillStyle = ashirt; ctx.fillRect(x-9, y-24, 3, 12);
    ctx.fillStyle = ashirt; ctx.fillRect(x+6, y-24, 3, 12);
    // vertical rod going up out of frame
    ctx.strokeStyle = PAL.rod; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(x, y-24); ctx.lineTo(x+2, 30); ctx.stroke();
    // line hanging down from rod tip, fish dangling and wiggling
    const lineX = x + 8;
    ctx.strokeStyle = PAL.line; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(x+2, 30); ctx.lineTo(lineX, 66); ctx.stroke();
    const wig = Math.sin(frame*0.3) * 3;
    const cf = landedFish || { color:"#5aa0d8", fin:"#3f7fb8", size:1, name:"Pesce" };
    const fscale = (2.0 + (cf.size ? (cf.size - 1) * 0.8 : 0)) * (cf.tierScale || 1);
    const sp = cf.species;
    if (sp && (sp.crab || sp.squid || sp.orca || sp.krill || sp.seal || sp.shape || sp.ghost)) {
      // hang the creature vertically (head up) from the line
      drawCreature(sp, lineX + wig, 70, fscale, 1, true);
    } else {
      // regular fish hangs head-up on the line
      drawFishSprite(lineX + wig, 76, fscale, cf.color, cf.fin, 1, true);
    }

    // banner + reward + name
    drawBanner((cf.name ? fishName(cf) : t("caught")) + "!", "#2e7d32", 108);
    textBox("+" + lastReward + " " + t("coins_won"), 6, 6);
    drawCoinsHUD();

    // new-award popup (medal + name)
    if (awardPopup) {
      const inf = AWARD_INFO[awardPopup.rank];
      const bw = 128, bh = 26, bx = (W-bw)/2, by = 30;
      ctx.fillStyle = "rgba(15,30,20,0.85)"; ctx.fillRect(bx, by, bw, bh);
      ctx.strokeStyle = inf.color; ctx.lineWidth = 1; ctx.strokeRect(bx+0.5, by+0.5, bw-1, bh-1);
      drawHookMedal(bx + 14, by + 13, 1.1, awardPopup.rank);
      text(t("new_prize"), bx + 28, by + 4, "#ffe14d");
      text(t(["","bronze","silver","gold"][awardPopup.rank]), bx + 28, by + 14, inf.color);
      awardPopup.timer += 1;
      if (awardPopup.timer > 130) awardPopup = null;
    }

    // "new zone available" popup (shown when no award popup is up)
    if (zonePopup && !awardPopup) {
      const bw = 140, bh = 24, bx = (W-bw)/2, by = 30;
      ctx.fillStyle = "rgba(15,30,45,0.9)"; ctx.fillRect(bx, by, bw, bh);
      ctx.strokeStyle = "#ffe14d"; ctx.lineWidth = 1; ctx.strokeRect(bx+0.5, by+0.5, bw-1, bh-1);
      // little unlocked-lock icon
      ctx.fillStyle = "#ffe14d"; ctx.fillRect(bx+8, by+11, 6, 5);
      ctx.strokeStyle = "#ffe14d"; ctx.beginPath(); ctx.arc(bx+8, by+11, 2.5, Math.PI, 0); ctx.stroke();
      ctx.textAlign="center";
      text(t("zone_ready"), W/2+4, by+4, "#ffe14d");
      text(t("zone_ready_sub"), W/2+4, by+14, "#cfe0ea");
      ctx.textAlign="left";
      zonePopup.timer += 1;
      if (zonePopup.timer > 150) zonePopup = null;
    }
  }

  // Scene: little fish jumps and swims away toward the horizon
  function drawEscapeScene() {
    if (escaper.active) {
      // splash trail
      ctx.fillStyle = "#bfe3f5";
      ctx.fillRect(escaper.x-1, escaper.y+3, 2, 1);
      const sc = Math.max(0.8, 1.6 * ((escaper.y - HORIZON) / (H - HORIZON)));
      drawFishSprite(escaper.x, escaper.y, sc, "#7aa8c8", "#5f8aa8", -1);
    }
    drawBanner(t("escaped"), "#8a2c2c", 108);
    const lr = { "TROPPO TARDI":"lost_late", "LENZA SPEZZATA!":"lost_snap", "LENZA LASCA!":"lost_slack" };
    textBox(lr[lostReason] ? t(lr[lostReason]) : (lostReason || ""), 6, 6);
    drawCoinsHUD();
  }
