<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1e1e2e">
<title>Game Boy Fishing</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    width: 100%; height: 100%;
    background: #15151f;
    overflow: hidden;
    font-family: monospace;
    touch-action: none;
    -webkit-user-select: none; user-select: none;
  }
  #device {
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: min(100vw, 480px);
    height: min(100vh, 900px);
    background: linear-gradient(160deg, #d7c9e8 0%, #c3b3d9 100%);
    border-radius: 18px 18px 55px 18px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5), inset 0 2px 4px rgba(255,255,255,0.4);
    display: flex; flex-direction: column;
    padding: 3.5% 4% 4% 4%;
  }
  /* ---------- SCREEN AREA ---------- */
  #screen-frame {
    background: #4a3f5e;
    border-radius: 10px 10px 30px 10px;
    padding: 3% 3% 4% 3%;
    box-shadow: inset 0 2px 8px rgba(0,0,0,0.5);
    flex: 0 0 auto;
  }
  #brand {
    text-align: center; color: #6b5b8a; font-size: 11px;
    font-weight: bold; letter-spacing: 1px; margin-bottom: 3px;
    font-style: italic;
  }
  #power-row { display:flex; align-items:center; justify-content:center; gap:6px; margin-bottom:4px; }
  #power-led { width:6px; height:6px; border-radius:50%; background:#e05b5b; box-shadow:0 0 4px #ff6b6b; }
  #power-row span { color:#8a7aa8; font-size:8px; letter-spacing:1px; }
  #screen-bezel {
    background: #2a2536;
    border-radius: 6px;
    padding: 6px 5px;
    position: relative;
  }
  canvas {
    display: block;
    width: 100%;
    height: auto;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    border-radius: 2px;
    background: #0f380f;
  }
  /* ---------- CONTROLS AREA ---------- */
  #controls {
    flex: 1 1 auto;
    position: relative;
    margin-top: 4%;
  }
  /* D-PAD */
  #dpad {
    position: absolute;
    left: 7%; top: 8%;
    width: 140px; height: 140px;
  }
  .dbtn {
    position: absolute;
    background: #2c2c3a;
    border: none;
    box-shadow: 0 3px 0 #16161e;
    display: flex; align-items: center; justify-content: center;
    color: #6b6b80; font-size: 15px;
  }
  .dbtn:active, .dbtn.pressed { background:#1c1c28; box-shadow: 0 1px 0 #16161e; transform: translateY(2px); }
  #d-up    { left: 47px; top: 0;   width: 46px; height: 49px; border-radius: 6px 6px 0 0; }
  #d-down  { left: 47px; top: 91px;width: 46px; height: 49px; border-radius: 0 0 6px 6px; }
  #d-left  { left: 0;   top: 47px; width: 49px; height: 46px; border-radius: 6px 0 0 6px; }
  #d-right { left: 91px;top: 47px; width: 49px; height: 46px; border-radius: 0 6px 6px 0; }
  #d-center{ left: 47px;top: 47px; width: 46px; height: 46px; background:#2c2c3a; }
  /* A / B BUTTONS */
  #ab {
    position: absolute;
    right: 5%; top: 6%;
    width: 170px; height: 140px;
    transform: rotate(-20deg);
  }
  .rbtn {
    position: absolute;
    width: 74px; height: 74px;
    border-radius: 50%;
    background: #9b2c6f;
    border: none;
    box-shadow: 0 4px 0 #5e1a44;
    color: #ffd9ee; font-size: 25px; font-weight: bold;
  }
  .rbtn:active, .rbtn.pressed { background:#7a2257; box-shadow: 0 1px 0 #5e1a44; transform: translateY(3px); }
  #btn-a { right: 0;  top: 4px; }
  #btn-b { right: 90px; top: 62px; }
  .rlabel { position:absolute; color:#6b5b8a; font-size:10px; font-weight:bold; }
  #lbl-a { right: 24px; top: 66px; }
  #lbl-b { right: 114px; top: 124px; }
  /* START / SELECT */
  #startsel {
    position: absolute;
    left: 50%; top: 58%;
    transform: translateX(-50%);
    display: flex; gap: 80px;
    z-index: 5;               /* keep Select/Start on top so their taps aren't stolen */
  }
  .pill { width: 70px; height: 21px; border-radius: 11px; background:#2c2c3a; border:none; box-shadow:0 2px 0 #16161e; touch-action: manipulation; }
  .pill:active { transform: translateY(1px); box-shadow:0 1px 0 #16161e; }
  .plabel { position:absolute; color:#6b5b8a; font-size:8px; top:16px; letter-spacing:1px; pointer-events:none; }
  #startsel div { position: relative; text-align:center; }
</style>
</head>
<body>
<div id="device">
  <div id="screen-frame">
    <div id="brand">CRUDO FISHING</div>
    <div id="power-row"><div id="power-led"></div><span>POWER</span></div>
    <div id="screen-bezel">
      <canvas id="game" width="160" height="144"></canvas>
    </div>
  </div>
  <div id="controls">
    <div id="dpad">
      <button class="dbtn" id="d-up" data-key="up">▲</button>
      <button class="dbtn" id="d-left" data-key="left">◀</button>
      <button class="dbtn" id="d-center"></button>
      <button class="dbtn" id="d-right" data-key="right">▶</button>
      <button class="dbtn" id="d-down" data-key="down">▼</button>
    </div>
    <div id="ab">
      <button class="rbtn" id="btn-a" data-key="a">A</button>
      <button class="rbtn" id="btn-b" data-key="b">B</button>
      <span class="rlabel" id="lbl-a">A</span>
      <span class="rlabel" id="lbl-b">B</span>
    </div>
    <div id="startsel">
      <div><button class="pill" data-key="select"></button><span class="plabel">SELECT</span></div>
      <div><button class="pill" data-key="start"></button><span class="plabel">START</span></div>
    </div>
  </div>
</div>

    // Fuji
    "Aji":"Aji","Saba":"Saba","Kurodai":"Kurodai","Calamaro Reef":"Reef Squid",

  // Translated display name for a location object (or key)
  function locName(loc){
    if (typeof loc === "string") loc = LOCATIONS[loc];
    if (!loc) return "";
    return lang==="en" ? (LOC_EN[loc.name] || loc.name) : loc.name;
  }
  function seaName(loc){

  // ---------- 8-BIT AUDIO ----------
  const SFX = (function () {
    let ac = null;
    function ctxAudio() {
      if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){ return null; } }
      if (ac && ac.state === "suspended") ac.resume();
      return ac;
    }
    // play a single square-wave blip (optional `when` = seconds offset from now)
    function blip(freq, dur, type, vol, when) {
      const a = ctxAudio(); if (!a) return;
      const t0 = a.currentTime + (when || 0);
      const osc = a.createOscillator();
      const g = a.createGain();
      osc.type = type || "square";
      osc.frequency.setValueAtTime(freq, t0);
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(vol || 0.15, t0 + 0.008);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      osc.connect(g); g.connect(a.destination);
      osc.start(t0); osc.stop(t0 + dur + 0.02);
    }
    // play a short sequence of notes: [ [freq,dur], ... ]
    function seq(notes, type, vol) {
      const a = ctxAudio(); if (!a) return;
      let t = a.currentTime;
      notes.forEach(([f,d]) => {
        const osc = a.createOscillator(); const g = a.createGain();
        osc.type = type || "square";
        osc.frequency.setValueAtTime(f, t);
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(vol || 0.15, t + 0.01);
        g.gain.exponentialRampToValueAtTime(0.0001, t + d);
        osc.connect(g); g.connect(a.destination);
        osc.start(t); osc.stop(t + d + 0.02);
        t += d;
      });
    }
    // A single crisp METALLIC ratchet click: a very short burst of high-passed
    // noise (the "tick" body) plus a bright high sine ping (the metallic ring).
    // `when` = seconds offset from now, `intensity` 0..1 (louder/brighter under load).
    let _noiseBuf = null;
    function noiseBuffer(a) {
      if (_noiseBuf) return _noiseBuf;
      const len = Math.floor(a.sampleRate * 0.05);
      const buf = a.createBuffer(1, len, a.sampleRate);
      const d = buf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      _noiseBuf = buf; return buf;
    }
    function metalClick(when, intensity) {
      const a = ctxAudio(); if (!a) return;
      const t0 = a.currentTime + (when || 0);
      const inten = intensity == null ? 1 : intensity;
      // --- noise transient (the mechanical "tick") ---
      const src = a.createBufferSource();
      src.buffer = noiseBuffer(a);
      src.playbackRate.value = 1.4 + Math.random() * 0.5;
      const hp = a.createBiquadFilter();
      hp.type = "highpass"; hp.frequency.value = 3500;      // keep only crisp highs
      const bp = a.createBiquadFilter();
      bp.type = "bandpass"; bp.frequency.value = 5200 + Math.random() * 2600; bp.Q.value = 6;
      const gn = a.createGain();
      const vol = 0.06 + inten * 0.05;
      gn.gain.setValueAtTime(vol, t0);
      gn.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.018);  // super short = "click"
      src.connect(hp); hp.connect(bp); bp.connect(gn); gn.connect(a.destination);
      src.start(t0); src.stop(t0 + 0.03);
      // --- metallic ring on top (bright, detuned) ---
      const osc = a.createOscillator();
      osc.type = "square";
      osc.frequency.setValueAtTime(2400 + Math.random() * 900, t0);
      const og = a.createGain();
      og.gain.setValueAtTime(0.0001, t0);
      og.gain.exponentialRampToValueAtTime(0.05 + inten * 0.03, t0 + 0.002);
      og.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.012);
      osc.connect(og); og.connect(a.destination);
      osc.start(t0); osc.stop(t0 + 0.02);
    }
    return {
      unlock: ctxAudio,

      alarm:  () => seq([[1046,0.09],[784,0.09],[1046,0.09],[784,0.09],[1046,0.12]], "square", 0.18),
      win:    () => seq([[523,0.10],[659,0.10],[784,0.10],[1047,0.18]], "square", 0.16),
      lose:   () => seq([[392,0.12],[311,0.12],[247,0.22]], "sawtooth", 0.16),
      coin:   () => seq([[988,0.06],[1319,0.12]], "square", 0.15),
      door:   () => seq([[523,0.07],[392,0.10]], "square", 0.16),
      splash: () => seq([[440,0.05],[294,0.05],[196,0.12]], "sawtooth", 0.14),
      // crisp metallic ratchet click of the reel drag; fired rapidly while reeling
      reel:   (when, intensity) => metalClick(when, intensity),
      // faint water splash bed under the drag (looped softly during a fight reel)
      reelSplash: (when) => {
        const a = ctxAudio(); if (!a) return;
        const t0 = a.currentTime + (when || 0);
        const src = a.createBufferSource(); src.buffer = noiseBuffer(a);
        src.playbackRate.value = 0.5;
        const lp = a.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 1400;
        const g = a.createGain();
        g.gain.setValueAtTime(0.0001, t0);
        g.gain.exponentialRampToValueAtTime(0.03, t0 + 0.03);
        g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.16);
        src.connect(lp); lp.connect(g); g.connect(a.destination);
        src.start(t0); src.stop(t0 + 0.18);
      },
      vibrate:(pattern) => { try { if (navigator.vibrate) navigator.vibrate(pattern); } catch(e){} },

      // ----- background music (two tracks, low volume, looping) -----
      _musicOn: false,
      _musicTimer: null,
      _track: "shanty",
      musicPlaying: function(){ return this._musicOn; },
      currentTrack: function(){ return this._track; },
      _tracks: (function(){
        const N = { G3:196, A3:220, B3:247, C4:262, D4:294, E4:330, F4:349, G4:392, A4:440, B4:494, C5:523, D5:587, R:0 };
        return {
          // slow, gentle sea shanty (title / menus)
          shanty: {
            beat: 0.30, vol: 0.028, wave: "square", bassWave: "triangle",
            mel: [
              [N.D4,2],[N.G4,2],[N.A4,1],[N.G4,1],
              [N.F4,2],[N.E4,2],[N.D4,2],[N.R,1],[N.D4,1],
              [N.B4,2],[N.A4,1],[N.G4,1],[N.A4,2],[N.C5,2],
              [N.B4,2],[N.G4,2],[N.A4,2],[N.R,1],[N.A4,1],
              [N.G4,4]
            ],
            bass: [N.G3,N.D4,N.C4,N.G3]
          },
          // calmer, slower ambient tune while fishing
          fishing: {
            beat: 0.42, vol: 0.022, wave: "triangle", bassWave: "triangle",
            mel: [
              [N.G4,3],[N.E4,1],[N.D4,4],
              [N.E4,3],[N.G4,1],[N.A4,4],
              [N.C5,2],[N.B4,2],[N.A4,2],[N.G4,2],
              [N.E4,4],[N.D4,4]
            ],
            bass: [N.C4,N.C4,N.G3,N.G3]
          }
        };
      })(),
      startMusic: function (track) {
        const a = ctxAudio(); if (!a) return;
        if (track && track !== this._track) { this._track = track; this.stopMusic(); }
        if (this._musicOn) return;
        this._musicOn = true;
        const T = this._tracks[this._track];
        const beat = T.beat, vol = T.vol;
        let mi = 0, bi = 0;
        const self = this;
        function scheduleChunk() {
          if (!self._musicOn) return;
          const now = a.currentTime;
          let t = now, scheduled = 0;
          while (scheduled < 2.5) {
            const [f, beats] = T.mel[mi];
            const dur = beats * beat;
            if (f) {
              const o = a.createOscillator(), g = a.createGain();
              o.type = T.wave; o.frequency.setValueAtTime(f, t);
              g.gain.setValueAtTime(0.0001, t);
              g.gain.exponentialRampToValueAtTime(vol, t + 0.03);
              g.gain.exponentialRampToValueAtTime(0.0001, t + dur*0.92);
              o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + dur);
            }
            const bf = T.bass[bi % T.bass.length];
            const ob = a.createOscillator(), gb = a.createGain();
            ob.type = T.bassWave; ob.frequency.setValueAtTime(bf/2, t);
            gb.gain.setValueAtTime(0.0001, t);
            gb.gain.exponentialRampToValueAtTime(vol*0.8, t + 0.03);
            gb.gain.exponentialRampToValueAtTime(0.0001, t + dur*0.8);
            ob.connect(gb); gb.connect(a.destination); ob.start(t); ob.stop(t + dur);
            t += dur; scheduled += dur;
            mi = (mi + 1) % T.mel.length; bi++;
          }
          self._musicTimer = setTimeout(scheduleChunk, (t - now) * 1000 - 150);
        }
        scheduleChunk();
      },
      stopMusic: function () {
        this._musicOn = false;
        if (this._musicTimer) { clearTimeout(this._musicTimer); this._musicTimer = null; }
      },
      // switch to a given track (restart only if it actually changed)
      setTrack: function (track) {
        if (track === this._track && this._musicOn) return;
        const wasOn = this._musicOn;
        this.stopMusic();
        this._track = track;
        if (wasOn) this.startMusic(track);
      },
      toggleMusic: function () { if (this._musicOn) this.stopMusic(); else this.startMusic(); }
    };
  })();

  const heldSince = {};     // timestamp (ms) when key went down
  const heldDuration = {};  // duration (ms) of the LAST completed press (set on release)

  const TAP_MAX_MS = 220;   // press shorter than this = "tap/strattone"; longer = "hold/reel"

  function setKey(k, val) {
    if (!(k in keys)) return;
    if (val && !keys[k]) {
      pressedEdge[k] = true; heldSince[k] = performance.now();
      SFX.unlock();
      // Suppress the generic B beep while fighting a fish: the reel drag SFX takes over.
      const inFight = (typeof state !== "undefined") && (typeof STATE !== "undefined") && state === STATE.FIGHT;
      if (SFX[k] && !(k === "b" && inFight)) SFX[k]();   // per-button beep
    }
    if (!val && keys[k]) {
      releasedEdge[k] = true;
      heldDuration[k] = performance.now() - (heldSince[k] || performance.now());
    }
    keys[k] = val;
  }
  function consumePress(k) {
    if (pressedEdge[k]) { pressedEdge[k] = false; return true; }
    return false;
  }
  function consumeRelease(k) {
    if (releasedEdge[k]) { releasedEdge[k] = false; return true; }
    return false;
  }
  // How long a key has been held right now (0 if not held)
  function holdMs(k) { return keys[k] ? (performance.now() - (heldSince[k] || performance.now())) : 0; }
  // Was the last completed press a quick tap?
  function wasTap(k) { return (heldDuration[k] || 0) <= TAP_MAX_MS; }

    btn.addEventListener("touchend", up, {passive:false});

      { shape:"jack",     test:/carango|jack|leccia|permit|pompano/i },
      { shape:"snapper",  test:/snapper|dentice/i }
    ];
    Object.values(LOCATIONS).forEach(loc => {
      [1,2,3,4].forEach(t => loc.fish[t].forEach(sp => {
        if (sp.shape || sp.crab || sp.squid || sp.orca || sp.krill || sp.seal) return;
        for (const r of rules) { if (r.test.test(sp.name)) { sp.shape = r.shape; break; } }
      }));
    });
  })();

  // ---------- PROGRESSION: location order, tickets, unlocking ----------
  const LOCATION_ORDER = [
    "napoli","lofoten","bijagos","antille","amazzonia",

  // ticket price to reach each location the first time (index matches LOCATION_ORDER)
  // Napoli is free; then 50, 100, 150, ... (+50 each step)
  const TICKET_PRICE = LOCATION_ORDER.map((_, i) => i === 0 ? 0 : i * 50);

  // set of unlocked location keys; Napoli always unlocked
  const unlocked = { napoli: true };

  // How many distinct species caught in a location for a given tier
  function tierCaughtCount(locKey, tier) {
    const loc = LOCATIONS[locKey];
    return loc.fish[tier].filter(sp => caught[locKey + ":" + sp.name]).length;
  }

  // Requirement met to unlock the NEXT location: F1>=3, F2>=2, F3>=2 in this location
  function unlockReqMet(locKey) {
    return tierCaughtCount(locKey,1) >= 3 &&
           tierCaughtCount(locKey,2) >= 2 &&
           tierCaughtCount(locKey,3) >= 2;
  }

  function nextLocationKey(locKey) {
    const i = LOCATION_ORDER.indexOf(locKey);
    return (i >= 0 && i < LOCATION_ORDER.length - 1) ? LOCATION_ORDER[i+1] : null;
  }
  function ticketPriceFor(locKey) {
    const i = LOCATION_ORDER.indexOf(locKey);
    return i >= 0 ? TICKET_PRICE[i] : 0;
  }

  // A locked location can be bought if it's the immediate next after an unlocked
  // location whose unlock requirements are met.
  function mapPurchasable(locKey) {
    if (unlocked[locKey]) return false;
    const i = LOCATION_ORDER.indexOf(locKey);
    if (i <= 0) return false;
    const prev = LOCATION_ORDER[i-1];
    return unlocked[prev] && unlockReqMet(prev);
  }

  // ---------- AWARDS (fishing hooks) per location ----------
  // returns 0 = none, 1 = bronze, 2 = silver, 3 = gold
  function tierComplete(locKey, tier) {
    const loc = LOCATIONS[locKey];
    return loc.fish[tier].every(sp => caught[locKey + ":" + sp.name]);
  }
  function tierAny(locKey, tier) {
    const loc = LOCATIONS[locKey];
    return loc.fish[tier].some(sp => caught[locKey + ":" + sp.name]);
  }
  function locationAward(locKey) {
    const base = tierComplete(locKey,1) && tierComplete(locKey,2) && tierComplete(locKey,3);
    if (!base) return 0;
    if (tierComplete(locKey,4)) return 3;   // gold: everything
    if (tierAny(locKey,4))      return 2;   // silver: base + at least 1 tier-4
    return 1;                               // bronze: base only
  }
  const AWARD_INFO = {
    1: { name:"Amo di Bronzo", color:"#c87a3a", ring:"#8a5024" },
    2: { name:"Amo d'Argento", color:"#c8ccd4", ring:"#8f96a0" },
    3: { name:"Amo d'Oro",     color:"#e8c040", ring:"#a88a20" }
  };

  // Count medals across all locations: {bronze, silver, gold}
  function awardTotals() {
    let b=0,s=0,g=0;
    LOCATION_ORDER.forEach(k => {
      const r = locationAward(k);
      if (r===1) b++; else if (r===2) s++; else if (r===3) g++;
    });
    return { bronze:b, silver:s, gold:g, total:b+s+g };
  }
  // Fisherman title based on gold medals earned
  function playerTitle() {
    const g = awardTotals().gold;
    if (g >= 10) return t("titleLegend");
    if (g >= 6)  return t("titleMaster");
    if (g >= 3)  return t("titleExpert");
    if (g >= 1)  return t("titleFisher");
    return t("titleNovice");
  }
  // draw a fishing-hook medal of the given rank (0 = empty/locked slot)
  function drawHookMedal(cx, cy, s, rank) {
    // medal disc
    if (rank === 0) {
      ctx.fillStyle = "#2a3340"; ctx.beginPath(); ctx.arc(cx, cy, 6*s, 0, Math.PI*2); ctx.fill();
      ctx.strokeStyle = "#3f4a58"; ctx.lineWidth = 1; ctx.beginPath(); ctx.arc(cx, cy, 6*s, 0, Math.PI*2); ctx.stroke();
      ctx.fillStyle = "#4a5464"; text("?", cx-2, cy-3, "#4a5464");
      return;
    }
    const inf = AWARD_INFO[rank];
    ctx.fillStyle = inf.ring; ctx.beginPath(); ctx.arc(cx, cy, 6.5*s, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = inf.color; ctx.beginPath(); ctx.arc(cx, cy, 5*s, 0, Math.PI*2); ctx.fill();
    // fish hook shape inside
    ctx.strokeStyle = inf.ring; ctx.lineWidth = Math.max(1, s);
    ctx.beginPath();
    ctx.moveTo(cx, cy-3*s);
    ctx.lineTo(cx, cy+1.5*s);
    ctx.arc(cx-1.5*s, cy+1.5*s, 1.5*s, 0, Math.PI); // hook curve
    ctx.stroke();
    // barb + eyelet
    ctx.fillStyle = inf.ring; ctx.fillRect(cx-3.5*s, cy+1.5*s, 1*s, 1*s);
    ctx.fillRect(cx-0.5*s, cy-4*s, 1*s, 1*s);
  }

  // Rough wooden plank background across a rectangle
  function drawWoodPanel(x, y, w, h) {
    ctx.fillStyle = "#6a4a2a"; ctx.fillRect(x, y, w, h);
    // horizontal planks
    const plankH = 12;
    for (let py = y; py < y+h; py += plankH) {
      ctx.fillStyle = ((py/plankH)|0)%2 ? "#664628" : "#6e4e2c";
      ctx.fillRect(x, py, w, plankH-1);
      // plank gap
      ctx.fillStyle = "#3f2c16"; ctx.fillRect(x, py+plankH-1, w, 1);
      // wood grain streaks
      ctx.fillStyle = "rgba(90,60,30,0.5)";
      for (let gx = x + ((py*7)%9); gx < x+w; gx += 22) ctx.fillRect(gx, py+3, 10, 1);
      // a couple of nails
      ctx.fillStyle = "#3a2a1a"; ctx.fillRect(x+4, py+4, 1, 1); ctx.fillRect(x+w-6, py+4, 1, 1);
    }
  }

  // A postage-stamp of a location: mini preview + perforated border + 3 mini medals
  function drawStamp(key, x, y, w, h, selected) {
    const isUnlocked = !!unlocked[key];
    // perforated white border (stamp look)
    ctx.fillStyle = selected ? "#fff6d0" : "#f0ece0";
    ctx.fillRect(x-2, y-2, w+4, h+4);
    // perforations
    ctx.fillStyle = "#6a4a2a";
    for (let px2 = x-2; px2 < x+w+2; px2 += 4) { ctx.fillRect(px2, y-3, 2, 2); ctx.fillRect(px2, y+h+1, 2, 2); }
    for (let py2 = y-2; py2 < y+h+2; py2 += 4) { ctx.fillRect(x-3, py2, 2, 2); ctx.fillRect(x+w+1, py2, 2, 2); }
    // image
    ctx.save();
    ctx.beginPath(); ctx.rect(x, y, w, h); ctx.clip();
    if (isUnlocked) {
      drawLocationPreview(key, x, y, w, h);
    } else {
      ctx.fillStyle = "#3a3f46"; ctx.fillRect(x, y, w, h);
      // lock icon
      const lx = x+w/2, ly = y+h/2;
      ctx.fillStyle = "#8a8f98"; ctx.fillRect(lx-2, ly-1, 4, 4);
      ctx.strokeStyle = "#8a8f98"; ctx.lineWidth = 1; ctx.beginPath(); ctx.arc(lx, ly-1, 1.5, Math.PI, 0); ctx.stroke();
    }
    ctx.restore();
    // border highlight if selected
    ctx.strokeStyle = selected ? "#ffe14d" : "#5a3a1a";
    ctx.lineWidth = 1; ctx.strokeRect(x+0.5, y+0.5, w-1, h-1);
    // 3 mini medals along the bottom of the stamp
    if (isUnlocked) {
      const award = locationAward(key);
      [1,2,3].forEach((rank,i)=>{
        drawHookMedal(x + 5 + i*7, y + h - 3, 0.5, award >= rank ? rank : 0);
      });
    }
  }

  // Pick a fish: roll tier using the EQUIPPED BAIT's weight table, then a species.
  function pickFish() {
    const loc = LOCATIONS[currentLocation];
    const w = BAITS[equippedBait].weights;
    const roll = Math.random();
    let tier, acc = 0;
    for (let i = 0; i < 4; i++) {
      acc += w[i];
      if (roll < acc) { tier = i + 1; break; }
    }
    if (!tier) tier = 4;   // safety for rounding
    const pool = loc.fish[tier];
    const species = pool[Math.floor(Math.random() * pool.length)];
    // random size 0.7..1.3 affects value
    const size = 0.7 + Math.random() * 0.6;
    const value = Math.round(TIERS[tier].valueBase * size);
    return { tier, name: species.name, species, size, value,
             tierScale: TIERS[tier].sizeScale,
             color: species.color, fin: species.fin };
  }

  // Consume one bait per cast (called when the hook is launched).
  // If a consumable bait runs out, fall back to Verme automatically.
  function consumeBaitForCast() {
    const b = BAITS[equippedBait];
    if (!b || !b.consumable) return;   // Verme = permanente, non si consuma
    if (baitStock[equippedBait] > 0) {
      baitStock[equippedBait]--;
      if (baitStock[equippedBait] <= 0) equippedBait = "verme";
    } else {
      equippedBait = "verme";
    }
  }

  // ---------- SAVE / LOAD (localStorage) ----------
  const SAVE_KEY = "crudoFishing.save.v1";

  function saveGame() {
    try {
      const data = {
        coins,
        aquarium,
        baitStock,
        equippedBait,
        caught,
        currentLocation,
        avatar,
        unlocked,
        awardsSeen,
        unlockNotified,
        lang
      };
      localStorage.setItem(SAVE_KEY, JSON.stringify(data));
      return true;
    } catch (e) { return false; }
  }

  function hasSave() {
    try { return !!localStorage.getItem(SAVE_KEY); } catch(e){ return false; }
  }

  function loadGame() {
    try {
      const raw = localStorage.getItem(SAVE_KEY);
      if (!raw) return false;
      const d = JSON.parse(raw);
      coins = d.coins || 0;
      // replace array/object contents in place (they are const references)
      aquarium.length = 0;
      (d.aquarium || []).forEach(f => aquarium.push(f));
      Object.keys(baitStock).forEach(k => delete baitStock[k]);
      Object.assign(baitStock, d.baitStock || {});
      Object.keys(caught).forEach(k => delete caught[k]);
      Object.assign(caught, d.caught || {});
      equippedBait = d.equippedBait || "verme";
      currentLocation = d.currentLocation || "napoli";
      if (d.avatar) Object.assign(avatar, d.avatar);
      Object.keys(unlocked).forEach(k => { if (k !== "napoli") delete unlocked[k]; });
      if (d.unlocked) Object.assign(unlocked, d.unlocked);
      unlocked.napoli = true;
      Object.keys(awardsSeen).forEach(k => delete awardsSeen[k]);
      if (d.awardsSeen) Object.assign(awardsSeen, d.awardsSeen);
      Object.keys(unlockNotified).forEach(k => delete unlockNotified[k]);
      if (d.unlockNotified) Object.assign(unlockNotified, d.unlockNotified);
      if (d.lang) lang = d.lang;
      return true;
    } catch (e) { return false; }
  }

  // Wipe all progress and overwrite the save with a fresh game
  function resetProgress() {
    coins = 0;
    aquarium.length = 0;
    Object.keys(baitStock).forEach(k => delete baitStock[k]);
    baitStock.fondo = 5; baitStock.viva = 3;   // starter stock
    Object.keys(caught).forEach(k => delete caught[k]);
    equippedBait = "verme";
    currentLocation = "napoli";

  // Show a narrative screen with the given lines; call `after` when dismissed.
  function showStory(title, lines, after) {
    storyTitle = title;
    // word-wrap the paragraphs to fit the parchment panel width
    const maxChars = 26;   // chars per line that fit the panel at 8px monospace
    const wrapped = [];
    lines.forEach(para => {
      if (para === "") { wrapped.push(""); return; }
      let cur = "";
      para.split(" ").forEach(word => {
        if ((cur + (cur?" ":"") + word).length > maxChars) {
          if (cur) wrapped.push(cur);
          cur = word;
        } else {
          cur = cur ? cur + " " + word : word;
        }
      });
      if (cur) wrapped.push(cur);
    });
    storyLines = wrapped;
    storyAfter = after || null;
    storyReveal = 0;
    screen = "story";
    blockAUntilRelease = true;
  }
  function updateStory() {
    const total = storyLines.join("\n").length;
    if (consumePress("a") || consumePress("b") || consumePress("start")) {
      if (storyReveal < total) { storyReveal = total; }
      else {
        const cb = storyAfter; storyAfter = null;
        blockAUntilRelease = true;
        if (cb) cb(); else { screen = "game"; }
      }
    } else {
      storyReveal = Math.min(total, storyReveal + 1.2);
    }
  }
  function drawStory() {
    drawWoodPanel(0, 0, W, H);
    const px = 10, py = 14, pw = W-20, ph = H-28;
    ctx.fillStyle = "#f4ecd0"; ctx.fillRect(px, py, pw, ph);
    ctx.strokeStyle = "#5a3a1a"; ctx.lineWidth = 2; ctx.strokeRect(px+1, py+1, pw-2, ph-2);
    if (storyTitle) { text(storyTitle, px+6, py+5, "#8a2c2c"); }
    // typewriter reveal across the wrapped lines
    let shown = Math.floor(storyReveal);
    let y = py + 20;
    for (let i = 0; i < storyLines.length; i++) {
      const line = storyLines[i];
      if (shown <= 0 && line.length) break;
      const part = line.slice(0, Math.max(0, shown));
      text(part, px+8, y, "#3a2a1a");
      shown -= line.length + 1;
      y += 10;
    }
    if (Math.floor(frame/20)%2===0) { ctx.textAlign="center"; text("\u25B6 " + (lang==="en"?"PRESS B":"PREMI B"), W/2, H-11, "#8a2c2c"); ctx.textAlign="left"; }
  }

  function cycleAvatar(row, delta) {
    const wrap = (v, n) => (v + delta + n) % n;
    switch (row) {
      case 1: avatar.skin  = wrap(avatar.skin,  AV.skin.length);  break;
      case 2: avatar.hair  = wrap(avatar.hair,  AV.hair.length);  break;
      case 3: avatar.beard = wrap(avatar.beard, 2);               break; // 0/1
      case 4: avatar.hat   = wrap(avatar.hat,   AV.hat.length);   break;
      case 5: avatar.shirt = wrap(avatar.shirt, AV.shirt.length); break;
      case 6: avatar.pants = wrap(avatar.pants, AV.pants.length); break;
    }
  }

  function updateCreator() {
    const attrRows = CREATOR_ROWS.length; // includes CONFERMA
    if (creatorZone === 0) {
      // ----- top: attributes -----
      if (consumePress("up")) {
        if (creatorRow === 0) { creatorZone = 1; }   // wrap up into board
        else { creatorRow--; SFX.up(); }
      }
      if (consumePress("down")) {
        if (creatorRow === attrRows - 1) { creatorZone = 1; creatorRow = 0; } // into board
        else { creatorRow++; SFX.down(); }
      }
      if (consumePress("left"))  { cycleAvatar(creatorRow, -1); SFX.left(); }
      if (consumePress("right")) { cycleAvatar(creatorRow, +1); SFX.right(); }
      if (consumePress("b")) {
        if (creatorRow === 0) {
          const nm = window.prompt("Nome del pescatore:", avatar.name);
          if (nm !== null) { avatar.name = (nm.trim().slice(0,12) || "PESCATORE").toUpperCase(); }
        } else if (creatorRow === attrRows - 1) {
          SFX.start(); saveGame();
          if (creatorToMap) {
            // new game: show the intro story, then go to the map
            showStory(lang==="en"?"PROLOGUE":"PROLOGO", storyPack().intro, () => { screen = "map"; mapIndex = 0; });
          } else if (fromTown) { fromTown = false; openTown(); }
          else { screen = "game"; }
          blockAUntilRelease = true;
        } else { cycleAvatar(creatorRow, +1); }
      }
    } else {
      // ----- bottom: stamp board -----
      const list = locationList(), n = list.length, cols = 5;
      if (consumePress("left"))  { stampIndex = (stampIndex - 1 + n) % n; SFX.left(); }
      if (consumePress("right")) { stampIndex = (stampIndex + 1) % n; SFX.right(); }
      if (consumePress("up"))    { if (stampIndex < cols) { creatorZone = 0; creatorRow = attrRows-1; } else { stampIndex -= cols; SFX.up(); } }
      if (consumePress("down"))  { if (stampIndex + cols < n) { stampIndex += cols; SFX.down(); } else { creatorZone = 0; creatorRow = 0; } }
      if (consumePress("b")) {
        const key = list[stampIndex];
        if (unlocked[key]) { SFX.start(); saveGame(); currentLocation = key; resetCast(); screen = "game"; blockAUntilRelease = true; }
      }
    }
    // A: back / confirm-exit
    if (consumePress("a")) {
      SFX.b(); saveGame();
      if (creatorToMap) { screen = "title"; titleIndex = 0; }
      else if (fromTown) { fromTown = false; openTown(); }
      else { screen = "game"; }
      blockAUntilRelease = true;
    }
  }

    safeHi: 0.65,      // safe zone upper bound
    safeCenter: 0.5,   // moving center of the safe zone
    safeHalf: 0.25,    // half-width of the safe zone (can shrink in frenzy)
    safeHalfBase: 0.25,// base half-width to restore to
    catchProg: 0,      // 0..1 how close the fish is to the dock
    stamina: 1,        // 1..0 fish energy; at 0 it's caught

    pullTarget: 0.5,   // target pull the fish is easing toward
    pullTimer: 0,      // countdown to next pull change
    tired: false,      // becomes true as stamina drops (fish pulls less)
    outTimer: 0,       // time spent outside the safe zone (grace before losing)
    // pattern/AI
    pattern: 1,        // tier behaviour 1..4
    zoneTimer: 0,      // timer for zone movement events
    zoneTarget: 0.5,   // where the zone center is easing toward
    zoneDir: 1,        // oscillation direction

    fish: null         // the fish object being fought

  function startFight(fish) {
    fight.fish = fish;
    fight.pattern = fish ? TIERS[fish.tier].pattern : 1;
    fight.tension = 0.5;
    fight.safeCenter = 0.5;
    // safe-zone width by tier: easier tiers are wider
    fight.safeHalfBase = fight.pattern === 1 ? 0.26
                       : fight.pattern === 2 ? 0.20
                       : fight.pattern === 3 ? 0.16
                       : 0.14;
    fight.safeHalf = fight.safeHalfBase;
    fight.catchProg = 0;
    fight.stamina = 1;
    fight.pull = 0.5;
    fight.pullTarget = 0.5;
    fight.pullTimer = 0.6 + Math.random() * 0.8;
    fight.tired = false;
    fight.outTimer = 0;
    fight.zoneTimer = 0;
    fight.zoneTarget = 0.5;
    fight.zoneDir = Math.random() < 0.5 ? 1 : -1;
    fight.frenzyTimer = 1.2;
    fight.slipPenalized = false;
    updateSafeBounds();
  }

  function updateSafeBounds() {
    fight.safeLo = Math.max(0, fight.safeCenter - fight.safeHalf);
    fight.safeHi = Math.min(1, fight.safeCenter + fight.safeHalf);
  }

      if (consumePress("select")) { if (aquarium.length > 0) aqConfirmEmpty = true; return; }
      if (aqPointer && aquarium.length > 0) {
        if (consumePress("left") || consumePress("up"))    aqIndex = (aqIndex - 1 + aquarium.length) % aquarium.length;
        if (consumePress("right")|| consumePress("down"))  aqIndex = (aqIndex + 1) % aquarium.length;
        // START = rilascia il pesce selezionato (uno ad uno)
        if (consumePress("start")) {
          aquarium.splice(aqIndex, 1);
          if (aqIndex >= aquarium.length) aqIndex = Math.max(0, aquarium.length - 1);
          if (aquarium.length === 0) aqPointer = false;
          saveGame();
        }
      } else {
        consumePress("up"); consumePress("down"); consumePress("left"); consumePress("right"); consumePress("start");
      }
      return;
    }

    // Inventory sub-view: navigate baits, B = equip, A = back
    if (inventoryOpen) {
      const list = baitList();
      if (consumePress("up"))   invIndex = (invIndex - 1 + list.length) % list.length;
      if (consumePress("down")) invIndex = (invIndex + 1) % list.length;
      if (consumePress("a")) { inventoryOpen = false; blockAUntilRelease = true; return; }
      if (consumePress("b")) {
        const key = list[invIndex];
        // can only equip a consumable if you have stock; Verme always available
        if (key === "verme" || (baitStock[key] || 0) > 0) {
          equippedBait = key;
          menuMsg = t("equipped") + " " + baitName(key);
        } else {
          menuMsg = t("empty_bait");
        }
      }
      return;
    }

    // Collection (Fishdex): 4-direction navigation across tier rows
    if (collectionOpen) {
      if (consumePress("a")) { collectionOpen = false; blockAUntilRelease = true; return; }
      if (consumePress("b") || consumePress("select")) { collectionOpen = false; return; }
      const rows = collectionRows();               // [{tier, list:[species...]}, ...]
      if (consumePress("left"))  collCol = Math.max(0, collCol - 1);
      if (consumePress("right")) {
        const maxc = rows[collRow].list.length - 1;
        collCol = Math.min(maxc, collCol + 1);
      }
      if (consumePress("up"))   collRow = Math.max(0, collRow - 1);
      if (consumePress("down")) collRow = Math.min(rows.length - 1, collRow + 1);
      // clamp column to the new row's length
      collCol = Math.min(collCol, rows[collRow].list.length - 1);
      return;
    }

    // Shop: navigate baits, B = buy (if enough coins), A = back
    if (shopOpen) {
      const list = shopList();
      if (consumePress("up"))   shopIndex = (shopIndex - 1 + list.length) % list.length;
      if (consumePress("down")) shopIndex = (shopIndex + 1) % list.length;
      if (consumePress("a")) { if (fromTown) { closeMenu(); } else { shopOpen = false; } blockAUntilRelease = true; return; }
      if (consumePress("b")) {
        const key = list[shopIndex];
        const price = BAITS[key].cost;
        if (coins >= price) {
          coins -= price;
          baitStock[key] = (baitStock[key] || 0) + 1;
          SFX.coin();
          menuMsg = t("bought") + " " + baitName(key);
        } else {
          menuMsg = t("no_coins");
        }
      }
      return;
    }

    // Zone select: choose the fishing location
    if (zoneOpen) {
      const list = locationList();
      if (consumePress("up"))   zoneIndex = (zoneIndex - 1 + list.length) % list.length;
      if (consumePress("down")) zoneIndex = (zoneIndex + 1) % list.length;
      if (consumePress("a")) { zoneOpen = false; blockAUntilRelease = true; return; }
      if (consumePress("b")) {
        currentLocation = list[zoneIndex];
        saveGame();
        menuMsg = "Zona: " + LOCATIONS[currentLocation].name;
        zoneOpen = false;
        return;
      }
      return;
    }

    if (consumePress("up"))   menuIndex = (menuIndex - 1 + paused.items.length) % paused.items.length;
    if (consumePress("down")) menuIndex = (menuIndex + 1) % paused.items.length;

    if (consumePress("a")) { closeMenu(); blockAUntilRelease = true; return; }   // A = indietro / chiudi
    if (consumePress("start") || consumePress("select")) { closeMenu(); return; }

    if (consumePress("b")) {                                  // B = OK / conferma
      const choice = paused.items[menuIndex];
      if (choice === "Riprendi") { closeMenu(); return; }
      if (choice === "Acquario") { aquariumOpen = true; aqIndex = 0; aqPointer = false; aqConfirmEmpty = false; return; }
      if (choice === "Inventario") { inventoryOpen = true; invIndex = baitList().indexOf(equippedBait); menuMsg=""; return; }
      if (choice === "Collezione") { collectionOpen = true; collRow = 0; collCol = 0; collScroll = 0; menuMsg=""; return; }
      if (choice === "Negozio") { shopOpen = true; shopIndex = 0; menuMsg=""; return; }
      if (choice === "Cambia zona") { closeMenu(); screen = "map"; mapIndex = locationList().indexOf(currentLocation); blockAUntilRelease = true; return; }
      if (choice === "Capanna") { closeMenu(); openCreator(false); return; }
      if (choice === "Citta") { closeMenu(); openTown(); return; }
      if (choice === "Musica") { musicEnabled = !musicEnabled; if (musicEnabled) SFX.startMusic("shanty"); else SFX.stopMusic(); menuMsg = "Musica: " + (musicEnabled?"ON":"OFF"); return; }
      if (choice === "Esci al menu") {
        saveGame();
        closeMenu();
        screen = "title";
        titleIndex = 0;
        blockAUntilRelease = true;
        return;
      }
      // Placeholder actions — verranno collegati nelle fasi successive
      menuMsg = choice + " (presto!)";
    }
  }

  // ---------- UPDATE ----------
  function update(dt) {
    // Clear the A latch once the button is physically released
    if (blockAUntilRelease && !keys.a) blockAUntilRelease = false;

    // Pick the music track by context (only if music is enabled & playing)
    if (musicEnabled && SFX.musicPlaying()) {
      const wanted = (screen === "game" && !paused) ? "fishing" : "shanty";
      if (SFX.currentTrack() !== wanted) SFX.setTrack(wanted);
    }

    // ----- TITLE SCREEN -----
    if (screen === "title") {
      SFX.unlock();
      if (!SFX.musicPlaying() && musicEnabled) SFX.startMusic("shanty");
      const canContinue = hasSave();

      // confirmation dialog for New Game overwrite
      if (titleConfirmNew) {
        if (consumePress("b")) {
          // wipe progress and start fresh, then choose language -> creator
          resetProgress();
          titleConfirmNew = false;
          SFX.start();
          openLangSelect();
        } else if (consumePress("a")) {
          titleConfirmNew = false;
        }
        return;
      }

      // menu navigation (Continua / Nuova partita)
      const opts = canContinue ? 2 : 1;
      if (consumePress("up"))   { titleIndex = (titleIndex - 1 + opts) % opts; SFX.up(); }
      if (consumePress("down")) { titleIndex = (titleIndex + 1) % opts; SFX.down(); }

      if (consumePress("start") || consumePress("a") || consumePress("b")) {
        // if no save, only option is New Game
        const choice = canContinue ? titleIndex : 1;  // 0=continue, 1=new
        if (choice === 0) {
          SFX.start();
          screen = "map";
          mapIndex = locationList().indexOf(currentLocation);
          if (mapIndex < 0) mapIndex = 0;
        } else {
          if (canContinue) { titleConfirmNew = true; }   // ask before overwriting
          else { resetProgress(); SFX.start(); openLangSelect(); }
        }
      }
      return;
    }

    // ----- LANGUAGE SELECT -----
    if (screen === "lang") { updateLangSelect(); return; }

    // ----- CHARACTER CREATOR -----
    if (screen === "creator") { updateCreator(); return; }

    // ----- STORY / NARRATIVE -----
    if (screen === "story") { updateStory(); return; }

    // ----- TOWN / HUB -----
    if (screen === "town") { updateTown(dt); return; }

    // ----- WORLD MAP -----
    if (screen === "map") {
      const list = locationList();
      const cols = 2;
      const n = list.length;
      // free movement with wrap around the grid
      if (consumePress("left"))  { mapIndex = (mapIndex - 1 + n) % n; mapMsg=""; SFX.left(); }
      if (consumePress("right")) { mapIndex = (mapIndex + 1) % n; mapMsg=""; SFX.right(); }
      if (consumePress("up"))    { mapIndex = (mapIndex - cols + n) % n; mapMsg=""; SFX.up(); }
      if (consumePress("down"))  { mapIndex = (mapIndex + cols) % n; mapMsg=""; SFX.down(); }
      if (consumePress("b") || consumePress("a")) {
        const key = list[mapIndex];
        if (unlocked[key]) {
          // already unlocked -> travel there (enter the town hub)
          mapMsg = "";
          currentLocation = key;
          saveGame();
          openTown();
          SFX.start();
        } else if (mapPurchasable(key)) {
          // requirements met -> buy the ticket to unlock
          const price = ticketPriceFor(key);
          if (coins >= price) {
            coins -= price;
            unlocked[key] = true;
            SFX.coin(); SFX.win();
            saveGame();
            // narrative arrival note (then it stays on the map)
            if (storyPack().arrive[key]) {
              const lines = [ storyPack().arrive[key] ];
              showStory(t("new_dest"), lines, () => { screen = "map"; mapMsg=""; });
            } else {
              mapMsg = t("unlocked_ok");
            }
          } else {
            mapMsg = t("need_coins") + " " + price + "!";
          }
        } else {
          mapMsg = t("locked") + ": " + t("complete_prev");
        }
      }
      return;
    }

    // ----- GAME -----
    // If a menu is open, only the menu updates
    if (paused) { updateMenu(); return; }

    // Open pause menus (available during normal play, not mid-flight)
    if (consumePress("start"))  { openMenu("START");  return; }
    if (consumePress("select")) { openMenu("SELECT"); return; }

    if (state === STATE.AIM) {
      // Move horizontal aim left/right across the water
      if (keys.left)  aimX -= 70 * dt;
      if (keys.right) aimX += 70 * dt;
      aimX = Math.max(12, Math.min(W-12, aimX));

      if (keys.a && !blockAUntilRelease) { state = STATE.CASTING; castPower = 0; }
    }
    else if (state === STATE.CASTING) {
      // Hold A to charge power (dose the force), release to launch
      if (keys.a) {
        castPower += 0.8 * dt;
        if (castPower > MAX_POWER) castPower = MAX_POWER;
      } else {
        launchHook();
      }
    }
    else if (state === STATE.FLYING) {
      hook.t += dt * 1.8;
      const t = Math.min(hook.t, 1);
      hook.x = hook.sx + (hook.tx - hook.sx) * t;
      const arc = Math.sin(t * Math.PI) * hook.arcH;
      hook.y = hook.sy + (hook.ty - hook.sy) * t - arc;
      if (hook.t >= 1) {
        hook.x = hook.tx; hook.y = hook.ty;
        hook.inWater = true;
        state = STATE.WAITING;
        waitTimer = 0;
        reelProgress = 0;
        // random time before a fish comes (2s .. 6s)
        timeToBite = 2 + Math.random() * 4;
      }
    }
    else if (state === STATE.WAITING) {
      waitTimer += dt;

      // Hold B to reel the hook back in (reel-in). Release stops reeling.
      if (keys.b) {
        reelProgress += 0.55 * dt;   // ~1.8s of holding to fully reel in
        const p = Math.min(reelProgress, 1);
        hook.x = hook.tx + (rodTip.x - hook.tx) * p;
        hook.y = hook.ty + (rodTip.y - hook.ty) * p;
        if (reelProgress >= 1) resetCast();
      } else {
        // if not reeling, a fish may bite after the random delay
        if (reelProgress > 0) reelProgress = 0; // reset partial reel when released
        if (waitTimer >= timeToBite) {
          state = STATE.BITE;
          biteTimer = 0;
          consumePress("b"); // ignore any stale B press
          SFX.alarm();                    // allarme abboccata
          SFX.vibrate([80, 40, 80]);      // buzz-buzz
        }
      }
    }
    else if (state === STATE.BITE) {
      biteTimer += dt;
      // Tap B (strattone) during the window to hook the fish
      if (consumePress("b")) {
        SFX.bite();
        startFight(pickFish());
        state = STATE.FIGHT;
      } else if (biteTimer >= BITE_WINDOW) {
        // too slow — fish got away
        loseFish("TROPPO TARDI");
      }
    }
    else if (state === STATE.FIGHT) {
      updateFight(dt);
    }
    else if (state === STATE.HOOKED) {
      resultTimer += dt;
      // Scena "pesce preso": canna verticale con pesce. Dura RESULT_DURATION.
      if (resultTimer > RESULT_DURATION) {
        landedFish = null;
        if (storyPending === "finale") {
          storyPending = null;
          resetCast();
          showStory(lang==="en"?"EPILOGUE":"EPILOGO", storyPack().finale, () => { screen = "game"; });
        } else {
          resetCast();
        }
      }
    }
    else if (state === STATE.LOST) {
      resultTimer += dt;
      // Anima il pesciolino che nuota verso l'orizzonte
      if (escaper.active) {
        escaper.x += (W/2 - escaper.x) * 0.6 * dt;   // drift toward center
        escaper.y -= (escaper.y - (HORIZON + 4)) * 1.2 * dt; // rise toward horizon
        if (escaper.y <= HORIZON + 5) escaper.active = false;
      }
      if (resultTimer > RESULT_DURATION) { escaper.active = false; resetCast(); }
    }

    // Prevent A press from leaking across non-aim states
    if (state !== STATE.AIM && state !== STATE.CASTING) consumePress("a");
  }

  // Map a target distance (0=near dock, 1=far horizon) to a screen Y using perspective
  function distToY(d) {
    // d in [0,1] -> y from just below dock area to just above horizon
    const near = DOCK_TOP - 6;
    const far  = HORIZON + 6;
    return near + (far - near) * d;
  }
  // Horizontal position converges toward center as it goes far (perspective)
  function aimToScreenX(px, d) {
    return px + (W/2 - px) * d * 0.55;
  }

  function launchHook() {
    const d = 0.15 + castPower * 0.8;      // distance fraction toward horizon
    hook.sx = rodTip.x; hook.sy = rodTip.y;
    hook.ty = distToY(d);
    hook.tx = aimToScreenX(aimX, d);
    hook.arcH = 14 + castPower * 20;
    hook.t = 0;
    hook.flying = true;
    hook.inWater = false;
    consumeBaitForCast();   // 1 esca per lancio
    SFX.cast();
    state = STATE.FLYING;
  }

  function resetCast() {
    state = STATE.AIM;
    hook.x = rodTip.x; hook.y = rodTip.y;
    hook.inWater = false; hook.flying = false;
    castPower = 0;
  }
