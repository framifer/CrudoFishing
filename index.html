    });

    if (menuMsg) text(menuMsg, px + 6, py + ph + 2, "#2e6a2c");
    textBox("B=VAI  A=INDIETRO", 6, 130);
  }

  // ---------- TITLE SCREEN ----------
  function drawTitle() {
    // ---- nautical-chart background ----
    const g = ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0, "#4f8aa8"); g.addColorStop(1, "#2f6280");
    ctx.fillStyle = g; ctx.fillRect(0,0,W,H);
    // faint chart grid
    ctx.strokeStyle = "rgba(230,240,235,0.12)"; ctx.lineWidth = 1;
    for (let x = 12; x < W; x += 16) { ctx.beginPath(); ctx.moveTo(x+0.5, 0); ctx.lineTo(x+0.5, H); ctx.stroke(); }
    for (let y = 12; y < H; y += 16) { ctx.beginPath(); ctx.moveTo(0, y+0.5); ctx.lineTo(W, y+0.5); ctx.stroke(); }

    // sun with warm glow (top)
    ctx.fillStyle = "rgba(255,224,138,0.35)"; ctx.beginPath(); ctx.arc(W/2, 40, 24, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = "#ffe08a"; ctx.beginPath(); ctx.arc(W/2, 40, 15, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = "#fff3c0"; ctx.beginPath(); ctx.arc(W/2, 40, 9, 0, Math.PI*2); ctx.fill();

    // stylized wave glyphs scattered on the chart
    ctx.strokeStyle = "rgba(230,240,235,0.22)"; ctx.lineWidth = 1;
    const waves = [[22,66],[120,60],[34,110],[130,112],[70,124],[100,80],[18,88]];
    waves.forEach(([wx,wy], i) => {
      if ((i + Math.floor(frame/40)) % 3 !== 0) {
        ctx.beginPath();
        ctx.moveTo(wx, wy);
        ctx.quadraticCurveTo(wx+3, wy-3, wx+6, wy);
        ctx.quadraticCurveTo(wx+9, wy+3, wx+12, wy);
        ctx.stroke();
      }
    });

    // compass rose (bottom-left)
    (function(){
      const cx=22, cy=118;
      ctx.strokeStyle="rgba(244,236,208,0.8)"; ctx.lineWidth=1;
      ctx.beginPath(); ctx.arc(cx,cy,9,0,Math.PI*2); ctx.stroke();
      ctx.beginPath(); ctx.arc(cx,cy,5,0,Math.PI*2); ctx.stroke();
      ctx.fillStyle="#e0402a"; ctx.beginPath();
      ctx.moveTo(cx,cy-9); ctx.lineTo(cx+2,cy); ctx.lineTo(cx,cy+9); ctx.lineTo(cx-2,cy); ctx.closePath(); ctx.fill();
      ctx.fillStyle="#f4ecd0"; ctx.beginPath();
      ctx.moveTo(cx-9,cy); ctx.lineTo(cx,cy+2); ctx.lineTo(cx+9,cy); ctx.lineTo(cx,cy-2); ctx.closePath(); ctx.fill();
      text("N", cx-2, cy-18, "#f4ecd0");
    })();

    // anchor decoration (top-left)
    (function(){
      const x=16, y=22;
      ctx.strokeStyle="#f4ecd0"; ctx.fillStyle="#f4ecd0"; ctx.lineWidth=2;
      // ring
      ctx.beginPath(); ctx.arc(x, y-6, 2.5, 0, Math.PI*2); ctx.stroke();
      // shank
      ctx.beginPath(); ctx.moveTo(x, y-4); ctx.lineTo(x, y+6); ctx.stroke();
      // stock (cross bar)
      ctx.beginPath(); ctx.moveTo(x-4, y-1); ctx.lineTo(x+4, y-1); ctx.stroke();
      // arms / flukes
      ctx.beginPath();
      ctx.moveTo(x, y+6); ctx.quadraticCurveTo(x-6, y+5, x-6, y+1);
      ctx.moveTo(x, y+6); ctx.quadraticCurveTo(x+6, y+5, x+6, y+1);
      ctx.stroke();
      // fluke tips
      ctx.fillRect(x-7, y-1, 2, 2); ctx.fillRect(x+5, y-1, 2, 2);
      ctx.lineWidth = 1;
    })();

    // title text
    ctx.font = "bold 18px monospace"; ctx.textBaseline = "top"; ctx.textAlign = "center";
    ctx.fillStyle = "#0f2a1a"; ctx.fillText("CRUDO", W/2+1, 24);
    ctx.fillStyle = "#ffffff"; ctx.fillText("CRUDO", W/2, 23);
    ctx.font = "bold 12px monospace";
    ctx.fillStyle = "#0f2a1a"; ctx.fillText("FISHING", W/2+1, 44);
    ctx.fillStyle = "#ffe14d"; ctx.fillText("FISHING", W/2, 43);
    ctx.textAlign = "left"; ctx.font = "8px monospace";

    // menu: Continua / Nuova partita
    const canContinue = hasSave();
    ctx.textAlign = "center";
    if (canContinue) {
      const items = [t("continue"), t("new_game")];
      items.forEach((it, i) => {
        const yy = 108 + i*14;
        if (i === titleIndex) {
          ctx.fillStyle = "#ffe14d"; ctx.fillText("\u25B6 " + it, W/2, yy);
        } else {
          ctx.fillStyle = "#ffffff"; ctx.fillText(it, W/2, yy);
        }
      });
    } else {
      if (Math.floor(frame/20) % 2 === 0) { ctx.fillStyle = "#ffffff"; ctx.fillText(t("press_start"), W/2, 116); }
    }
    ctx.textAlign = "left";

    // overwrite confirmation dialog
    if (titleConfirmNew) {
      ctx.fillStyle = "rgba(15,30,40,0.8)"; ctx.fillRect(0,0,W,H);
      const dw = 132, dh = 46, dx = (W-dw)/2, dy = 48;
      ctx.fillStyle = PAL.textBg; ctx.fillRect(dx, dy, dw, dh);
      ctx.strokeStyle = PAL.dark; ctx.lineWidth = 1; ctx.strokeRect(dx+0.5, dy+0.5, dw-1, dh-1);
      ctx.textAlign = "center";
      text(t("new_game_q"), W/2, dy+6, "#8a2c2c");
      text(t("overwrite"), W/2, dy+18, PAL.text);
      text(t("the_save"), W/2, dy+27, PAL.text);
      ctx.textAlign = "left";
      text("B = " + t("yes"), dx+10, dy+36, "#2e6a2c");
      text("A = " + t("no"), dx+dw-40, dy+36, "#8a2c2c");
    }
  }

  // ---------- WORLD MAP: NAUTICAL CHART ----------
  // ---------- TRAVEL POSTCARDS ----------
  function drawPostcards() {
    // backdrop
    const g = ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0, "#1a2a44"); g.addColorStop(1, "#0f1b2e");
    ctx.fillStyle = g; ctx.fillRect(0,0,W,H);

    // title bar
    ctx.fillStyle = PAL.dark; ctx.fillRect(0, 0, W, 12);
    text(t("choose_dest"), 4, 2, PAL.textBg);

    const list = locationList();
    const key = list[mapIndex];
    const loc = LOCATIONS[key];

    // ---- grid of postcards (2 columns), scrollable ----
    const cols = 2;
    const gap = 8, marginX = 10, topY = 14;
    const cardW = (W - marginX*2 - gap*(cols-1)) / cols;   // ~66
    const cardH = 38;
    const rowGap = 8;
    const rowStride = cardH + rowGap;
    const rows = Math.ceil(list.length / cols);

    // scroll viewport (between title bar and the bottom info bar)
    const viewTop = 13, viewBot = H - 24, viewH = viewBot - viewTop;
    const contentH = rows * rowStride;
    // follow the selected row
    const selRow = (mapIndex / cols) | 0;
    const selY = selRow * rowStride;
    let target = Math.max(0, Math.min(Math.max(0, contentH - viewH), selY - viewH/2 + cardH/2));
    if (typeof drawPostcards._scroll !== "number") drawPostcards._scroll = 0;
    drawPostcards._scroll += (target - drawPostcards._scroll) * 0.3;
    if (Math.abs(target - drawPostcards._scroll) < 0.5) drawPostcards._scroll = target;
    const scroll = drawPostcards._scroll;

    ctx.save();
    ctx.beginPath(); ctx.rect(0, viewTop, W, viewH); ctx.clip();

    list.forEach((k, i) => {
      const loc = LOCATIONS[k];
      const col = i % cols, row = (i / cols) | 0;
      const cx = marginX + col * (cardW + gap);
      const cy = viewTop + 3 + row * rowStride - scroll;
      const selected = (i === mapIndex);

      ctx.fillStyle = "#f4ecd0"; ctx.fillRect(cx-2, cy-2, cardW+4, cardH+4);
      ctx.save();
      ctx.beginPath(); ctx.rect(cx, cy, cardW, cardH); ctx.clip();
      drawLocationPreview(k, cx, cy, cardW, cardH);
      ctx.restore();
      if (selected) {
        ctx.strokeStyle = (Math.floor(frame/8)%2===0) ? "#ffe14d" : "#ffffff";
        ctx.lineWidth = 2; ctx.strokeRect(cx-2+0.5, cy-2+0.5, cardW+3, cardH+3);
      } else {
        ctx.strokeStyle = "#5a3a1a"; ctx.lineWidth = 1; ctx.strokeRect(cx+0.5, cy+0.5, cardW-1, cardH-1);
      }
      const species = [1,2,3,4].reduce((a,t)=>a.concat(loc.fish[t]),[]);
      const got = species.filter(sp => caught[k + ":" + sp.name]).length;
      ctx.fillStyle = "rgba(15,56,15,0.7)"; ctx.fillRect(cx+cardW-22, cy, 22, 8);
      text(got+"/"+species.length, cx+cardW-20, cy, "#ffffff");
      if (k === currentLocation) { ctx.fillStyle="rgba(15,56,15,0.7)"; ctx.fillRect(cx,cy,10,8); text("\u2691", cx+2, cy, "#8ad0a0"); }

      // LOCK overlay if not unlocked
      if (!unlocked[k]) {
        const buyable = mapPurchasable(k);
        ctx.fillStyle = "rgba(10,15,25,0.6)"; ctx.fillRect(cx, cy, cardW, cardH);
        // padlock icon
        const lx = cx + cardW/2, ly = cy + cardH/2;
        ctx.fillStyle = buyable ? "#ffe14d" : "#c8ccd4";
        ctx.fillRect(lx-4, ly-1, 8, 7);           // body
        ctx.strokeStyle = buyable ? "#ffe14d" : "#c8ccd4"; ctx.lineWidth = 1;
        ctx.beginPath(); ctx.arc(lx, ly-1, 3, Math.PI, 0); ctx.stroke();   // shackle
        ctx.fillStyle = "#3a2a1a"; ctx.fillRect(lx-1, ly+1, 2, 3);         // keyhole
        if (buyable) text("$"+ticketPriceFor(k), lx-8, ly+8, "#ffe14d");
      }
    });
    ctx.restore();

    // scroll arrows
    if (scroll > 1) text("\u25B2", W-10, viewTop+1, "#ffffff");
    if (scroll < contentH - viewH - 1) text("\u25BC", W-10, viewBot-9, "#ffffff");

    // fixed info bar at the bottom
    const selKey = list[mapIndex];
    const sel = LOCATIONS[selKey];
    const barH = 20, barY = H - barH - 2, bx = 6, bw = W - 12;
    ctx.fillStyle = "#f4ecd0"; ctx.fillRect(bx, barY, bw, barH);
    ctx.strokeStyle = "#5a3a1a"; ctx.lineWidth = 1; ctx.strokeRect(bx+0.5, barY+0.5, bw-1, barH-1);
    ctx.textAlign = "center";
    if (mapMsg) {
      text(locName(sel), W/2, barY + 2, "#3a2a1a");
      text(mapMsg, W/2, barY + 11, "#8a2c2c");
    } else if (unlocked[selKey]) {
      text(locName(sel) + "  \u2691", W/2, barY + 2, "#3a2a1a");
      text(seaName(sel) + "   " + t("go"), W/2, barY + 11, "#6a5a3a");
    } else if (mapPurchasable(selKey)) {
      text(locName(sel) + "  \uD83D\uDD13", W/2, barY + 2, "#2e6a2c");
      text(t("ticket") + " $" + ticketPriceFor(selKey) + "  " + t("unlock"), W/2, barY + 11, "#2e6a2c");
    } else {
      const i = LOCATION_ORDER.indexOf(selKey);
      const prev = i>0 ? LOCATION_ORDER[i-1] : null;
      text(locName(sel) + "  (" + t("locked") + ")", W/2, barY + 2, "#8a2c2c");
      if (prev) text((lang==="en"?"Finish ":"Completa ") + locName(LOCATIONS[prev]) + ": F1 3, F2 2, F3 2", W/2, barY + 11, "#8a2c2c");
    }
    ctx.textAlign = "left";
  }

  // Mini preview of a location's scenery inside a rectangle
  function drawLocationPreview(key, x, y, w, h) {
    const loc = LOCATIONS[key];
    const hz = y + Math.floor(h * 0.42);

    if (loc.background === "napoli") {
      let g = ctx.createLinearGradient(0,y,0,hz);
      g.addColorStop(0,"#8ecff2"); g.addColorStop(1,"#c9edf7");
      ctx.fillStyle = g; ctx.fillRect(x,y,w,hz-y);
      ctx.fillStyle="#fff3b0"; ctx.beginPath(); ctx.arc(x+w-16, y+10, 5,0,Math.PI*2); ctx.fill();
      ctx.fillStyle="#748895";
      ctx.beginPath();
      ctx.moveTo(x+w*0.35, hz); ctx.lineTo(x+w*0.55, hz-16);
      ctx.lineTo(x+w*0.62, hz-14); ctx.lineTo(x+w*0.72, hz-22);
      ctx.lineTo(x+w*0.92, hz-6); ctx.lineTo(x+w, hz);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle="#cbb9ad"; ctx.fillRect(x, hz-3, w, 3);
      g = ctx.createLinearGradient(0,hz,0,y+h);
      g.addColorStop(0,"#3f86d4"); g.addColorStop(1,"#2a6ec2");
      ctx.fillStyle=g; ctx.fillRect(x,hz,w,y+h-hz);
      ctx.fillStyle="#6fb3e8";
      for (let yy=hz+4; yy<y+h; yy+=6) ctx.fillRect(x, yy, w, 1);
      drawFishSprite(x+w*0.4 + Math.sin(frame*0.05)*8, y+h-16, 1.6, "#5aa0d8", "#3f7fb8", 1);

    } else if (loc.background === "lofoten") {
      let g = ctx.createLinearGradient(0,y,0,hz);
      g.addColorStop(0,"#12203f"); g.addColorStop(1,"#3a5a6a");
      ctx.fillStyle=g; ctx.fillRect(x,y,w,hz-y);
      const cols=["rgba(80,220,140,0.4)","rgba(150,120,230,0.3)"];
      cols.forEach((c,ci)=>{ ctx.fillStyle=c;
        for(let xx=x; xx<x+w; xx+=2){ const yy=y+6+ci*5+Math.sin(xx*0.1+frame*0.03+ci)*3; ctx.fillRect(xx,yy,2,5);} });
      ctx.fillStyle="#5a6f82";
      ctx.beginPath();
      ctx.moveTo(x, hz); ctx.lineTo(x+w*0.2, hz-20); ctx.lineTo(x+w*0.4, hz-8);
      ctx.lineTo(x+w*0.6, hz-22); ctx.lineTo(x+w*0.8, hz-10); ctx.lineTo(x+w, hz-18);
      ctx.lineTo(x+w, hz); ctx.closePath(); ctx.fill();
      ctx.fillStyle="#e8f0f5";
      ctx.beginPath(); ctx.moveTo(x+w*0.6,hz-22); ctx.lineTo(x+w*0.55,hz-15); ctx.lineTo(x+w*0.65,hz-15); ctx.closePath(); ctx.fill();
      g = ctx.createLinearGradient(0,hz,0,y+h);
      g.addColorStop(0,"#4a7a8a"); g.addColorStop(1,"#173a48");
      ctx.fillStyle=g; ctx.fillRect(x,hz,w,y+h-hz);
      drawRorbu(x+w*0.3, hz+8);
      drawFishSprite(x+w*0.6 + Math.sin(frame*0.05)*8, y+h-16, 1.6, "#e08a6a", "#c05a4a", -1);

    } else if (loc.background === "amazzonia") {
      // sunset jungle sky
      let g = ctx.createLinearGradient(0,y,0,hz);
      g.addColorStop(0,"#e8935a"); g.addColorStop(1,"#f2c98a");
      ctx.fillStyle=g; ctx.fillRect(x,y,w,hz-y);
      // setting sun
      ctx.fillStyle="#ffb060"; ctx.beginPath(); ctx.arc(x+w/2, hz-2, 7, 0, Math.PI*2); ctx.fill();
      // jungle wall
      ctx.fillStyle="#2e5a2e";
      for (let xx=x; xx<x+w; xx+=5){ const hh=6+((xx*7)%6); ctx.beginPath(); ctx.arc(xx+2, hz-2, hh/1.6, Math.PI, 0); ctx.fill(); }
      ctx.fillStyle="#24481f";
      for (let xx=x+4; xx<x+w; xx+=14){ ctx.fillRect(xx, hz-14, 2, 14); ctx.beginPath(); ctx.arc(xx+1, hz-14, 5, 0, Math.PI*2); ctx.fill(); }
      ctx.fillStyle="#2e5a2e"; ctx.fillRect(x, hz-2, w, 3);
      // aqua-green river
      g = ctx.createLinearGradient(0,hz,0,y+h);
      g.addColorStop(0,"#4fb8a8"); g.addColorStop(1,"#1f7a76");
      ctx.fillStyle=g; ctx.fillRect(x,hz,w,y+h-hz);
      drawFishSprite(x+w*0.5 + Math.sin(frame*0.05)*8, y+h-14, 1.6, "#c85a4a", "#8a3020", 1);

    } else if (loc.background === "reef") {
      // bright tropical sky
      let g = ctx.createLinearGradient(0,y,0,hz);
      g.addColorStop(0,"#3fb0e8"); g.addColorStop(1,"#b8ecf5");
      ctx.fillStyle=g; ctx.fillRect(x,y,w,hz-y);
      ctx.fillStyle="#fff3b0"; ctx.beginPath(); ctx.arc(x+w-12, y+8, 4,0,Math.PI*2); ctx.fill();
      // sandy atolls
      ctx.fillStyle="#f2ecd0";
      ctx.beginPath(); ctx.ellipse(x+w*0.3, hz-1, 8, 3, 0, Math.PI, 0); ctx.fill();
      ctx.beginPath(); ctx.ellipse(x+w*0.7, hz-1, 6, 2, 0, Math.PI, 0); ctx.fill();
      ctx.fillStyle="#8fd8d0"; ctx.fillRect(x, hz-2, w, 2);
      // turquoise water
      g = ctx.createLinearGradient(0,hz,0,y+h);
      g.addColorStop(0,"#7fe0e0"); g.addColorStop(1,"#1f90b0");
      ctx.fillStyle=g; ctx.fillRect(x,hz,w,y+h-hz);
      // corals under surface
      ["#e07aa0","#e0a040","#40b0a0"].forEach((c,i)=>{ ctx.fillStyle=c; ctx.globalAlpha=0.55; ctx.fillRect(x+10+i*16, hz+5+(i%2)*4, 3, 4); ctx.globalAlpha=1; });
      drawFishSprite(x+w*0.5 + Math.sin(frame*0.05)*8, y+h-14, 1.6, "#3aa0c0", "#e060a0", 1);

    } else if (loc.background === "kamchatka") {
      // cold blue-white sky
      let g = ctx.createLinearGradient(0,y,0,hz);
      g.addColorStop(0,"#7f9ec0"); g.addColorStop(1,"#d6e4ec");
      ctx.fillStyle=g; ctx.fillRect(x,y,w,hz-y);
      // volcano with smoke
      ctx.fillStyle="#454e58";
      ctx.beginPath(); ctx.moveTo(x+w*0.5, hz); ctx.lineTo(x+w*0.7, hz-18); ctx.lineTo(x+w*0.9, hz); ctx.closePath(); ctx.fill();
      ctx.fillStyle="#eaf2f5"; ctx.beginPath(); ctx.moveTo(x+w*0.7,hz-18); ctx.lineTo(x+w*0.66,hz-11); ctx.lineTo(x+w*0.74,hz-11); ctx.closePath(); ctx.fill();
      ctx.fillStyle="rgba(200,210,214,0.6)"; ctx.fillRect(x+w*0.7-1, hz-24, 3, 6);
      // snowy rocky coast
      ctx.fillStyle="#454e58"; ctx.fillRect(x, hz-2, w, 3);
      ctx.fillStyle="#eaf2f5"; ctx.fillRect(x, hz-2, w, 1);
      // cold blue sea
      g = ctx.createLinearGradient(0,hz,0,y+h);
      g.addColorStop(0,"#5a86a0"); g.addColorStop(1,"#22404f");
      ctx.fillStyle=g; ctx.fillRect(x,hz,w,y+h-hz);
      // ice floe
      ctx.fillStyle="#e4ecee"; ctx.fillRect(x+w*0.3, hz+8, 8, 3); ctx.fillRect(x+w*0.6, hz+16, 6, 3);
      // falling snow
      ctx.fillStyle="#ffffff";
      for (let i=0;i<10;i++){ const sx=x+((i*13+frame*0.3)% w); const sy=y+((i*17+frame*0.5)%h); ctx.fillRect(Math.round(sx),Math.round(sy),1,1); }
      drawFishSprite(x+w*0.5 + Math.sin(frame*0.05)*8, y+h-14, 1.6, "#8a7a5a", "#c04a4a", 1);

    } else if (loc.background === "fuji") {
      // serene dawn sky
      let g = ctx.createLinearGradient(0,y,0,hz);
      g.addColorStop(0,"#7fb0e0"); g.addColorStop(0.6,"#cfe0ee"); g.addColorStop(1,"#f6d8dc");
      ctx.fillStyle=g; ctx.fillRect(x,y,w,hz-y);
      ctx.fillStyle="#ffd9c0"; ctx.beginPath(); ctx.arc(x+w-12, y+8, 4,0,Math.PI*2); ctx.fill();
      // Mt Fuji cone (wide, concave slopes)
      const fx = x+w*0.46, fw=w*0.82, fh=hz-y-2;
      const sL = fx-5, sR = fx+5, sy = hz-fh;
      ctx.fillStyle="#8290ac";
      ctx.beginPath();
      ctx.moveTo(fx-fw/2, hz);
      ctx.quadraticCurveTo(fx-fw*0.32, hz-fh*0.55, sL, sy);
      ctx.lineTo(sR, sy);
      ctx.quadraticCurveTo(fx+fw*0.32, hz-fh*0.55, fx+fw/2, hz);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle="#f4f8fc";
      ctx.beginPath(); ctx.moveTo(sL, sy); ctx.lineTo(sR, sy); ctx.lineTo(sR+3, sy+5); ctx.lineTo(fx, sy+3); ctx.lineTo(sL-3, sy+5); ctx.closePath(); ctx.fill();
      // calm Pacific water
      g = ctx.createLinearGradient(0,hz,0,y+h);
      g.addColorStop(0,"#8fc4dc"); g.addColorStop(1,"#2a5f8a");
      ctx.fillStyle=g; ctx.fillRect(x,hz,w,y+h-hz);
      // torii
      ctx.fillStyle="#c0392b"; ctx.fillRect(x+6, hz+2, 1, 8); ctx.fillRect(x+11, hz+2, 1, 8); ctx.fillRect(x+4, hz+2, 10, 1);
      drawFishSprite(x+w*0.6 + Math.sin(frame*0.05)*8, y+h-14, 1.6, "#d85a5a", "#a83a3a", 1);

    } else if (loc.background === "bijagos") {
      // warm tropical sky
      let g = ctx.createLinearGradient(0,y,0,hz);
      g.addColorStop(0,"#5aa8d8"); g.addColorStop(0.6,"#bfe0ea"); g.addColorStop(1,"#f0e2c0");
      ctx.fillStyle=g; ctx.fillRect(x,y,w,hz-y);
      ctx.fillStyle="#fff0b0"; ctx.beginPath(); ctx.arc(x+w-12, y+8, 4,0,Math.PI*2); ctx.fill();
      // red & white sand islands
      ctx.fillStyle="#e0a878"; ctx.beginPath(); ctx.ellipse(x+w*0.3, hz-1, 9, 3, 0, Math.PI, 0); ctx.fill();
      ctx.fillStyle="#f0e6cc"; ctx.beginPath(); ctx.ellipse(x+w*0.65, hz-1, 7, 2, 0, Math.PI, 0); ctx.fill();
      // mangroves
      ctx.fillStyle="#2e5a2e";
      for (let xx=x; xx<x+w; xx+=6){ const hh=6+((xx*7)%5); ctx.beginPath(); ctx.arc(xx+2, hz-2, hh/1.6, Math.PI, 0); ctx.fill(); }
      ctx.fillStyle="#2e5a2e"; ctx.fillRect(x, hz-2, w, 3);
      // estuary water
      g = ctx.createLinearGradient(0,hz,0,y+h);
      g.addColorStop(0,"#6fd8c0"); g.addColorStop(1,"#237a72");
      ctx.fillStyle=g; ctx.fillRect(x,hz,w,y+h-hz);
      // stilt hut
      ctx.fillStyle="#a07850"; ctx.fillRect(x+8, hz+4, 6, 4);
      ctx.fillStyle="#c8a860"; ctx.beginPath(); ctx.moveTo(x+7,hz+4); ctx.lineTo(x+11,hz+1); ctx.lineTo(x+15,hz+4); ctx.closePath(); ctx.fill();
      ctx.fillStyle="#3a2a1a"; ctx.fillRect(x+9, hz+8, 1, 4); ctx.fillRect(x+13, hz+8, 1, 4);
      drawFishSprite(x+w*0.55 + Math.sin(frame*0.05)*8, y+h-14, 1.6, "#c8c060", "#9a9040", 1);

    } else if (loc.background === "patagonia") {
      // dramatic cold sky
      let g = ctx.createLinearGradient(0,y,0,hz);
      g.addColorStop(0,"#6a7f92"); g.addColorStop(0.6,"#9fb2bf"); g.addColorStop(1,"#cbd6da");
      ctx.fillStyle=g; ctx.fillRect(x,y,w,hz-y);
      // jagged snowy peaks
      ctx.fillStyle="#5a6672";
      ctx.beginPath();
      ctx.moveTo(x, hz); ctx.lineTo(x+w*0.15, hz-18); ctx.lineTo(x+w*0.3, hz-8);
      ctx.lineTo(x+w*0.5, hz-20); ctx.lineTo(x+w*0.7, hz-10); ctx.lineTo(x+w*0.85, hz-18);
      ctx.lineTo(x+w, hz-8); ctx.lineTo(x+w, hz); ctx.closePath(); ctx.fill();
      ctx.fillStyle="#eef4f6";
      ctx.beginPath(); ctx.moveTo(x+w*0.5,hz-20); ctx.lineTo(x+w*0.45,hz-13); ctx.lineTo(x+w*0.55,hz-13); ctx.closePath(); ctx.fill();
      ctx.fillStyle="#2f363c"; ctx.fillRect(x, hz-2, w, 3);
      // cold sea
      g = ctx.createLinearGradient(0,hz,0,y+h);
      g.addColorStop(0,"#6a92a0"); g.addColorStop(1,"#2a4756");
      ctx.fillStyle=g; ctx.fillRect(x,hz,w,y+h-hz);
      // lighthouse
      for (let i=0;i<3;i++){ ctx.fillStyle=(i%2===0)?"#d84030":"#f0ece0"; ctx.fillRect(x+w-14, hz-9+i*3, 4, 3); }
      ctx.fillStyle="#ffe14d"; ctx.fillRect(x+w-13, hz-11, 2, 1);
      drawFishSprite(x+w*0.5 + Math.sin(frame*0.05)*8, y+h-14, 1.6, "#9aa8b0", "#7a8890", 1);

    } else if (loc.background === "antille") {
      // bright Caribbean sky
      let g = ctx.createLinearGradient(0,y,0,hz);
      g.addColorStop(0,"#2f9ee0"); g.addColorStop(0.6,"#8fd6ee"); g.addColorStop(1,"#d8f4f2");
      ctx.fillStyle=g; ctx.fillRect(x,y,w,hz-y);
      ctx.fillStyle="#fff3b0"; ctx.beginPath(); ctx.arc(x+10, y+8, 4,0,Math.PI*2); ctx.fill();
      // white-sand atolls with bent palms
      ctx.fillStyle="#f4eed0";
      ctx.beginPath(); ctx.ellipse(x+w*0.3, hz-1, 10, 3, 0, Math.PI, 0); ctx.fill();
      ctx.beginPath(); ctx.ellipse(x+w*0.7, hz-1, 8, 2, 0, Math.PI, 0); ctx.fill();
      ctx.strokeStyle="#8a6a3a"; ctx.lineWidth=1;
      ctx.beginPath(); ctx.moveTo(x+w*0.3, hz-1); ctx.quadraticCurveTo(x+w*0.3+2, hz-7, x+w*0.3+5, hz-9); ctx.stroke();
      ctx.strokeStyle="#2e8b4a"; ctx.beginPath(); ctx.moveTo(x+w*0.3+5, hz-9); ctx.lineTo(x+w*0.3+11, hz-8); ctx.stroke();
      ctx.fillStyle="#e0d4a8"; ctx.fillRect(x, hz-2, w, 2);
      // turquoise transparent water
      g = ctx.createLinearGradient(0,hz,0,y+h);
      g.addColorStop(0,"#9ff0e8"); g.addColorStop(1,"#2fa8c8");
      ctx.fillStyle=g; ctx.fillRect(x,hz,w,y+h-hz);
      // coral patches + wreck hint
      ["#e07aa0","#e0a040","#40b0a0"].forEach((c,i)=>{ ctx.fillStyle=c; ctx.globalAlpha=0.5; ctx.fillRect(x+10+i*14, hz+5+(i%2)*4, 3, 3); ctx.globalAlpha=1; });
      ctx.fillStyle="#5a4630"; ctx.fillRect(x+w*0.7, hz+10, 10, 3);
      drawFishSprite(x+w*0.5 + Math.sin(frame*0.05)*8, y+h-14, 1.6, "#e0c050", "#e05a5a", 1);

    } else if (loc.background === "ross") {
      // pale Antarctic sky
      let g = ctx.createLinearGradient(0,y,0,hz);
      g.addColorStop(0,"#9fc0d8"); g.addColorStop(0.6,"#d0e4ee"); g.addColorStop(1,"#eef6fa");
      ctx.fillStyle=g; ctx.fillRect(x,y,w,hz-y);
      // ice shelf wall
      ctx.fillStyle="#eaf2f6"; ctx.fillRect(x, hz-10, w, 8);
      ctx.fillStyle="#a8d0e4"; ctx.fillRect(x, hz-3, w, 2);
      // black crystalline sea
      g = ctx.createLinearGradient(0,hz,0,y+h);
      g.addColorStop(0,"#2a4658"); g.addColorStop(1,"#0a1a24");
      ctx.fillStyle=g; ctx.fillRect(x,hz,w,y+h-hz);
      // cobalt iceberg
      ctx.fillStyle="#4a80c0";
      ctx.beginPath(); ctx.moveTo(x+w*0.6, hz+8); ctx.lineTo(x+w*0.68, hz); ctx.lineTo(x+w*0.78, hz+8); ctx.closePath(); ctx.fill();
      ctx.fillStyle="#cfe4f2"; ctx.beginPath(); ctx.moveTo(x+w*0.68,hz); ctx.lineTo(x+w*0.78,hz+8); ctx.lineTo(x+w*0.72,hz+8); ctx.closePath(); ctx.fill();
      // penguin
      drawPenguin(x+w*0.3, hz-1);
      drawFishSprite(x+w*0.45 + Math.sin(frame*0.05)*6, y+h-13, 1.4, "#9aa8b0", "#7a8890", 1);

    } else {
      ctx.fillStyle="#2a6ec2"; ctx.fillRect(x,y,w,h);
    }
  }

  // Spots are placed using each location's mapPos {x, y} in canvas pixels.
  function drawWorldMap() {
    // parchment-tinted sea
    const g = ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0, "#3f7a9a"); g.addColorStop(1, "#2a5f80");
    ctx.fillStyle = g; ctx.fillRect(0,0,W,H);

    // faint chart grid
    ctx.strokeStyle = "rgba(230,240,235,0.12)"; ctx.lineWidth = 1;
    for (let x = 10; x < W; x += 16) { ctx.beginPath(); ctx.moveTo(x+0.5, 12); ctx.lineTo(x+0.5, H-14); ctx.stroke(); }
    for (let y = 18; y < H-12; y += 16) { ctx.beginPath(); ctx.moveTo(2, y+0.5); ctx.lineTo(W-2, y+0.5); ctx.stroke(); }

    // stylized wave glyphs scattered on the sea
    ctx.strokeStyle = "rgba(230,240,235,0.22)";
    const waves = [[24,40],[120,34],[70,96],[132,104],[30,110],[100,64]];
    waves.forEach(([wx,wy], i) => {
      if ((i + Math.floor(frame/40)) % 3 !== 0) {
        ctx.beginPath();
        ctx.moveTo(wx, wy);
        ctx.quadraticCurveTo(wx+3, wy-3, wx+6, wy);
        ctx.quadraticCurveTo(wx+9, wy+3, wx+12, wy);
        ctx.stroke();
      }
    });

    // decorative sea monster (bottom-left) — like old charts "hic sunt dracones"
    drawSeaMonster(26, 118);

    // compass rose (top-right)
    drawCompass(W-24, 34);

    // dashed route connecting the spots
    const list = locationList();
    ctx.strokeStyle = "rgba(255,240,200,0.7)"; ctx.lineWidth = 1;
    ctx.setLineDash([3,3]);
    ctx.beginPath();
    list.forEach((k, i) => {
      const m = LOCATIONS[k].mapPos;
      if (i === 0) ctx.moveTo(m.x, m.y); else ctx.lineTo(m.x, m.y);
    });
    ctx.stroke();
    ctx.setLineDash([]);

    // spots as little islands with a marker
    list.forEach((k, i) => {
      const m = LOCATIONS[k].mapPos;
      const selected = (i === mapIndex);
      // island blob
      ctx.fillStyle = "#d9c48f";
      ctx.beginPath(); ctx.ellipse(m.x, m.y+2, 7, 4, 0, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = "#5bbf4a";
      ctx.beginPath(); ctx.ellipse(m.x, m.y, 5, 3, 0, 0, Math.PI*2); ctx.fill();
      // a tiny palm/peak on the island
      ctx.fillStyle = "#3a7a3a"; ctx.fillRect(m.x-1, m.y-4, 2, 3);
      // location marker (X marks the spot) — selected blinks
      const blink = (Math.floor(frame/8) % 2 === 0);
      ctx.strokeStyle = selected ? (blink ? "#ffe14d" : "#e0402a") : "#e0402a";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(m.x-3, m.y-9); ctx.lineTo(m.x+3, m.y-3);
      ctx.moveTo(m.x+3, m.y-9); ctx.lineTo(m.x-3, m.y-3);
      ctx.stroke();
      ctx.lineWidth = 1;
      if (k === currentLocation) { ctx.strokeStyle = "#ffffff"; ctx.strokeRect(m.x-8, m.y-11, 16, 20); }
      // name label for the selected spot
      if (selected) {
        const nm = LOCATIONS[k].name;
        const nw = nm.length * 5 + 6;
        const nx = Math.max(2, Math.min(W-nw-2, m.x - nw/2));
        ctx.fillStyle = "#f4ecd0"; ctx.fillRect(nx, m.y-22, nw, 9);
        ctx.strokeStyle = "#5a3a1a"; ctx.strokeRect(nx+0.5, m.y-22+0.5, nw-1, 8);
        text(nm, nx+3, m.y-21, "#3a2a1a");
      }
    });

    // title bar
    ctx.fillStyle = PAL.dark; ctx.fillRect(0, 0, W, 12);
    text("\u2693 CARTA NAUTICA", 4, 2, PAL.textBg);

    // info bar
    const sel = LOCATIONS[list[mapIndex]];
    const species = [1,2,3,4].reduce((a,t)=>a.concat(sel.fish[t]),[]);
    const got = species.filter(sp => caught[list[mapIndex] + ":" + sp.name]).length;
    const bx = 4, by = H-13, bw = W-8, bh = 12;
    ctx.fillStyle = "#f4ecd0"; ctx.fillRect(bx, by, bw, bh);
    ctx.strokeStyle = "#5a3a1a"; ctx.strokeRect(bx+0.5, by+0.5, bw-1, bh-1);
    text(sel.sea + " " + got + "/" + species.length, bx+3, by+2, "#3a2a1a");
    text("B=SALPA", bx+bw-42, by+2, "#2e6a2c");
  }

  // Compass rose (rosa dei venti)
  function drawCompass(cx, cy) {
    ctx.strokeStyle = "rgba(244,236,208,0.8)"; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(cx, cy, 9, 0, Math.PI*2); ctx.stroke();
    ctx.beginPath(); ctx.arc(cx, cy, 5, 0, Math.PI*2); ctx.stroke();
    // 4-point star
    ctx.fillStyle = "#e0402a";
    ctx.beginPath();
    ctx.moveTo(cx, cy-9); ctx.lineTo(cx+2, cy); ctx.lineTo(cx, cy+9); ctx.lineTo(cx-2, cy); ctx.closePath(); ctx.fill();
    ctx.fillStyle = "#f4ecd0";
    ctx.beginPath();
    ctx.moveTo(cx-9, cy); ctx.lineTo(cx, cy+2); ctx.lineTo(cx+9, cy); ctx.lineTo(cx, cy-2); ctx.closePath(); ctx.fill();
    text("N", cx-2, cy-18, "#f4ecd0");
  }

  // Decorative sea monster (a coiling serpent) for the chart corner
  function drawSeaMonster(x, y) {
    ctx.fillStyle = "rgba(60,110,90,0.8)";
    // humps
    for (let i = 0; i < 4; i++) {
      const hx = x + i*7;
      ctx.beginPath(); ctx.arc(hx, y, 3, Math.PI, 0); ctx.fill();
    }
    // head
    ctx.fillStyle = "rgba(60,110,90,0.9)";
    ctx.fillRect(x+26, y-4, 5, 4);
    ctx.fillStyle = "#e0402a"; ctx.fillRect(x+30, y-3, 1, 1); // eye
    // spray
    ctx.fillStyle = "rgba(230,240,235,0.4)";
    ctx.fillRect(x+28, y-8, 1, 3);
  }

  function drawLocationBackground() {
    const loc = LOCATIONS[currentLocation];
    if (loc.background === "napoli") return drawNapoliSkyline();
    if (loc.background === "lofoten") return drawLofotenScene();
    if (loc.background === "amazzonia") return drawAmazzoniaScene();
    if (loc.background === "reef") return drawReefScene();
    if (loc.background === "kamchatka") return drawKamchatkaScene();
    if (loc.background === "fuji") return drawFujiScene();
    if (loc.background === "bijagos") return drawBijagosScene();
    if (loc.background === "patagonia") return drawPatagoniaScene();
    if (loc.background === "antille") return drawAntilleScene();
    if (loc.background === "ross") return drawRossScene();
    ctx.fillStyle = "#7fae6a"; ctx.fillRect(0, HORIZON-4, W, 4);
    ctx.fillStyle = "#5f8f4e"; ctx.fillRect(0, HORIZON-2, W, 2);
  }

  // Golfo di Napoli: Vesuvio basso e largo sul fondo, città che rientra a sinistra
  // formando la curva del golfo, Castel dell'Ovo sul promontorio a destra.
  function drawNapoliSkyline() {
    const base = HORIZON;   // horizon line

    // ---- Vesuvio + Monte Somma: SHORT and WIDE on the far background ----
    // wide, gentle profile (much lower than before)
    ctx.fillStyle = "#748895";
    ctx.beginPath();
    ctx.moveTo(60, base-4);
    ctx.lineTo(84, base-11);    // Monte Somma shoulder
    ctx.lineTo(96, base-10);    // saddle
    ctx.lineTo(112, base-16);   // Gran Cono (short summit)
    ctx.lineTo(140, base-5);    // long gentle right slope
    ctx.lineTo(150, base-4);
    ctx.closePath(); ctx.fill();
    // sunlit left flank
    ctx.fillStyle = "#8799a4";
    ctx.beginPath();
    ctx.moveTo(112, base-16); ctx.lineTo(96, base-10);
    ctx.lineTo(84, base-11); ctx.lineTo(60, base-4);
    ctx.lineTo(112, base-4);
    ctx.closePath(); ctx.fill();
    // shaded right flank
    ctx.fillStyle = "#5c6e77";
    ctx.beginPath();
    ctx.moveTo(112, base-16); ctx.lineTo(140, base-5);
    ctx.lineTo(150, base-4); ctx.lineTo(112, base-4);
    ctx.closePath(); ctx.fill();
    // faint smoke wisp
    ctx.fillStyle = "rgba(220,220,225,0.3)";
    ctx.fillRect(112, base-19, 2, 3);

    // ---- Capri: hazy island far right ----
    ctx.fillStyle = "#9fb6cc";
    ctx.beginPath();
    ctx.moveTo(152, base-3); ctx.lineTo(156, base-6);
    ctx.lineTo(159, base-4); ctx.lineTo(160, base-3);
    ctx.closePath(); ctx.fill();

    // ---- The gulf shoreline: curves from the LEFT foreground inward ----
    // A thin distant city band across the middle (behind, at the base of Vesuvio)
    ctx.fillStyle = "#c2b0a4"; ctx.fillRect(52, base-4, 96, 2);
    ctx.fillStyle = "#b0a094";
    for (let x = 54; x < 146; x += 4) {
      const h = 1 + ((x*7) % 3);
      ctx.fillRect(x, base-4-h, 3, h);
    }

    // Left-side land/city that juts into the bay (the inlet/rientranza)
    // Green hill behind the left city (Posillipo/Vomero)
    ctx.fillStyle = "#6f8a6a";
    ctx.beginPath();
    ctx.moveTo(0, base-2); ctx.lineTo(0, base-12);
    ctx.lineTo(14, base-14); ctx.lineTo(30, base-9);
    ctx.lineTo(44, base-3); ctx.closePath(); ctx.fill();
    // Left city buildings (denser, in the foreground of the bay curve)
    for (let x = 2; x < 46; x += 4) {
      const h = 3 + ((x*13) % 6);
      ctx.fillStyle = ((x/4)|0) % 2 === 0 ? "#c8ad9a" : "#b6997f";
      ctx.fillRect(x, base-3-h, 3, h);
      if (h >= 5) { ctx.fillStyle = "#f2e3a0"; ctx.fillRect(x+1, base-2-h, 1, 1); }
    }

    // ---- Curved shoreline / lungomare sweeping from left toward center ----
    // draw a curved beach edge using the sea color already below; here the land edge
    ctx.fillStyle = "#c9b79a";
    ctx.beginPath();
    ctx.moveTo(0, base+2);
    ctx.quadraticCurveTo(24, base-2, 52, base+4);   // curve of the bay
    ctx.lineTo(52, base+2); ctx.lineTo(0, base-2);
    ctx.closePath(); ctx.fill();

    // ---- Castel dell'Ovo on a promontory to the RIGHT of the bay curve ----
    const cxo = 60;
    // promontory
    ctx.fillStyle = "#9a8a70"; ctx.fillRect(cxo-3, base-1, 16, 3);
    // castle block
    ctx.fillStyle = "#d8c8a8"; ctx.fillRect(cxo, base-6, 12, 6);
    ctx.fillStyle = "#c8b088"; ctx.fillRect(cxo, base-6, 12, 1);
    ctx.fillStyle = "#d8c8a8"; ctx.fillRect(cxo+2, base-9, 3, 3);   // tower 1
    ctx.fillRect(cxo+8, base-9, 3, 3);                             // tower 2
    ctx.fillStyle = "#b89870";
    ctx.fillRect(cxo, base-6, 1, 1); ctx.fillRect(cxo+4, base-6, 1, 1);
    ctx.fillRect(cxo+8, base-6, 1, 1); ctx.fillRect(cxo+11, base-6, 1, 1);
  }

  // Tiny sailboat silhouette on the sea
  function drawBoat(x, y, hull, sail) {
    ctx.fillStyle = hull; ctx.fillRect(x-3, y, 6, 2);       // hull
    ctx.fillStyle = "#8a6a3a"; ctx.fillRect(x, y-5, 1, 5);  // mast
    ctx.fillStyle = sail; 
    ctx.beginPath();
    ctx.moveTo(x+1, y-5); ctx.lineTo(x+1, y-1); ctx.lineTo(x+4, y-1);
    ctx.closePath(); ctx.fill();                            // sail
  }

  // Aurora borealis: soft wavy green/violet bands in the sky
  function drawAurora() {
    const t = frame * 0.02;
    const bands = [
      { col:"rgba(80,220,140,0.30)", yBase:10, amp:4, off:0 },
      { col:"rgba(120,240,170,0.25)", yBase:16, amp:5, off:1.2 },
      { col:"rgba(150,120,230,0.20)", yBase:22, amp:6, off:2.4 }
    ];
    bands.forEach(b => {
      ctx.fillStyle = b.col;
      for (let x = 0; x < W; x += 2) {
        const y = b.yBase + Math.sin(x*0.06 + t + b.off) * b.amp;
        ctx.fillRect(x, y, 2, 6);
      }
    });
    // a few stars
    ctx.fillStyle = "rgba(255,255,255,0.7)";
    for (let i = 0; i < 8; i++) {
      const sx = (i*37 + 11) % W, sy = (i*13 + 4) % 26;
      if ((i + Math.floor(frame/30)) % 3 === 0) ctx.fillRect(sx, sy, 1, 1);
    }
  }

  // Lofoten: snowy fjord peaks, red rorbu cabins on stilts, a fishing boat
  function drawLofotenScene() {
    const base = HORIZON;

    // ---- Snowy fjord mountains (jagged, layered) ----
    // far range
    ctx.fillStyle = "#5a6f82";
    ctx.beginPath();
    ctx.moveTo(0, base);
    ctx.lineTo(18, base-20); ctx.lineTo(34, base-10);
    ctx.lineTo(52, base-24); ctx.lineTo(72, base-12);
    ctx.lineTo(96, base-26); ctx.lineTo(120, base-14);
    ctx.lineTo(144, base-22); ctx.lineTo(160, base-12);
    ctx.lineTo(160, base); ctx.closePath(); ctx.fill();
    // snow caps (lighter, on the peaks)
    ctx.fillStyle = "#e8f0f5";
    const peaks = [[18,20],[52,24],[96,26],[144,22]];
    peaks.forEach(([px,ph]) => {
      ctx.beginPath();
      ctx.moveTo(px, base-ph);
      ctx.lineTo(px-5, base-ph+7); ctx.lineTo(px+5, base-ph+7);
      ctx.closePath(); ctx.fill();
    });
    // near range (darker, in front)
    ctx.fillStyle = "#3f4f5e";
    ctx.beginPath();
    ctx.moveTo(0, base);
    ctx.lineTo(10, base-8); ctx.lineTo(26, base-3);
    ctx.lineTo(40, base-9); ctx.lineTo(60, base-4);
    ctx.lineTo(60, base); ctx.closePath(); ctx.fill();

    // snowy shoreline strip
    ctx.fillStyle = "#dfe9ee"; ctx.fillRect(0, base-2, W, 3);

    // ---- Rorbu: red wooden cabins on stilts over the water ----
    drawRorbu(30, base+3);
    drawRorbu(46, base+4);
    drawRorbu(120, base+3);

    // ---- Traditional fishing boat ----
    drawFishingBoat(90, base+10);
  }

  // Red rorbu cabin on stilts
  function drawRorbu(x, waterY) {
    const bodyY = waterY - 8;
    // stilts
    ctx.fillStyle = "#3a2a1a";
    ctx.fillRect(x, bodyY+6, 1, waterY-bodyY-4);
    ctx.fillRect(x+7, bodyY+6, 1, waterY-bodyY-4);
    // body
    ctx.fillStyle = "#b5382f"; ctx.fillRect(x, bodyY, 9, 7);
    ctx.fillStyle = "#8f2a24"; ctx.fillRect(x, bodyY+5, 9, 2); // shade
    // roof
    ctx.fillStyle = "#e8f0f5";
    ctx.beginPath();
    ctx.moveTo(x-1, bodyY); ctx.lineTo(x+4, bodyY-4); ctx.lineTo(x+10, bodyY);
    ctx.closePath(); ctx.fill();
    // window
    ctx.fillStyle = "#f2e3a0"; ctx.fillRect(x+3, bodyY+2, 2, 2);
    // reflection in water
    ctx.fillStyle = "rgba(181,56,47,0.35)"; ctx.fillRect(x, waterY, 9, 2);
  }

  // Traditional fishing boat (bigger than the sailboat)
  function drawFishingBoat(x, y) {
    ctx.fillStyle = "#243c50";
    ctx.beginPath();
    ctx.moveTo(x-8, y); ctx.lineTo(x+8, y);
    ctx.lineTo(x+6, y+4); ctx.lineTo(x-6, y+4);
    ctx.closePath(); ctx.fill();
    // cabin
    ctx.fillStyle = "#d8d0c0"; ctx.fillRect(x-3, y-5, 6, 5);
    ctx.fillStyle = "#3a2a1a"; ctx.fillRect(x-1, y-9, 1, 4); // mast
    // reflection
    ctx.fillStyle = "rgba(36,60,80,0.3)"; ctx.fillRect(x-7, y+5, 14, 2);
  }

  // Rio delle Amazzoni: dense jungle wall, roots in the water, mist, a wooden canoe
  function drawAmazzoniaScene() {
    const base = HORIZON;

    // ---- Dense jungle wall across the horizon (layered greens) ----
    // far canopy
    ctx.fillStyle = "#3a6a3a";
    for (let x = 0; x < W; x += 6) {
      const h = 8 + ((x*7) % 6);
      ctx.beginPath(); ctx.arc(x+3, base-4, h/1.5, Math.PI, 0); ctx.fill();
    }
    // mid canopy
    ctx.fillStyle = "#2e5a2e";
    for (let x = -3; x < W; x += 8) {
      const h = 10 + ((x*11) % 8);
      ctx.beginPath(); ctx.arc(x+4, base-2, h/1.6, Math.PI, 0); ctx.fill();
    }
    // tall emergent trees
    ctx.fillStyle = "#24481f";
    [14, 40, 78, 110, 140].forEach((tx, i) => {
      const th = 22 + (i%3)*6;
      ctx.fillRect(tx, base-th, 3, th);            // trunk
      ctx.beginPath(); ctx.arc(tx+1, base-th, 7, 0, Math.PI*2); ctx.fill(); // crown
    });
    // solid green base band at the waterline
    ctx.fillStyle = "#2e5a2e"; ctx.fillRect(0, base-3, W, 4);

    // ---- Hanging roots / vines dipping into the water ----
    ctx.strokeStyle = "#3a5a2a"; ctx.lineWidth = 1;
    for (let i = 0; i < 10; i++) {
      const rx = (i*17 + 6) % W;
      const sway = Math.sin(frame*0.03 + i) * 2;
      ctx.beginPath();
      ctx.moveTo(rx, base-2);
      ctx.quadraticCurveTo(rx+sway, base+4, rx+sway*1.5, base+9);
      ctx.stroke();
    }

    // ---- Morning mist bands over the river ----
    for (let i = 0; i < 3; i++) {
      ctx.fillStyle = "rgba(230,238,225,0.18)";
      const my = base + 2 + i*5;
      const mx = (frame*(0.2+i*0.1)) % (W+40) - 20;
      ctx.fillRect(mx, my, 40, 3);
      ctx.fillRect(mx-60, my, 40, 3);
    }

    // ---- Wooden canoe near the left bank ----
    drawCanoe(30 + Math.sin(frame*0.02)*2, base+11);

    // lily pads floating
    ctx.fillStyle = "#4a8a3a";
    [[70,base+16],[96,base+22],[120,base+14]].forEach(([lx,ly])=>{
      ctx.beginPath(); ctx.ellipse(lx, ly, 4, 2, 0, 0, Math.PI*2); ctx.fill();
    });
  }

  // Simple dugout canoe
  function drawCanoe(x, y) {
    ctx.fillStyle = "#6a4a2a";
    ctx.beginPath();
    ctx.moveTo(x-9, y); ctx.lineTo(x+9, y);
    ctx.lineTo(x+6, y+3); ctx.lineTo(x-6, y+3);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = "#4a3018"; ctx.fillRect(x-9, y, 18, 1); // rim
    // reflection
    ctx.fillStyle = "rgba(106,74,42,0.3)"; ctx.fillRect(x-8, y+4, 16, 1);
  }

  // Grande Barriera Corallina: reef flat, sandy atolls, coral under the water
  function drawReefScene() {
    const base = HORIZON;

    // a few birds in the sky
    ctx.fillStyle = "#5a7a8a";
    [[20,10],[30,14],[130,8],[142,12]].forEach(([bx,by])=>{
      ctx.fillRect(bx, by, 1, 1); ctx.fillRect(bx+1, by-1, 1, 1); ctx.fillRect(bx+2, by, 1, 1);
    });

    // distant reef line on the horizon (exposed reef flat)
    ctx.fillStyle = "#8fd8d0"; ctx.fillRect(0, base-3, W, 3);
    ctx.fillStyle = "#a8e4dc"; ctx.fillRect(0, base-3, W, 1);

    // several sandy atolls / cays of varied size along the horizon
    const atolls = [[18,10],[44,7],[70,16],[100,8],[122,12],[150,9]];
    atolls.forEach(([ax,aw])=>{
      ctx.fillStyle="#f2ecd0";
      ctx.beginPath(); ctx.ellipse(ax, base-2, aw/2, 3, 0, Math.PI, 0); ctx.fill();
      ctx.fillStyle="#e6dcb8";
      ctx.beginPath(); ctx.ellipse(ax, base-2, aw/2-1, 2, 0, Math.PI, 0); ctx.fill();
    });
    // palms on a few atolls
    [[70,-1],[70,3],[100,0],[122,1],[122,5]].forEach(([px,off])=>{
      const tx = px + off;
      ctx.fillStyle="#6a4a2a"; ctx.fillRect(tx, base-10, 1, 7);
      ctx.fillStyle="#3a8a4a";
      ctx.fillRect(tx-4, base-11, 4, 1); ctx.fillRect(tx+1, base-11, 4, 1);
      ctx.fillRect(tx-3, base-12, 3, 1); ctx.fillRect(tx+1, base-12, 3, 1);
    });

    // DENSE coral garden under the transparent surface (layered rows)
    const coralCols = ["#e07aa0","#e0a040","#7a5ad0","#40b0a0","#e05a5a","#f0c060","#5a90e0"];
    // back row (smaller, fainter, higher)
    for (let i = 0; i < 14; i++) {
      const cx = 6 + i*12;
      const cy = base + 5 + (i % 2) * 3;
      ctx.globalAlpha = 0.35;
      ctx.fillStyle = coralCols[(i+2) % coralCols.length];
      ctx.fillRect(cx, cy-1, 2, 3);
      ctx.globalAlpha = 1;
    }
    // front row (bigger branching corals)
    for (let i = 0; i < 10; i++) {
      const cx = 10 + i*16;
      const cy = base + 12 + (i % 3) * 4;
      const col = coralCols[i % coralCols.length];
      ctx.globalAlpha = 0.6;
      ctx.fillStyle = col;
      // branching coral shape
      ctx.fillRect(cx-3, cy, 2, 4);
      ctx.fillRect(cx-1, cy-2, 2, 6);
      ctx.fillRect(cx+1, cy-1, 2, 5);
      ctx.fillRect(cx+3, cy+1, 2, 3);
      // brain-coral dome variant every 3rd
      if (i % 3 === 0) { ctx.fillStyle = coralCols[(i+3)%coralCols.length]; ctx.beginPath(); ctx.arc(cx, cy+2, 3, Math.PI, 0); ctx.fill(); }
      ctx.globalAlpha = 1;
    }
    // sea anemones / small plants
    ctx.globalAlpha = 0.55;
    for (let i = 0; i < 6; i++) {
      const ax = 20 + i*24, ay = base + 20;
      ctx.fillStyle = "#e090c0";
      for (let s = -2; s <= 2; s++) ctx.fillRect(ax+s, ay - Math.abs(s), 1, 3);
    }
    ctx.globalAlpha = 1;

    // small tropical fish darting under the surface
    const tf = ["#f0c040","#e05a5a","#5a90e0","#40b0a0"];
    for (let i = 0; i < 5; i++) {
      const fx = ((frame*0.5 + i*40) % (W+20)) - 10;
      const fy = base + 8 + (i*7) % 22;
      drawFishSprite(fx, fy, 0.8, tf[i % tf.length], "#ffffff", 1);
    }

    // sun glitter on the surface
    ctx.fillStyle = "rgba(255,255,255,0.35)";
    for (let i = 0; i < 10; i++) {
      const gx = (i*17 + Math.floor(frame*0.5)) % W;
      ctx.fillRect(gx, base + 2, 3, 1);
    }
  }

  // Kamchatka: dark rocky coasts, smoking volcano, drifting ice, heavy fog
  function drawKamchatkaScene() {
    const base = HORIZON;

    // distant volcano with smoke plume (right)
    ctx.fillStyle = "#3f4650";
    ctx.beginPath();
    ctx.moveTo(96, base); ctx.lineTo(118, base-26); ctx.lineTo(140, base); ctx.closePath(); ctx.fill();
    // snow on the cone
    ctx.fillStyle = "#dfe7ea";
    ctx.beginPath();
    ctx.moveTo(118, base-26); ctx.lineTo(112, base-16); ctx.lineTo(124, base-16); ctx.closePath(); ctx.fill();
    // crater smoke plume rising
    ctx.fillStyle = "rgba(180,185,188,0.5)";
    for (let i = 0; i < 5; i++) {
      const sy = base-26 - i*4;
      const sx = 118 + Math.sin(frame*0.03 + i) * (2 + i);
      ctx.fillRect(sx, sy, 3+i, 3);
    }

    // a second smaller peak (left)
    ctx.fillStyle = "#454c56";
    ctx.beginPath();
    ctx.moveTo(0, base); ctx.lineTo(22, base-16); ctx.lineTo(44, base); ctx.closePath(); ctx.fill();
    ctx.fillStyle = "#c8d2d6"; ctx.fillRect(20, base-16, 4, 2);

    // dark rocky coastline strip with SNOW on top
    ctx.fillStyle = "#3a424a"; ctx.fillRect(0, base-3, W, 4);
    for (let x = 0; x < W; x += 7) {
      const h = 2 + ((x*5)%4);
      ctx.fillStyle = "#454e58"; ctx.fillRect(x, base-3-h, 3, h);
      ctx.fillStyle = "#eaf2f5"; ctx.fillRect(x, base-3-h, 3, 1);   // snow cap on rocks
    }

    // more snow patches along the shore
    ctx.fillStyle = "#eaf2f5";
    for (let x = 3; x < W; x += 11) ctx.fillRect(x, base-2, 4, 1);

    // heavy fog bands over the water and horizon
    for (let i = 0; i < 4; i++) {
      ctx.fillStyle = "rgba(220,232,238,0.20)";
      const fy = base - 6 + i*7;
      const fx = (frame*(0.15+i*0.08)) % (W+50) - 25;
      ctx.fillRect(fx, fy, 50, 4);
      ctx.fillRect(fx-70, fy, 50, 4);
    }

    // drifting ice floes on the sea
    ctx.fillStyle = "#e4ecee";
    [[30,base+10],[80,base+18],[120,base+26],[55,base+30]].forEach(([ix,iy],k)=>{
      const dx = ix + Math.sin(frame*0.02 + k)*4;
      ctx.beginPath();
      ctx.moveTo(dx-6, iy); ctx.lineTo(dx-2, iy-3); ctx.lineTo(dx+5, iy-2); ctx.lineTo(dx+7, iy+1); ctx.lineTo(dx-3, iy+2);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = "#c8d6da"; ctx.fillRect(dx-4, iy+1, 8, 1); ctx.fillStyle = "#e4ecee";
    });

    // falling snowflakes across the whole scene
    ctx.fillStyle = "#ffffff";
    for (let i = 0; i < 26; i++) {
      const sx = (i * 37 + Math.sin((frame*0.02) + i) * 6) % W;
      const sy = (i * 53 + frame * (0.6 + (i%3)*0.25)) % H;
      const sz = 1 + (i % 3 === 0 ? 1 : 0);
      ctx.fillRect(Math.round(sx), Math.round(sy), sz, sz);
    }
  }

  // Monte Fuji: snow-capped Fuji, red torii gates, bent pines, sampan boat
  function drawFujiScene() {
    const base = HORIZON;

    // low rolling hills at the base
    ctx.fillStyle = "#6a8a6a"; ctx.fillRect(0, base-4, W, 4);

    // ---- Mt Fuji: wide, low, with concave flared slopes ----
    const fx = 72, fw = 96, fh = 30;          // wider & a bit lower than a sharp cone
    const leftX = fx - fw/2, rightX = fx + fw/2;
    const summitL = fx - 8, summitR = fx + 8;  // broad, gently rounded summit
    const summitY = base - fh;
    // mountain body with CONCAVE flanks (quadratic curves flaring outward)
    ctx.fillStyle = "#8290ac";
    ctx.beginPath();
    ctx.moveTo(leftX, base);
    ctx.quadraticCurveTo(fx - fw*0.32, base - fh*0.55, summitL, summitY); // concave left slope
    ctx.lineTo(summitR, summitY);
    ctx.quadraticCurveTo(fx + fw*0.32, base - fh*0.55, rightX, base);      // concave right slope
    ctx.closePath(); ctx.fill();
    // soft right-side shading
    ctx.fillStyle = "#717f9c";
    ctx.beginPath();
    ctx.moveTo(fx, summitY); ctx.lineTo(summitR, summitY);
    ctx.quadraticCurveTo(fx + fw*0.32, base - fh*0.55, rightX, base);
    ctx.lineTo(fx, base);
    ctx.closePath(); ctx.fill();

    // ---- snow cap with jagged bottom edge + streaks running down the flanks ----
    ctx.fillStyle = "#f4f8fc";
    ctx.beginPath();
    ctx.moveTo(summitL, summitY);
    ctx.lineTo(summitR, summitY);
    ctx.lineTo(summitR + 5, summitY + 9);
    ctx.lineTo(summitR + 1, summitY + 6);
    ctx.lineTo(fx + 4, summitY + 11);
    ctx.lineTo(fx, summitY + 6);
    ctx.lineTo(fx - 4, summitY + 11);
    ctx.lineTo(summitL - 1, summitY + 6);
    ctx.lineTo(summitL - 5, summitY + 9);
    ctx.closePath(); ctx.fill();
    // vertical snow streaks descending the slopes (the classic Fuji look)
    ctx.fillStyle = "rgba(244,248,252,0.85)";
    [-10, -5, 2, 7, 12].forEach((dx, i) => {
      const sx = fx + dx;
      const len = 6 + (i % 2) * 4;
      ctx.fillRect(sx, summitY + 8, 1, len);
    });

    // faint reflection of Fuji on the water
    ctx.save();
    ctx.globalAlpha = 0.2;
    ctx.fillStyle = "#8290ac";
    ctx.beginPath();
    ctx.moveTo(leftX, base);
    ctx.quadraticCurveTo(fx - fw*0.32, base + fh*0.33, summitL, base + fh*0.6);
    ctx.lineTo(summitR, base + fh*0.6);
    ctx.quadraticCurveTo(fx + fw*0.32, base + fh*0.33, rightX, base);
    ctx.closePath(); ctx.fill();
    ctx.restore();

    // shoreline
    ctx.fillStyle = "#7a6a4a"; ctx.fillRect(0, base-2, W, 2);

    // red torii gate on the left, standing in the water
    drawTorii(20, base+8);
    // a bent windswept pine on the right
    drawPine(146, base+2);

    // traditional sampan fishing boat
    drawFishingBoat(112, base+12);
  }

  // Red torii gate
  function drawTorii(x, waterY) {
    const topY = waterY - 16;
    ctx.fillStyle = "#c0392b";
    // two pillars
    ctx.fillRect(x-6, topY, 2, waterY-topY);
    ctx.fillRect(x+4, topY, 2, waterY-topY);
    // top curved beam (kasagi) + second beam
    ctx.fillRect(x-9, topY, 18, 2);
    ctx.fillRect(x-7, topY+4, 14, 2);
    // dark under-shade
    ctx.fillStyle = "#8a2a20"; ctx.fillRect(x-9, topY+2, 18, 1);
    // reflection
    ctx.fillStyle = "rgba(192,57,43,0.3)"; ctx.fillRect(x-6, waterY, 2, 3); ctx.fillRect(x+4, waterY, 2, 3);
  }

  // Windswept pine tree
  function drawPine(x, baseY) {
    ctx.fillStyle = "#5a3a1a";
    // leaning trunk
    ctx.beginPath();
    ctx.moveTo(x, baseY); ctx.lineTo(x-2, baseY-10); ctx.lineTo(x-8, baseY-14);
    ctx.lineTo(x-7, baseY-13); ctx.lineTo(x-1, baseY-9); ctx.lineTo(x+1, baseY);
    ctx.closePath(); ctx.fill();
    // foliage clusters swept to the left
    ctx.fillStyle = "#2e6a3a";
    ctx.beginPath(); ctx.ellipse(x-9, baseY-14, 5, 2, 0, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(x-13, baseY-13, 4, 2, 0, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(x-6, baseY-11, 4, 2, 0, 0, Math.PI*2); ctx.fill();
  }

  // Arcipelago delle Bijagos: mangroves, red & white sand islands, stilt village
  function drawBijagosScene() {
    const base = HORIZON;

    // birds in the warm sky
    ctx.fillStyle = "#6a7a6a";
    [[24,12],[34,15],[110,10]].forEach(([bx,by])=>{ ctx.fillRect(bx,by,1,1); ctx.fillRect(bx+1,by-1,1,1); ctx.fillRect(bx+2,by,1,1); });

    // far hazy islands on the very horizon (varied)
    ctx.fillStyle = "rgba(150,180,150,0.6)";
    [[30,20],[86,28],[140,22]].forEach(([ix,iw])=>{ ctx.beginPath(); ctx.ellipse(ix, base-4, iw/2, 3, 0, Math.PI, 0); ctx.fill(); });

    // sandy islands on the shore: alternating red and white sand, with palms
    const islands = [[16,18,"#e0a878","#c88858"],[52,14,"#f0e6cc","#d8c8a0"],
                     [92,22,"#d89868","#b87848"],[132,16,"#f2e8d0","#dccca8"]];
    islands.forEach(([ix,iw,top,bot])=>{
      ctx.fillStyle = bot; ctx.beginPath(); ctx.ellipse(ix, base-1, iw/2, 4, 0, Math.PI, 0); ctx.fill();
      ctx.fillStyle = top; ctx.beginPath(); ctx.ellipse(ix, base-2, iw/2-1, 3, 0, Math.PI, 0); ctx.fill();
    });
    // palms on the shore islands
    [16,52,92,132].forEach((px,i)=>{ if (i%2===0) drawPalm(px, base-2); });

    // dense mangroves (green clumps with tangled roots) between the islands
    ctx.fillStyle = "#2e5a2e";
    for (let x = 0; x < W; x += 9) {
      const h = 7 + ((x*7) % 6);
      ctx.beginPath(); ctx.arc(x+4, base-3, h/1.7, Math.PI, 0); ctx.fill();
    }
    ctx.fillStyle = "#24481f";
    for (let x = 4; x < W; x += 18) { ctx.beginPath(); ctx.arc(x+2, base-6, 5, 0, Math.PI*2); ctx.fill(); }
    // mangrove roots dipping into the water
    ctx.strokeStyle = "#3a2a1a"; ctx.lineWidth = 1;
    for (let i = 0; i < 14; i++) {
      const rx = (i*12 + 4) % W;
      ctx.beginPath(); ctx.moveTo(rx, base-3); ctx.lineTo(rx-1, base+2); ctx.lineTo(rx+1, base+2); ctx.stroke();
    }
    ctx.fillStyle = "#2e5a2e"; ctx.fillRect(0, base-3, W, 3);

    // stilt village huts over the water (left)
    drawStiltHut(30, base+9);
    drawStiltHut(44, base+12);
  }

  // Small palm tree
  function drawPalm(x, baseY) {
    ctx.fillStyle = "#6a4a2a"; ctx.fillRect(x, baseY-8, 1, 8);
    ctx.fillStyle = "#3a8a4a";
    ctx.fillRect(x-4, baseY-9, 4, 1); ctx.fillRect(x+1, baseY-9, 4, 1);
    ctx.fillRect(x-3, baseY-10, 3, 1); ctx.fillRect(x+1, baseY-10, 3, 1);
    ctx.fillRect(x, baseY-11, 1, 1);
  }

  // Islands scattered out in the open sea (drawn after the water, with depth)
  function drawBijagosSeaIslands() {
    // 3 islands, spread out; some cut off by the frame edges. less "perfect"
    // [x, yBelowHorizon, width, sandTop, sandBot, palm]
    const seaIsl = [
      [-6,  16, 34, "#e6b088", "#c88858", true],   // cut off on the left edge
      [96,  10, 20, "#f0e6cc", "#d8c8a0", true],
      [150, 26, 40, "#e0a878", "#c88858", false]    // cut off on the right edge
    ];
    seaIsl.forEach(([ix, dy, iw, top, bot, palm])=>{
      const iy = HORIZON + dy;
      // subtle shallow-water tint (not a bright ring)
      ctx.fillStyle = "rgba(150,225,205,0.28)";
      ctx.beginPath(); ctx.ellipse(ix, iy+2, iw/2+4, 5, 0, 0, Math.PI*2); ctx.fill();
      // sand base (slightly irregular via two overlapping ellipses)
      ctx.fillStyle = bot;
      ctx.beginPath(); ctx.ellipse(ix, iy, iw/2, 4, 0, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(ix + iw*0.18, iy+1, iw/3, 3, 0, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = top;
      ctx.beginPath(); ctx.ellipse(ix - iw*0.1, iy-1, iw/2-3, 3, 0, 0, Math.PI*2); ctx.fill();
      // low green vegetation
      ctx.fillStyle = "#3a7a3a";
      ctx.beginPath(); ctx.ellipse(ix, iy-2, iw/3.5, 2, 0, 0, Math.PI*2); ctx.fill();
      if (palm) { drawPalm(ix - 2, iy-2); drawPalm(ix + 4, iy-1); }
    });
  }

  // Thatched hut on wooden stilts over the water
  function drawStiltHut(x, waterY) {
    const bodyY = waterY - 9;
    // stilts
    ctx.fillStyle = "#3a2a1a";
    ctx.fillRect(x, bodyY+6, 1, waterY-bodyY-4);
    ctx.fillRect(x+8, bodyY+6, 1, waterY-bodyY-4);
    // wall
    ctx.fillStyle = "#a07850"; ctx.fillRect(x, bodyY, 10, 7);
    ctx.fillStyle = "#846038"; ctx.fillRect(x, bodyY+5, 10, 2);
    // thatched roof
    ctx.fillStyle = "#c8a860";
    ctx.beginPath(); ctx.moveTo(x-2, bodyY); ctx.lineTo(x+5, bodyY-5); ctx.lineTo(x+12, bodyY); ctx.closePath(); ctx.fill();
    // doorway
    ctx.fillStyle = "#3a2a1a"; ctx.fillRect(x+4, bodyY+3, 2, 4);
    // reflection
    ctx.fillStyle = "rgba(160,120,80,0.3)"; ctx.fillRect(x, waterY, 10, 2);
  }

  // Patagonia: jagged snowy peaks & glaciers diving into the sea, lighthouse,
  // flag-tree bent by the wind, penguins on the rocks.
  function drawPatagoniaScene() {
    const base = HORIZON;

    // Cordillera Darwin: sharp snowy peaks along the horizon (two layers)
    ctx.fillStyle = "#5a6672";  // far range
    ctx.beginPath();
    ctx.moveTo(0, base);
    ctx.lineTo(16, base-24); ctx.lineTo(30, base-12);
    ctx.lineTo(48, base-28); ctx.lineTo(66, base-14);
    ctx.lineTo(84, base-26); ctx.lineTo(104, base-16);
    ctx.lineTo(124, base-30); ctx.lineTo(146, base-18);
    ctx.lineTo(160, base-24); ctx.lineTo(160, base);
    ctx.closePath(); ctx.fill();
    // snow caps
    ctx.fillStyle = "#eef4f6";
    [[16,24],[48,28],[84,26],[124,30]].forEach(([px,ph])=>{
      ctx.beginPath(); ctx.moveTo(px, base-ph); ctx.lineTo(px-6, base-ph+9); ctx.lineTo(px+6, base-ph+9); ctx.closePath(); ctx.fill();
    });
    // glacier tongues flowing to the water (bluish white)
    ctx.fillStyle = "#cfe4ee";
    ctx.fillRect(44, base-14, 8, 14);
    ctx.fillRect(120, base-16, 7, 16);
    // near dark rocky cliffs
    ctx.fillStyle = "#54606a";
    ctx.beginPath();
    ctx.moveTo(0, base); ctx.lineTo(12, base-8); ctx.lineTo(26, base-3); ctx.lineTo(40, base-7); ctx.lineTo(40, base);
    ctx.closePath(); ctx.fill();
    // rocky shoreline
    ctx.fillStyle = "#454e58"; ctx.fillRect(0, base-2, W, 3);

    // Faro Les Eclaireurs (lighthouse) on a rock, right side
    drawLighthouse(126, base+2);
    // flag-tree bent by the wind (left)
    drawFlagTree(24, base+1);
    // penguins on the shore rocks
    drawPenguin(50, base+1); drawPenguin(58, base+1); drawPenguin(66, base+2);
  }

  // Grey/blue ice floes drifting on the Patagonian sea (drawn after the water)
  function drawPatagoniaIce() {
    const base = HORIZON;
    // varied floes at different depths, grey-blue tints
    const floes = [
      [40,  10, 10, "#dbe8ee", "#b8cdd8"],
      [96,  16, 14, "#c8dae4", "#9fb8c6"],
      [70,  24, 18, "#d0e0e8", "#aac2ce"],
      [128, 30, 22, "#c0d4de", "#94aebc"],
      [24,  34, 20, "#d6e4ec", "#aec6d2"]
    ];
    floes.forEach(([ix,dy,iw,top,bot],k)=>{
      const iy = base + dy;
      const dx = ix + Math.sin(frame*0.015 + k)*3;
      // underwater blue tint
      ctx.fillStyle = "rgba(120,170,195,0.35)";
      ctx.beginPath(); ctx.ellipse(dx, iy+2, iw/2+2, 3, 0, 0, Math.PI*2); ctx.fill();
      // ice top (irregular chunk)
      ctx.fillStyle = bot;
      ctx.beginPath();
      ctx.moveTo(dx-iw/2, iy); ctx.lineTo(dx-iw/4, iy-3); ctx.lineTo(dx+iw/5, iy-2);
      ctx.lineTo(dx+iw/2, iy+1); ctx.lineTo(dx+iw/4, iy+3); ctx.lineTo(dx-iw/3, iy+2);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = top;
      ctx.beginPath();
      ctx.moveTo(dx-iw/3, iy-1); ctx.lineTo(dx-iw/6, iy-3); ctx.lineTo(dx+iw/6, iy-2); ctx.lineTo(dx+iw/4, iy); ctx.lineTo(dx-iw/4, iy+1);
      ctx.closePath(); ctx.fill();
    });
  }

  // Red-and-white lighthouse
  function drawLighthouse(x, waterY) {
    const topY = waterY - 16;
    // rock base
    ctx.fillStyle = "#3a424a"; ctx.beginPath(); ctx.ellipse(x+1, waterY, 8, 3, 0, 0, Math.PI*2); ctx.fill();
    // tower with red/white bands
    for (let i = 0; i < 4; i++) {
      ctx.fillStyle = (i % 2 === 0) ? "#d84030" : "#f0ece0";
      ctx.fillRect(x-2, topY + i*3, 5, 3);
    }
    // lantern room
    ctx.fillStyle = "#2a2a30"; ctx.fillRect(x-2, topY-3, 5, 3);
    ctx.fillStyle = "#ffe14d"; ctx.fillRect(x-1, topY-2, 3, 1);   // light
    // reflection
    ctx.fillStyle = "rgba(216,64,48,0.3)"; ctx.fillRect(x-2, waterY+1, 5, 2);
  }

  // Wind-bent "flag tree"
  function drawFlagTree(x, baseY) {
    ctx.fillStyle = "#4a3420";
    ctx.beginPath();
    ctx.moveTo(x, baseY); ctx.lineTo(x-1, baseY-12); ctx.lineTo(x-4, baseY-15);
    ctx.lineTo(x-3, baseY-14); ctx.lineTo(x, baseY-11); ctx.lineTo(x+1, baseY);
    ctx.closePath(); ctx.fill();
    // foliage swept hard to one side (flag)
    ctx.fillStyle = "#3a6a3a";
    ctx.fillRect(x-12, baseY-16, 8, 2);
    ctx.fillRect(x-10, baseY-14, 7, 2);
    ctx.fillRect(x-8, baseY-12, 6, 2);
  }

  // Tiny penguin
  function drawPenguin(x, baseY) {
    ctx.fillStyle = "#20242a"; ctx.fillRect(x-2, baseY-6, 4, 6);   // back
    ctx.fillStyle = "#f0f0f0"; ctx.fillRect(x-1, baseY-4, 2, 4);   // belly
    ctx.fillStyle = "#20242a"; ctx.fillRect(x-2, baseY-6, 4, 2);   // head
    ctx.fillStyle = "#e0a030"; ctx.fillRect(x-1, baseY-5, 1, 1);   // beak
    ctx.fillStyle = "#e0a030"; ctx.fillRect(x-1, baseY, 1, 1); ctx.fillRect(x, baseY, 1, 1); // feet
  }

  // Grandi Antille (Caraibi): white-sand atolls with wind-bent coconut palms,
  // turquoise transparent sea, reef visible at the surface, a half-sunken wreck.
  function drawAntilleScene() {
    const base = HORIZON;

    // a few clouds
    ctx.fillStyle = "rgba(255,255,255,0.7)";
    [[26,10,10],[100,7,12],[140,12,8]].forEach(([cx,cy,cw])=>{
      ctx.beginPath(); ctx.arc(cx, cy, cw/2, 0, Math.PI*2); ctx.arc(cx+cw/2, cy+1, cw/2.5, 0, Math.PI*2); ctx.fill();
    });

    // distant reef line just under the horizon (pale turquoise band)
    ctx.fillStyle = "#bff0e8"; ctx.fillRect(0, base, W, 2);

    // white-sand atolls on the horizon
    const atolls = [[24,26],[86,20],[136,30]];
    atolls.forEach(([ix,iw])=>{
      ctx.fillStyle = "#d8cca8"; ctx.beginPath(); ctx.ellipse(ix, base-1, iw/2, 4, 0, Math.PI, 0); ctx.fill();
      ctx.fillStyle = "#f4eed0"; ctx.beginPath(); ctx.ellipse(ix, base-2, iw/2-2, 3, 0, Math.PI, 0); ctx.fill();
    });
    // wind-bent coconut palms on the atolls
    drawBentPalm(20, base-2); drawBentPalm(28, base-2);
    drawBentPalm(86, base-2);
    drawBentPalm(132, base-2); drawBentPalm(140, base-2);

    // shoreline
    ctx.fillStyle = "#e0d4a8"; ctx.fillRect(0, base-2, W, 2);
  }

  // Coconut palm bent by the wind
  function drawBentPalm(x, baseY) {
    ctx.strokeStyle = "#8a6a3a"; ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(x, baseY);
    ctx.quadraticCurveTo(x+2, baseY-8, x+7, baseY-11);   // trunk bends to the right
    ctx.stroke();
    // fronds swept downwind
    ctx.strokeStyle = "#2e8b4a";
    const tipX = x+7, tipY = baseY-11;
    [[10,-2],[9,2],[6,4],[3,-4]].forEach(([dx,dy])=>{
      ctx.beginPath(); ctx.moveTo(tipX, tipY); ctx.quadraticCurveTo(tipX+dx*0.6, tipY+dy*0.5-1, tipX+dx, tipY+dy); ctx.stroke();
    });
    // coconuts
    ctx.fillStyle = "#5a3a1a"; ctx.fillRect(tipX-1, tipY, 1, 1); ctx.fillRect(tipX+1, tipY+1, 1, 1);
  }

  // Half-sunken shipwreck breaking the surface (drawn after the water)
  function drawWreck(x, y) {
    // slanted hull
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(-0.18);
    ctx.fillStyle = "#5a4630";
    ctx.fillRect(-16, 0, 32, 6);
    ctx.fillStyle = "#3f3020"; ctx.fillRect(-16, 4, 32, 2);
    // broken mast
    ctx.strokeStyle = "#4a3620"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(4, 0); ctx.lineTo(8, -14); ctx.stroke();
    // ribs
    ctx.strokeStyle = "#3a2c1c"; ctx.lineWidth = 1;
    for (let i = -12; i <= 12; i += 6) { ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, -3); ctx.stroke(); }
    ctx.restore();
    // waterline foam around it
    ctx.fillStyle = "rgba(255,255,255,0.4)"; ctx.fillRect(x-16, y+2, 34, 1);
  }

  // Reef patches, sandy shoals and a wreck seen through the clear water
  function drawAntilleWater() {
    // pale sandy shoals (very shallow, near-white)
    ctx.fillStyle = "rgba(245,240,205,0.35)";
    [[40,10,20],[110,16,26],[70,26,30]].forEach(([sx,dy,sw])=>{
      ctx.beginPath(); ctx.ellipse(sx, HORIZON+dy, sw/2, 4, 0, 0, Math.PI*2); ctx.fill();
    });
    // coral patches visible at/just under the surface (colored, semi-transparent)
    const coralCols = ["#e07aa0","#e0a040","#7a5ad0","#40b0a0","#e05a5a"];
    for (let i = 0; i < 10; i++) {
      const cx = 8 + i*16;
      const cy = HORIZON + 6 + (i % 4) * 6;
      ctx.globalAlpha = 0.45;
      ctx.fillStyle = coralCols[i % coralCols.length];
      ctx.fillRect(cx-2, cy, 2, 3); ctx.fillRect(cx, cy-1, 2, 4); ctx.fillRect(cx+2, cy, 2, 3);
      ctx.globalAlpha = 1;
    }
    // a half-sunken wreck breaking the surface
    drawWreck(120, HORIZON + 20);
    // surface glitter
    ctx.fillStyle = "rgba(255,255,255,0.35)";
    for (let i = 0; i < 8; i++) { const gx = (i*21 + Math.floor(frame*0.3)) % W; ctx.fillRect(gx, HORIZON+3, 3, 1); }
  }

  // Mare di Ross (Antartide): ice-shelf walls, cobalt icebergs, icebreaker, penguins
  function drawRossScene() {
    const base = HORIZON;

    // towering ice-shelf wall along the back (white with blue base)
    ctx.fillStyle = "#eaf2f6";
    ctx.fillRect(0, base-18, W, 16);
    // uneven top edge
    ctx.fillStyle = "#eaf2f6";
    for (let x = 0; x < W; x += 8) { const h = 2 + ((x*5)%5); ctx.fillRect(x, base-18-h, 8, h); }
    // blue shaded base of the ice wall
    ctx.fillStyle = "#a8d0e4"; ctx.fillRect(0, base-6, W, 4);
    ctx.fillStyle = "#7fb8d8"; ctx.fillRect(0, base-3, W, 2);
    // vertical cracks in the ice wall
    ctx.strokeStyle = "#c8dce8"; ctx.lineWidth = 1;
    for (let x = 10; x < W; x += 22) { ctx.beginPath(); ctx.moveTo(x, base-18); ctx.lineTo(x+2, base-4); ctx.stroke(); }

    // an icebreaker ship in the distance (left)
    drawIcebreaker(40, base-2);

    // penguins on the ice edge
    drawPenguin(96, base-1); drawPenguin(104, base-1); drawPenguin(112, base);
  }

  // Cobalt-blue iceberg floating on the sea (drawn after the water)
  function drawIceberg(x, y, sz) {
    const s = sz;
    // underwater blue glow
    ctx.fillStyle = "rgba(60,120,190,0.35)";
    ctx.beginPath(); ctx.ellipse(x, y+2, s*1.4, 4, 0, 0, Math.PI*2); ctx.fill();
    // iceberg body (cobalt to white)
    ctx.fillStyle = "#4a80c0";
    ctx.beginPath();
    ctx.moveTo(x-s, y+2); ctx.lineTo(x-s*0.5, y-s*0.8); ctx.lineTo(x, y-s*1.2);
    ctx.lineTo(x+s*0.6, y-s*0.7); ctx.lineTo(x+s, y+2);
    ctx.closePath(); ctx.fill();
    // sunlit facets
    ctx.fillStyle = "#cfe4f2";
    ctx.beginPath(); ctx.moveTo(x, y-s*1.2); ctx.lineTo(x+s*0.6, y-s*0.7); ctx.lineTo(x+s*0.2, y+2); ctx.lineTo(x, y+2); ctx.closePath(); ctx.fill();
    ctx.fillStyle = "#8fbfe0";
    ctx.beginPath(); ctx.moveTo(x, y-s*1.2); ctx.lineTo(x-s*0.5, y-s*0.8); ctx.lineTo(x-s*0.2, y+2); ctx.lineTo(x, y+2); ctx.closePath(); ctx.fill();
  }

  // Icebreaker ship
  function drawIcebreaker(x, waterY) {
    const y = waterY;
    ctx.fillStyle = "#b03028";           // red hull
    ctx.beginPath();
    ctx.moveTo(x-12, y-4); ctx.lineTo(x+12, y-4); ctx.lineTo(x+9, y); ctx.lineTo(x-14, y);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = "#141418"; ctx.fillRect(x-14, y-2, 26, 2);  // waterline stripe
    // white superstructure
    ctx.fillStyle = "#e8ecee"; ctx.fillRect(x-4, y-11, 10, 7);
    ctx.fillStyle = "#c8ccce"; ctx.fillRect(x-4, y-11, 10, 1);
    // funnel + mast
    ctx.fillStyle = "#b03028"; ctx.fillRect(x+2, y-14, 3, 3);
    ctx.fillStyle = "#3a3f46"; ctx.fillRect(x-6, y-16, 1, 5);
    // windows
    ctx.fillStyle = "#ffe14d"; ctx.fillRect(x-2, y-9, 1, 1); ctx.fillRect(x+1, y-9, 1, 1);
  }

  function drawDock() {
    // planks receding toward the water (trapezoid perspective)
    const topY = DOCK_TOP, botY = H;
    const topHalf = 26, botHalf = 60;
    // deck
    ctx.fillStyle = PAL.dock;
    ctx.beginPath();
    ctx.moveTo(W/2 - topHalf, topY);
    ctx.lineTo(W/2 + topHalf, topY);
    ctx.lineTo(W/2 + botHalf, botY);
    ctx.lineTo(W/2 - botHalf, botY);
    ctx.closePath(); ctx.fill();
    // plank lines
    ctx.strokeStyle = PAL.dockDark; ctx.lineWidth = 1;
    for (let i = 1; i < 5; i++) {
      const tt = i/5;
      const y = topY + (botY-topY)*tt;
      const half = topHalf + (botHalf-topHalf)*tt;
      ctx.beginPath(); ctx.moveTo(W/2-half, y+0.5); ctx.lineTo(W/2+half, y+0.5); ctx.stroke();
    }
    // top edge highlight
    ctx.fillStyle = PAL.dockHi;
    ctx.fillRect(W/2 - topHalf, topY-1, topHalf*2, 2);
  }

  function drawPlayer() {
    // Fisherman seen from BEHIND, standing at bottom center
    const x = player.x, y = player.y;
    const skin = AV.skin[avatar.skin], hair = AV.hair[avatar.hair];
    const shirt = AV.shirt[avatar.shirt], pants = AV.pants[avatar.pants];
    const hat = AV.hat[avatar.hat];
    const shirtDark = shade(shirt, -0.2);
    // legs / pants
    ctx.fillStyle = pants; ctx.fillRect(x-6, y-2, 12, 10);
    ctx.fillStyle = shade(pants,-0.35); ctx.fillRect(x-1, y-2, 2, 10); // leg split
    // torso (back of shirt)
    ctx.fillStyle = shirt; ctx.fillRect(x-8, y-16, 16, 15);
    // shoulders shading
    ctx.fillStyle = shirtDark; ctx.fillRect(x-8, y-16, 16, 3);
    // arms
    ctx.fillStyle = skin;  ctx.fillRect(x+6, y-14, 4, 4);   // right hand/arm out
    ctx.fillStyle = shirt; ctx.fillRect(x-10, y-14, 3, 10); // left arm
    ctx.fillStyle = shirt; ctx.fillRect(x+7, y-14, 3, 8);   // right arm
    // head (back) + hair
    ctx.fillStyle = skin; ctx.fillRect(x-4, y-24, 8, 8);
    ctx.fillStyle = hair; ctx.fillRect(x-5, y-25, 10, 4);
    ctx.fillStyle = hair; ctx.fillRect(x-5, y-22, 2, 4); ctx.fillRect(x+3, y-22, 2, 4); // side hair
    // hat (if any)
    if (hat) { ctx.fillStyle = hat; ctx.fillRect(x-5, y-27, 10, 3); ctx.fillStyle = shade(hat,-0.2); ctx.fillRect(x-5, y-25, 10, 1); }
  }

  // lighten/darken a hex color by amt (-1..1)
  function shade(hex, amt) {
    if (!hex) return hex;
    let r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
    const f = (c)=> Math.max(0, Math.min(255, Math.round(c + 255*amt)));
    r=f(r); g=f(g); b=f(b);
    return "#" + [r,g,b].map(c=>c.toString(16).padStart(2,"0")).join("");
  }

  function drawRodAndLine() {
    // rod from the raised hand pointing forward/up toward the water
    ctx.strokeStyle = PAL.rod; ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(player.x+8, player.y-12);
    ctx.lineTo(rodTip.x, rodTip.y);
    ctx.stroke();
    // line from rod tip to hook
    if (state === STATE.WAITING || state === STATE.FLYING || state === STATE.BITE || state === STATE.FIGHT) {
      ctx.strokeStyle = PAL.line; ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(rodTip.x, rodTip.y);
      ctx.lineTo(hook.x, hook.y);
      ctx.stroke();
    }
  }

  function drawHook() {
    if (state === STATE.FLYING || state === STATE.WAITING || state === STATE.BITE || state === STATE.FIGHT) {
      // depth scale: smaller when far (near horizon)
      const depth = (hook.y - HORIZON) / (H - HORIZON);   // 0 far .. 1 near
      const s = 2 + Math.round(depth * 2);

      // During BITE the bobber dips under (quick bobbing)
      let dip = 0;
      if (state === STATE.BITE) dip = Math.abs(Math.sin(frame * 0.5)) * 4;
      // During FIGHT the bobber jerks side-to-side with the fish pull
      let jerk = 0;
      if (state === STATE.FIGHT) jerk = Math.sin(frame * 0.6) * fight.pull * 3;

      const hx = hook.x + jerk, hy = hook.y + dip;
      ctx.fillStyle = PAL.white; ctx.fillRect(hx-s/2, hy-s/2, s, s);
      ctx.fillStyle = PAL.shirt; ctx.fillRect(hx-s/2, hy-s/2, s, Math.max(1,s/2));

      if (state === STATE.WAITING) {
        ctx.strokeStyle = PAL.seaHi;
        const r = (2 + Math.sin(frame*0.15)*2) * (0.5 + depth);
        ctx.beginPath(); ctx.arc(hook.x, hook.y+1, r, 0, Math.PI*2); ctx.stroke();
      }
      if (state === STATE.FIGHT) {
        // agitated splashing around the fish
        ctx.strokeStyle = PAL.white;
        const r = 3 + Math.abs(Math.sin(frame*0.4)) * 3 * (0.5 + fight.pull);
        ctx.beginPath(); ctx.arc(hx, hy+1, r, 0, Math.PI*2); ctx.stroke();
      }
      if (state === STATE.BITE) {
        // agitated ripples
        ctx.strokeStyle = PAL.white;
        const r = 3 + (frame % 20) * 0.4;
        ctx.beginPath(); ctx.arc(hook.x, hook.y+1, r, 0, Math.PI*2); ctx.stroke();
        // flashing "!" above the bobber
        if (Math.floor(frame/6) % 2 === 0) {
          ctx.font = "bold 12px monospace"; ctx.textBaseline = "top";
          ctx.fillStyle = "#ffffff";
          ctx.fillText("!", hook.x - 2, hook.y - 18);
          ctx.fillStyle = "#e0202a";
          ctx.fillText("!", hook.x - 3, hook.y - 19);
          ctx.font = "8px monospace";
        }
      }
    }
  }

  function drawAimTarget() {
    // preview where the hook will land at current aim + preview/charged power
    const pw = (state === STATE.CASTING) ? castPower : 0.5;
    const d = 0.15 + pw * 0.8;
    const ty = distToY(d);
    const tx = aimToScreenX(aimX, d);
    // crosshair reticle on the water
    ctx.strokeStyle = PAL.marker; ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(tx-5, ty); ctx.lineTo(tx+5, ty);
    ctx.moveTo(tx, ty-5); ctx.lineTo(tx, ty+5);
    ctx.stroke();
    ctx.strokeRect(tx-3.5, ty-3.5, 7, 7);
    // dotted trajectory from rod tip to target
    ctx.fillStyle = PAL.marker;
    for (let i = 1; i <= 5; i++) {
      const t = i/6;
      const px = rodTip.x + (tx - rodTip.x)*t;
      const py = rodTip.y + (ty - rodTip.y)*t - Math.sin(t*Math.PI)*(14+pw*20);
      ctx.fillRect(px-1, py-1, 2, 2);
    }
  }

  function drawPowerBar() {
    const bx = 6, by = 118, bw = 148, bh = 8;
    ctx.fillStyle = PAL.dark; ctx.fillRect(bx-1, by-1, bw+2, bh+2);
    ctx.fillStyle = PAL.textBg; ctx.fillRect(bx, by, bw, bh);
    ctx.fillStyle = "#e0a030"; ctx.fillRect(bx, by, bw*castPower, bh);
    ctx.fillStyle = "#e05b5b"; ctx.fillRect(bx, by, Math.min(bw, bw*castPower), 2);
  }

  // ---------- LOOP ----------
  let last = performance.now();
  function loop(now) {
    let dt = (now - last) / 1000;
    if (dt > 0.05) dt = 0.05; // clamp
    last = now;
    update(dt);
    draw();
    requestAnimationFrame(loop);
  }

  // Load existing progress at startup, if any
  if (hasSave()) loadGame();

  requestAnimationFrame(loop);
})();
</script>
